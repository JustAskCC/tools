  main{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
  section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;margin:0 0 28px;scroll-margin-top:70px}
  .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:4px}
  .num{font-size:13px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
  h2{font-family:Fraunces,serif;font-weight:800;font-size:clamp(24px,3.4vw,34px);margin:0;width:100%}
  .role{color:var(--muted);margin:2px 0 14px}

  .box h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px}
  .box ul{margin:0;padding-left:18px}
  .box li{margin:3px 0}
  .box.flag{background:#f7e9e3}
  .box.flag h3{color:var(--flag)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;transition:transform .15s,box-shadow .15s}
  figure:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
  figure img{display:block;width:100%;height:220px;object-fit:cover;object-position:top;background:#eee}
  figcaption{padding:8px 10px;font-size:13px}
  figcaption b{color:var(--gold)}
  #lb{position:fixed;inset:0;background:rgba(15,12,8,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;flex-direction:column}
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:84vh;border-radius:8px}
  #lb p{color:#fff;margin:12px 0 0;text-align:center;max-width:800px}
  #lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;font-size:26px;width:48px;height:48px;border-radius:50%;cursor:pointer}
  #lb .x{top:16px;right:16px}
  #lb .prev{left:16px;top:50%}
  #lb .next{right:16px;top:50%}
  .fix h2{margin-bottom:6px}
  .fix .grp{margin-top:18px}
  .fix .grp h3{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--flag);margin:0 0 8px}
  .fix ol{margin:0;padding-left:22px}
  .fix li{margin:5px 0}
  .fix .note{color:var(--muted);margin:0}
  .up{margin-top:16px;border:2px dashed var(--line);border-radius:12px;padding:14px;display:none}
  .up.on{display:block}
  .up h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px}
  .up .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .up input[type=text]{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .up label.btn,.up button{background:var(--green);color:#fff;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
  .up input[type=file]{display:none}
  .up .msg{font-size:13px;color:var(--muted);margin-top:6px;min-height:1em}
  .added{margin-top:14px}
  .added:empty{display:none}
  figure .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer;display:none}
  figure{position:relative}
  body.can-edit figure .del{display:block}
  .tag{display:inline-block;background:var(--gold);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:4px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 40px}

const lb = document.getElementById("lb"), lbImg = lb.querySelector("img"), lbCap = lb.querySelector("p");
let cur = 0;
function show(i){ cur = (i + all.length) % all.length; lbImg.src = all[cur].src; lbCap.textContent = all[cur].cap; lb.classList.add("on"); }
function showSrc(src, cap){ lbImg.src = src; lbCap.textContent = cap; lb.classList.add("on"); }
function hide(){ lb.classList.remove("on"); }
main.addEventListener("click", e => {
  if (e.target.closest(".del")) return;
  const f = e.target.closest("figure"); if (!f) return;
  if (f.dataset.src) showSrc(f.dataset.src, f.dataset.cap); else show(+f.dataset.i);
});
lb.querySelector(".x").onclick = hide;
lb.querySelector(".prev").onclick = e => { e.stopPropagation(); show(cur-1); };
lb.querySelector(".next").onclick = e => { e.stopPropagation(); show(cur+1); };
lb.addEventListener("click", e => { if (e.target === lb) hide(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") hide();
  if (e.key === "ArrowLeft") show(cur-1);
  if (e.key === "ArrowRight") show(cur+1);
});

(() => {
  const REPO = "JustAskCC/tools", BRANCH = "main", DIR = "gallery";
  const KEY = "ckuGalleryToken";
  let token = ""; try { token = localStorage.getItem(KEY) || ""; } catch (e) {}
  let uploads = [];
  const foot = document.querySelector("footer");
  const owner = document.createElement("p");
  owner.style.cssText = "margin-top:10px;font-size:13px";
  foot.appendChild(owner);

  const setOwner = () => {
    const on = !!token;
    document.body.classList.toggle("can-edit", on);
    document.querySelectorAll(".up").forEach(u => u.classList.toggle("on", on));
    owner.innerHTML = on ? 'Signed in to add pictures. <a href="#" id="so">Sign out</a>' : '<a href="#" id="si">Owner sign in</a>';
    const a = owner.querySelector("a");
    a.onclick = e => { e.preventDefault();
      if (on) { token = ""; try { localStorage.removeItem(KEY); } catch (e) {} setOwner(); return; }
      const t = (prompt("Paste your GitHub access token for the tools site. It stays only in this browser.") || "").trim();
      if (!t) return; token = t; try { localStorage.setItem(KEY, t); } catch (e) {} setOwner(); };
  };

  const render = () => {
    document.querySelectorAll(".added").forEach(g => g.innerHTML = "");
    uploads.forEach(v => {
      const g = document.getElementById("added-" + v.character) || document.getElementById("added-new");
      if (!g) return;
      const src = "uploads/" + v.file;
      const cap = v.caption || v.characterName || "Added picture";
      g.insertAdjacentHTML("beforeend", `<figure data-src="${esc(src)}" data-cap="${esc(cap)}"><button class="del" title="Remove" data-file="${esc(v.file)}">×</button><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy"><figcaption><span class="tag">New</span>${v.caption ? esc(v.caption) : ""}</figcaption></figure>`);
    });
  };

  const api = async (path, opts = {}) => {
    const r = await fetch("https://api.github.com/repos/" + REPO + path, { ...opts, headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
    if (!r.ok) { const t = await r.text(); const err = new Error(r.status === 401 ? "Your access token didn't work. Sign out and sign in again." : "GitHub said " + r.status + ": " + t.slice(0, 120)); err.status = r.status; throw err; }
    return r.status === 204 ? null : r.json();
  };
  const b64 = async blob => { const buf = new Uint8Array(await blob.arrayBuffer()); let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(s); };
  const toUtf8b64 = str => btoa(unescape(encodeURIComponent(str)));

  // Read the newest list straight from GitHub so two edits never clobber each other
  const freshList = async () => {
    const f = await api("/contents/" + DIR + "/uploads.json?ref=" + BRANCH);
    return JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g, "")))));
  };

  // One commit: add or remove files and write the new uploads.json
  const commit = async (addFiles, removeFiles, makeList, message) => {
    for (let attempt = 0; attempt < 3; attempt++) {
      const ref = await api("/git/ref/heads/" + BRANCH);
      const head = await api("/git/commits/" + ref.object.sha);
      const list = makeList(await freshList());
      const tree = [];
      for (const f of addFiles) { if (!f.blob) f.blob = (await api("/git/blobs", { method: "POST", body: JSON.stringify({ content: f.content, encoding: "base64" }) })).sha; tree.push({ path: DIR + "/uploads/" + f.name, mode: "100644", type: "blob", sha: f.blob }); }
      for (const n of removeFiles) tree.push({ path: DIR + "/uploads/" + n, mode: "100644", type: "blob", sha: null });
      const lb = (await api("/git/blobs", { method: "POST", body: JSON.stringify({ content: toUtf8b64(JSON.stringify(list, null, 1)), encoding: "base64" }) })).sha;
      tree.push({ path: DIR + "/uploads.json", mode: "100644", type: "blob", sha: lb });
      const t = await api("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: head.tree.sha, tree }) });
      const c = await api("/git/commits", { method: "POST", body: JSON.stringify({ message, tree: t.sha, parents: [ref.object.sha] }) });
      try { await api("/git/refs/heads/" + BRANCH, { method: "PATCH", body: JSON.stringify({ sha: c.sha }) }); return list; }
      catch (e) { if (e.status !== 422 || attempt === 2) throw e; }
    }
  };

  // Shrink big images before saving so the site stays fast. Keeps transparency.
  const shrink = file => new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("Couldn't read " + file.name)), "image/webp", 0.86); };
    img.onerror = () => rej(new Error("Couldn't read " + file.name)); img.src = url; });

  document.querySelectorAll(".up input[type=file]").forEach(inp => {
    inp.addEventListener("change", async () => {
      const box = inp.closest(".up"), msg = box.querySelector(".msg"), capEl = box.querySelector(".cap");
      const files = [...inp.files]; if (!files.length) return;
      const caption = capEl.value.trim(), adds = [], entries = [];
      try {
        for (let i = 0; i < files.length; i++) {
          msg.textContent = `Preparing ${i + 1} of ${files.length}...`;
          const blob = await shrink(files[i]);
          const name = box.dataset.char + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + ".webp";
          adds.push({ name, content: await b64(blob) });
          entries.push({ file: name, character: box.dataset.char, characterName: box.dataset.name, caption, createdAt: Date.now() });
        }
        msg.textContent = "Saving to your website...";
        uploads = await commit(adds, [], list => list.concat(entries), `Gallery: add ${files.length} picture${files.length === 1 ? "" : "s"} for ${box.dataset.name}`);
        render();
        msg.textContent = `Added ${files.length} picture${files.length === 1 ? "" : "s"}. They show for everyone in about a minute.`;
      } catch (e) { msg.textContent = (e && e.message) || "Something went wrong. Please try again."; }
      capEl.value = ""; inp.value = "";
    });
  });

  main.addEventListener("click", async e => {
    const b = e.target.closest(".del"); if (!b) return;
    e.stopPropagation();
    if (!b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = "?"; b.title = "Click again to remove"; setTimeout(() => { delete b.dataset.confirm; b.textContent = "×"; }, 3000); return; }
    const f = b.dataset.file;
    try { uploads = await commit([], [f], list => list.filter(v => v.file !== f), "Gallery: remove a picture"); render(); }
    catch (err) { alert((err && err.message) || "Couldn't remove it. Please try again."); }
  });

  setOwner();
  fetch("uploads.json?v=" + Date.now()).then(r => r.ok ? r.json() : []).then(l => { uploads = l; render(); }).catch(() => {});
})();
</script>
</body>
</html>
