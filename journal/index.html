in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 107, "category": 12, "categoryName": "Viability Before Visibility", "title": "Entrepreneurship Looks Different When You Cannot Afford to Fail", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "We tell entrepreneurs that failure is part of the process. That advice sounds different depending on who hears it.\n\n\"Fail fast\" is popular advice. But I keep thinking about what it assumes. It assumes you can afford the fall. Some owners can try an idea, lose money and try again. For others, one bad season can mean personal debt and trouble paying household bills. The lesson is the same. The cost is not. I do not think the answer is to discourage anyone from starting. I think it is to help owners test an idea in a way that fits the risk they can carry. [Add a real example from your mentoring, with no names.]\n\nHow much failure can this owner actually afford?", "resources": [], "talking": ["For one owner, a failed business means losing an investment.", "For another, it can mean debt, a missed rent payment and a hard year for the family.", "Same lesson, very different cost.", "Support should account for how much risk the owner can actually carry."], "linkedin": "\"Fail fast\" is popular advice. But I keep thinking about what it assumes. It assumes you can afford the fall. Some owners can try an idea, lose money and try again. For others, one bad season can mean personal debt and trouble paying household bills. The lesson is the same. The cost is not. I do not think the answer is to discourage anyone from starting. I think it is to help owners test an idea in a way that fits the risk they can carry. [Add a real example from your mentoring, with no names.]\n\nHow much failure can this owner actually afford?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "How much failure can this owner actually afford? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 7. Best format: 60 second video. Data: none needed. This piece works on your mentoring experience.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 108, "category": 12, "categoryName": "Viability Before Visibility", "title": "An Uncertain Economy Does Not Land Evenly", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "When the economy gets uncertain, I do not think everyone feels it the same way.\n\nThe Federal Reserve's 2026 survey found that small firms' expectations for revenue and employment growth fell to their lowest level since 2020. They are still well above that low point, but they have dropped. Now look at the other side of the counter. In March 2026, 72% of service providers surveyed by the Cleveland Fed said financial well being for low and moderate income people had decreased over the past six months. Prices were the main reason. This is my reading, not the survey's: if your customers have room in the budget, they can delay a vacation or eat out a little less. If they were already deciding which bills fit, there is much less room to adjust. And now imagine being the business that depends on them.\n\nWhen customers pull back, which businesses have the least room to absorb it?", "resources": [], "talking": ["In the Federal Reserve's 2026 report, small firms' growth expectations fell to their lowest since 2020, though they remain well above that low point.", "At the same time, service providers in our region say financial well being has dropped for many low and moderate income households.", "A household with room in the budget can wait on a purchase. A household already stretched has much less room.", "A business that depends on stretched households feels pressure from two directions: its own costs and its customers' caution."], "linkedin": "The Federal Reserve's 2026 survey found that small firms' expectations for revenue and employment growth fell to their lowest level since 2020. They are still well above that low point, but they have dropped. Now look at the other side of the counter. In March 2026, 72% of service providers surveyed by the Cleveland Fed said financial well being for low and moderate income people had decreased over the past six months. Prices were the main reason. This is my reading, not the survey's: if your customers have room in the budget, they can delay a vacation or eat out a little less. If they were already deciding which bills fit, there is much less room to adjust. And now imagine being the business that depends on them.\n\nWhen customers pull back, which businesses have the least room to absorb it?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "When customers pull back, which businesses have the least room to absorb it? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 8. Best format: article and carousel. Data: S3 and S5. Say \"firms surveyed.\" Label the last part of the script as your own interpretation.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 109, "category": 12, "categoryName": "Viability Before Visibility", "title": "When Costs Rise, Who Has Room to Adjust?", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "Rising costs hit nearly everyone. I am more interested in who has room to adjust.\n\nThree out of four small employer firms in the Federal Reserve's 2024 survey said rising costs were a financial challenge. The 2026 report says it was by far the top one. When costs rise, a business has a few options. Raise prices, cut costs or borrow. But raising prices only works if customers can pay more. And borrowing only helps if the market can support the repayment. That is why I look at the customer's budget before I look at the business plan.\n\nCan this business pass its costs along, and can its customers afford it?", "resources": [], "talking": ["In the Federal Reserve's 2024 survey, 75% of small employer firms named rising costs as a financial challenge. The 2026 report calls it by far the top one.", "Businesses can raise prices, cut costs or take on debt, but each option depends on the customer.", "Raising prices only works if customers can absorb it.", "Debt only helps if the market can repay it."], "linkedin": "Three out of four small employer firms in the Federal Reserve's 2024 survey said rising costs were a financial challenge. The 2026 report says it was by far the top one. When costs rise, a business has a few options. Raise prices, cut costs or borrow. But raising prices only works if customers can pay more. And borrowing only helps if the market can support the repayment. That is why I look at the customer's budget before I look at the business plan.\n\nCan this business pass its costs along, and can its customers afford it?\n\nBefore you sign the lease, let's look at the market.", "instagram": "Can this business pass its costs along, and can its customers afford it? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 9. Best format: short video. Data: S2 and S3.. Call to action: Before you sign the lease, let's look at the market. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 110, "category": 12, "categoryName": "Viability Before Visibility", "title": "Your Marketing Problem Might Actually Be an Income Problem", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "I have worked in marketing for more than 15 years, so my first instinct is to look for the marketing problem. Is the message wrong? Is the website weak? Are we reaching the right people? But sometimes there is no marketing fix.\n\nIn March 2026, the Cleveland Fed asked service providers across our region how low and moderate income households were doing. 72% said financial well being had decreased over the past six months. Higher prices were the main reason. Think about what that means for the small business down the street. If a household is spending more on rent, groceries and basic bills, something else has to give. I can help a business become more visible. I cannot market another $200 into a customer's bank account. [Add a real example from your work, with no names.]\n\nBefore we diagnose a struggling business with a marketing problem, should we ask whether it is a purchasing power problem?", "resources": [], "talking": ["Marketing can improve how many people know about a business and how well it reaches the right ones.", "It cannot change how much money a customer has to spend.", "Households that are stretched have to choose what gives, and a small business is often part of that choice.", "Before calling it a marketing problem, ask whether it is a purchasing power problem."], "linkedin": "In March 2026, the Cleveland Fed asked service providers across our region how low and moderate income households were doing. 72% said financial well being had decreased over the past six months. Higher prices were the main reason. Think about what that means for the small business down the street. If a household is spending more on rent, groceries and basic bills, something else has to give. I can help a business become more visible. I cannot market another $200 into a customer's bank account. [Add a real example from your work, with no names.]\n\nBefore we diagnose a struggling business with a marketing problem, should we ask whether it is a purchasing power problem?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "Before we diagnose a struggling business with a marketing problem, should we ask whether it is a purchasing power problem? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 10. Best format: article, carousel and video. This is a flagship piece. Data: S5.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 111, "category": 12, "categoryName": "Viability Before Visibility", "title": "Marketing Cannot Manufacture Purchasing Power", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "I still believe in branding. I still believe in social media. But there is a ceiling on what marketing can do.\n\nMarketing can do a lot. It can make a business easier to find, easier to trust and easier to choose. What it cannot do is change a household's budget. In 2024, the lowest income fifth of households spent about $35,000 a year, and the highest fifth spent about $150,000. If a business is built for the second group but sits among the first, a better logo will not close that gap. The fix may be a different offer, a different price point or a way to reach customers beyond the immediate block.\n\nWho can actually afford the offer, and how often?", "resources": [], "talking": ["Marketing can raise awareness, trust and demand among people who can afford the offer.", "It cannot create buying power where there is not enough.", "A bigger audience helps only if enough of that audience can buy.", "The first marketing question should be: who can afford this, and how often?"], "linkedin": "Marketing can do a lot. It can make a business easier to find, easier to trust and easier to choose. What it cannot do is change a household's budget. In 2024, the lowest income fifth of households spent about $35,000 a year, and the highest fifth spent about $150,000. If a business is built for the second group but sits among the first, a better logo will not close that gap. The fix may be a different offer, a different price point or a way to reach customers beyond the immediate block.\n\nWho can actually afford the offer, and how often?\n\nBefore you sign the lease, let's look at the market.", "instagram": "Who can actually afford the offer, and how often? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 11. Best format: carousel. Data: S1.. Call to action: Before you sign the lease, let's look at the market. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 112, "category": 12, "categoryName": "Viability Before Visibility", "title": "The Difference Between Being Known and Being Bought", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "A business can have thousands of followers and still have a quiet cash register.\n\nI love seeing a small business get attention. But attention is not revenue. When I talk with owners, I ask three questions. How many customers do you serve in a week? What is the average sale? How many come back? Those three numbers tell me more about the health of a business than the number of followers. If the first two are low, the market may not have enough buyers. If the third is low, the offer may not be worth returning for. [Add a real example from your work, with no names.]\n\nAre we counting applause or customers?", "resources": [], "talking": ["Followers, likes and compliments measure attention. Sales measure demand.", "Three numbers matter more than follower count: customers per week, average sale and how many come back.", "A business can be popular and still not be profitable.", "Track what pays the bills, not what gets applause."], "linkedin": "I love seeing a small business get attention. But attention is not revenue. When I talk with owners, I ask three questions. How many customers do you serve in a week? What is the average sale? How many come back? Those three numbers tell me more about the health of a business than the number of followers. If the first two are low, the market may not have enough buyers. If the third is low, the offer may not be worth returning for. [Add a real example from your work, with no names.]\n\nAre we counting applause or customers?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "Are we counting applause or customers? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 12. Best format: video and checklist graphic. Data: none needed. This piece draws on your marketing and mentoring experience.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 113, "category": 12, "categoryName": "Viability Before Visibility", "title": "Why \"Support Small Business\" Is Not a Business Model", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "I believe deeply in supporting local businesses. But I do not want a business to survive only because people feel obligated to help it.\n\nSupport can introduce someone to a business. Value has to bring them back. I want the boutique to have customers because people love what it sells. I want the restaurant to have customers because people want the food. I want a service business to have customers because it solves a real problem. In the Federal Reserve's 2024 survey, 57% of small employer firms said reaching customers and growing sales was an operational challenge, the most common one. To me that points to access, not effort. And if the people nearby do not have room in their budget to come back often, the plan has to include reaching customers beyond the block.\n\nWho is the paying customer, and can we reach enough of them?", "resources": [], "talking": ["Community loyalty is valuable. It can introduce someone to a business.", "A lasting business needs a repeatable reason for people to buy.", "Support can start a customer relationship. Value has to bring the customer back.", "If the people nearby cannot buy often, the strategy has to reach customers beyond the immediate neighborhood."], "linkedin": "Support can introduce someone to a business. Value has to bring them back. I want the boutique to have customers because people love what it sells. I want the restaurant to have customers because people want the food. I want a service business to have customers because it solves a real problem. In the Federal Reserve's 2024 survey, 57% of small employer firms said reaching customers and growing sales was an operational challenge, the most common one. To me that points to access, not effort. And if the people nearby do not have room in their budget to come back often, the plan has to include reaching customers beyond the block.\n\nWho is the paying customer, and can we reach enough of them?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "Who is the paying customer, and can we reach enough of them? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 13. Best format: article and video. Data: S2.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 114, "category": 12, "categoryName": "Viability Before Visibility", "title": "Your Target Market Is Not Necessarily the People Who Live Around Your Business", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "One of the most common assumptions I hear is that the neighbors are the customers.\n\nWhen someone opens a business, the first thought is often, \"The neighborhood will support me.\" Sometimes that is true. But median household income on the east side ranges from about $23,000 in East Cleveland to about $103,000 in Beachwood, according to Census Bureau estimates. A business built for customers in one of those places may struggle in the other. So I suggest flipping the question. Who needs this? Who values it? Who can afford it? How often will they buy? Where are they? Then pick the location that makes it easy for them to reach you. [Add a real example from your listings, with no names.]\n\nIs the target market the people who live nearby, or the people who can truly buy?", "resources": [], "talking": ["The people nearby are only part of the picture. The real target market is whoever needs, values and can afford what you sell.", "A business can be in one community and serve customers from another.", "Define the customer first, then find the place where that customer can reach you.", "Look at where your best customers actually come from."], "linkedin": "When someone opens a business, the first thought is often, \"The neighborhood will support me.\" Sometimes that is true. But median household income on the east side ranges from about $23,000 in East Cleveland to about $103,000 in Beachwood, according to Census Bureau estimates. A business built for customers in one of those places may struggle in the other. So I suggest flipping the question. Who needs this? Who values it? Who can afford it? How often will they buy? Where are they? Then pick the location that makes it easy for them to reach you. [Add a real example from your listings, with no names.]\n\nIs the target market the people who live nearby, or the people who can truly buy?\n\nConsidering a new location, a move or an expansion on the east side or anywhere in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help businesses look at the market, the location and the space before they sign a lease. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130.", "instagram": "Is the target market the people who live nearby, or the people who can truly buy? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 14. Best format: carousel and article. Data: S6. Say these are estimates and mention the margin of error.. Call to action: Considering a new location, a move or an expansion on the east side or anywhere in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help businesses look at the market, the location and the space before they sign a lease. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": ["Eastern Suburbs", "East Cleveland"], "uh": false}, {"id": 115, "category": 12, "categoryName": "Viability Before Visibility", "title": "What Exactly Are We Trying to Fix With Small Business Training?", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "I believe strongly in education. I am a lifelong learner myself. But I have started asking a different question: is knowledge actually the thing holding this business back?\n\nTraining is valuable when a lack of knowledge is the real constraint. If an owner does not understand cash flow, teach cash flow. If they do not know how customers find them, teach marketing. But what happens when knowledge is not the constraint? In the Federal Reserve's 2024 survey, the most common operational challenge for small employer firms was reaching customers and growing sales, at 57%. Challenges with hiring and supply chains actually declined. That does not mean training is the wrong tool. It means we should ask, owner by owner, what is really in the way. I do not see this as criticism of any program. I see it as making the diagnosis better. [Add a real example from your mentoring, with no names.]\n\nWhat is actually constraining this business?", "resources": [], "talking": ["If the problem is not knowing the numbers, teach the numbers.", "If the problem is not knowing how customers find you, teach marketing.", "If the problem is too few customers who can afford the offer, another workshop may not be the right tool.", "The goal is to match the help to the constraint."], "linkedin": "Training is valuable when a lack of knowledge is the real constraint. If an owner does not understand cash flow, teach cash flow. If they do not know how customers find them, teach marketing. But what happens when knowledge is not the constraint? In the Federal Reserve's 2024 survey, the most common operational challenge for small employer firms was reaching customers and growing sales, at 57%. Challenges with hiring and supply chains actually declined. That does not mean training is the wrong tool. It means we should ask, owner by owner, what is really in the way. I do not see this as criticism of any program. I see it as making the diagnosis better. [Add a real example from your mentoring, with no names.]\n\nWhat is actually constraining this business?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "What is actually constraining this business? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 15. Best format: article and carousel. Data: S2.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 116, "category": 12, "categoryName": "Viability Before Visibility", "title": "What Happens After the Facade Grant?", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "In my work with the University Heights CIC, I look at business from the neighborhood side. One question keeps coming back to me.\n\nA better storefront matters. It can change how a street feels and how people see a neighborhood. But I have started asking what happens next. After the new sign and the fresh paint, did the business gain customers? Did revenue grow? Did any of those customers come from outside the immediate neighborhood? Did the business last? I do not have the answers for every project, and I think that is the point. If we ask these questions, we can learn which improvements help most. I am asking as someone who cares about both the place and the business inside it.\n\nAfter we improve the place, how do we know the business is stronger?", "resources": [], "talking": ["Improving a storefront can help a corridor look and feel better. That matters.", "The sign goes up, the windows are clean, and the space looks inviting.", "Then what? Did more customers come? Did revenue grow? Did the business survive?", "Asking what happens next is not criticism. It is how we learn what helps most."], "linkedin": "A better storefront matters. It can change how a street feels and how people see a neighborhood. But I have started asking what happens next. After the new sign and the fresh paint, did the business gain customers? Did revenue grow? Did any of those customers come from outside the immediate neighborhood? Did the business last? I do not have the answers for every project, and I think that is the point. If we ask these questions, we can learn which improvements help most. I am asking as someone who cares about both the place and the business inside it.\n\nAfter we improve the place, how do we know the business is stronger?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "After we improve the place, how do we know the business is stronger? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 16. Best format: short video or LinkedIn post. Data: none needed. This is an inquiry piece, so do not state conclusions about any specific program.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": ["Eastern Suburbs"], "uh": false}, {"id": 117, "category": 12, "categoryName": "Viability Before Visibility", "title": "We Count Businesses Served. Should We Count Businesses Strengthened?", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "Working around small business support has made me pay much more attention to the word impact.\n\nIf a program says 300 people attended, 75 businesses got help and 25 storefronts were improved, those are real numbers, and they take real work. I would also like to know what happened next. Did revenue grow? Did the owner start paying herself? Did they hire? Did they survive? Support organizations are stretched. In the Cleveland Fed's March 2026 survey, a large majority of nonprofits said demand for their services had increased, while 48% said their funding had decreased, the highest share since the survey began in 2018. When resources are tight, outcome numbers help organizations show what works and where to focus. If our goal is economic development, I think we should care about both.\n\nIf our goal is economic development, shouldn't we measure both?", "resources": [], "talking": ["A program can report how many people attended, how many got help and how many storefronts changed. Those numbers matter.", "Businesses served is an output. Businesses strengthened is an outcome.", "Outcomes include revenue, survival, owner pay, jobs and new customers.", "Measuring outcomes helps organizations make the case for their work, which matters when resources are tight."], "linkedin": "If a program says 300 people attended, 75 businesses got help and 25 storefronts were improved, those are real numbers, and they take real work. I would also like to know what happened next. Did revenue grow? Did the owner start paying herself? Did they hire? Did they survive? Support organizations are stretched. In the Cleveland Fed's March 2026 survey, a large majority of nonprofits said demand for their services had increased, while 48% said their funding had decreased, the highest share since the survey began in 2018. When resources are tight, outcome numbers help organizations show what works and where to focus. If our goal is economic development, I think we should care about both.\n\nIf our goal is economic development, shouldn't we measure both?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "If our goal is economic development, shouldn't we measure both? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 17. Best format: article. Data: S7.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 118, "category": 12, "categoryName": "Viability Before Visibility", "title": "Why Has This Space Been Vacant for Two Years?", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "As a licensed commercial real estate agent on the east side, I see a lot of empty space. When a space sits for a long time, I have learned the answer is not always another listing.\n\nWhen a storefront or office sits empty for a long time, the usual response is to list it again, lower the price or add a bigger sign. Sometimes that works. But I have learned to start with different questions. Who is actually looking for this kind of space today? What do the people nearby need that they cannot already get? What rent can this market support? What can the building physically accommodate, including parking, layout and access? And are we still chasing the tenant who would have wanted this space ten years ago? The property may be fine. The target may need to change. [Add a real example from your listings, with no names or addresses.]\n\nIs this space being marketed to the right user?", "resources": [], "talking": ["A vacancy is not always a marketing problem. Sometimes the space is being offered to the wrong users.", "Ask who is actually looking for this kind of space right now.", "Ask what the surrounding households need and what the market can pay.", "Ask whether the building suits the use being pursued, and whether ownership is chasing yesterday's tenant."], "linkedin": "When a storefront or office sits empty for a long time, the usual response is to list it again, lower the price or add a bigger sign. Sometimes that works. But I have learned to start with different questions. Who is actually looking for this kind of space today? What do the people nearby need that they cannot already get? What rent can this market support? What can the building physically accommodate, including parking, layout and access? And are we still chasing the tenant who would have wanted this space ten years ago? The property may be fine. The target may need to change. [Add a real example from your listings, with no names or addresses.]\n\nIs this space being marketed to the right user?\n\nOwn a vacant office or retail property in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help owners reposition a property, find realistic tenant targets and market the space to the right users. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130.", "instagram": "Is this space being marketed to the right user? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 18. Best format: article and LinkedIn post. Data: none stated. Optional: add current Cuyahoga County vacancy and asking rent figures once pulled from a verified source.. Call to action: Own a vacant office or retail property in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help owners reposition a property, find realistic tenant targets and market the space to the right users. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 119, "category": 12, "categoryName": "Viability Before Visibility", "title": "Stop Marketing Vacant Space to Everybody", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "A 2,500 square foot storefront is not just retail space available.\n\nA 2,500 square foot storefront could be a clinic, a salon, a small restaurant, a service business or a showroom. Each one needs something different. So before the sign goes up, I ask: who should actually occupy this space? What does the surrounding population look like? What businesses are missing nearby? Where does local spending leave the area? What uses are already everywhere? How is the parking? Who walks or drives past during the day? Once you can answer those, you are no longer marketing space to everybody. You are looking for the right business for the right place.\n\nWho is the best user for this space, and how do we reach them?", "resources": [], "talking": ["\"For lease\" speaks to no one in particular.", "Define the best user: who they are, what they sell and who they serve.", "Match the user to the surroundings: who lives nearby, who passes by, what is missing, what is already oversupplied.", "Check the practical details: parking, visibility, layout and rent."], "linkedin": "A 2,500 square foot storefront could be a clinic, a salon, a small restaurant, a service business or a showroom. Each one needs something different. So before the sign goes up, I ask: who should actually occupy this space? What does the surrounding population look like? What businesses are missing nearby? Where does local spending leave the area? What uses are already everywhere? How is the parking? Who walks or drives past during the day? Once you can answer those, you are no longer marketing space to everybody. You are looking for the right business for the right place.\n\nWho is the best user for this space, and how do we reach them?\n\nOwn a vacant office or retail property in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help owners reposition a property, find realistic tenant targets and market the space to the right users. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130.", "instagram": "Who is the best user for this space, and how do we reach them? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 19. Best format: carousel and video. Data: none needed. Optional: add a local figure from S6 if the property sits in or near one of those communities.. Call to action: Own a vacant office or retail property in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help owners reposition a property, find realistic tenant targets and market the space to the right users. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 120, "category": 12, "categoryName": "Viability Before Visibility", "title": "Viability Before Visibility: The Seven Questions I Ask Before Anyone Says \"Market More", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "Across commercial real estate, mentoring and my work with the University Heights CIC, I keep seeing the same pattern. When a business struggles, we jump to marketing. I think we should ask seven questions first.\n\nWhen a business struggles, the first advice is usually to market more. I have worked in marketing for more than 15 years, and I believe in it. But I think it belongs last, not first. First I ask whether the owner can afford the wait. Then whether the market has enough buying power, whether the location reaches the customer, whether the offer is worth the money, whether the business can reach beyond its block, and whether more capital would help or just fund losses. Only then do I ask how to reach more of the right customers. I call this Viability Before Visibility. It does not replace the help businesses get today. It helps us pick the right help.\n\nWhat is actually constraining this business?", "resources": [], "talking": ["Owner capacity. Can this person financially withstand the normal development period of the business?", "Market capacity. Is there enough buying power nearby for this business?", "Location. Can the business realistically attract its customer from here?", "Offer. Does the product solve something important enough for customers to spend limited money on?", "Market access. Can the business reach customers beyond its immediate block?", "Capital. Would more money create growth, or just finance losses?", "Marketing. Only then, how do we reach more of the right customers?"], "linkedin": "When a business struggles, the first advice is usually to market more. I have worked in marketing for more than 15 years, and I believe in it. But I think it belongs last, not first. First I ask whether the owner can afford the wait. Then whether the market has enough buying power, whether the location reaches the customer, whether the offer is worth the money, whether the business can reach beyond its block, and whether more capital would help or just fund losses. Only then do I ask how to reach more of the right customers. I call this Viability Before Visibility. It does not replace the help businesses get today. It helps us pick the right help.\n\nWhat is actually constraining this business?\n\nConsidering a new location, a move or an expansion on the east side or anywhere in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help businesses look at the market, the location and the space before they sign a lease. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130. Own a vacant office or retail property in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help owners reposition a property, find realistic tenant targets and market the space to the right users. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130.", "instagram": "What is actually constraining this business? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 20. Best format: flagship article, carousel and 90 second video. Data: optional. Use S2 (57% named reaching customers and growing sales as a challenge) as the one number.. Call to action: Considering a new location, a move or an expansion on the east side or anywhere in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help businesses look at the market, the location and the space before they sign a lease. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130. Own a vacant office or retail property in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help owners reposition a property, find realistic tenant targets and market the space to the right users. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": ["Eastern Suburbs"], "uh": false}, {"title": "Your Office Is Telling People Something About Your Business", "seoTitle": "Your Office Is Telling People Something", "meta": "Your office signals stability and trust before you speak. CiCi Caver on treating space as a strategic tool, featuring Landerhaven Office Plaza.", "focus": "office space strategy", "keywords": "office space, office leasing Northeast Ohio, Landerhaven Office Plaza, Mayfield Heights office, professional services office, tenant representation", "article": "Your space is saying something about you, whether you realize it or not.\n\nAnd the people you want to attract, clients, partners, strong talent, they are paying attention.\n\nFor most established businesses, the conversation is not really about square footage. It is about positioning.\n\nWhere you are located. How your space looks. How it feels when someone walks in.\n\nAll of that builds an impression before you even speak.\n\nThere is a reason law firms, financial groups, and consulting firms are very intentional about their space.\n\nIt is not about ego. It is about trust.\n\nA well positioned office signals stability, structure and confidence. And that matters in business.\n\nRight now, the market is opening up opportunities.\n\nOver the past few years, a lot of companies pulled back on space. Because of that, there is more availability in strong areas, and better terms than we have seen in a while.\n\nLandlords are negotiating. Build out options are better. Deals are more flexible.\n\nIf you are thinking long term, this is a moment to look again.\n\nThe real question is not just: \"What am I paying for this space?\"\n\nIt is: \"What is this space actually doing for my business?\"\n\nIs it helping your team perform? Is it supporting your brand? Is it helping you attract the right people?\n\nBecause your environment plays a bigger role than most people think.\n\nOne property worth a serious look right now is Landerhaven Office Plaza in Mayfield Heights.\n\nIt is the kind of address that does the work before you even walk in. Located in one of the most established office corridors in Northeast Ohio, Landerhaven offers professional suites in a setting that signals exactly the kind of stability and presence that high level businesses need to project.\n\nIf you are a law firm, a financial group, a consulting practice, or any established business that understands what its environment communicates, this is a property that deserves your attention.\n\nThe businesses making smart moves right now are not treating space like a fixed expense.\n\nThey are treating it like a tool.\n\nThey are asking: \"What is this space giving back to us?\"\n\nYour office is already telling a story.\n\nThe real question is, is it the one you want it to tell?\n\nIf Landerhaven sounds like the right fit, or if you are still figuring out what the right move looks like, I am here to help you work through it.\n\nLet's find the space that works as hard as you do.\n\nCiCi Caver\nCommercial Real Estate Agent, Kowit and Company Real Estate Group\nccaver@kowitrealestate.com\n216.514.1400 x130", "talking": ["Office space is about positioning, not just square footage", "Law, finance and consulting firms use space to build trust", "The market has more availability and better terms right now", "Ask what your space is doing for your business, not just what it costs", "Landerhaven Office Plaza in Mayfield Heights signals stability and presence"], "linkedin": "Your office is already telling a story. Is it the one you want it to tell? For established businesses, space is about positioning: location, look and how it feels when someone walks in. Right now landlords are negotiating and terms are better than we have seen in a while. If you are evaluating office space in Northeast Ohio, take a serious look at Landerhaven Office Plaza in Mayfield Heights. Let's find the space that works as hard as you do.", "instagram": "Your office speaks before you do. What is yours saying? #OfficeSpace #CommercialRealEstate #MayfieldHeights #NortheastOhio #JustAskCC", "notes": "Article 01 of the 12 article office series for high level tenants, in your edited voice with the Landerhaven ending. Written April 2026. Confirm Landerhaven availability before posting.", "id": 121, "category": 11, "categoryName": "Real Estate Articles and Posts", "resources": [], "status": "Drafted", "publishDate": "", "custom": true, "areas": ["Eastern Suburbs", "Greater Cleveland Region"], "uh": false}, {"title": "Location Matters More Than Aesthetics", "seoTitle": "Choose Space Your Customers Can Find", "meta": "Some owners choose space for lighting and convenience. Customers judge it by visibility, access and signage. A Kowit agent on choosing space that works.", "focus": "choosing commercial space", "keywords": "commercial space location, retail visibility, signage, small business location, tenant representation, Northeast Ohio commercial real estate", "article": "As a new commercial real estate agent, this is one thing I have noticed quickly.\n\nSome business owners choose commercial space based almost entirely on aesthetics, lighting, and their own convenience. Which makes sense. Until you realize your customer sees it completely differently.\n\nYour customer is not thinking about your commute or how good the natural light is. They are paying attention to totally different things.\n\nLike how easy you are to find on a busy street. Can they spot you without having to call you for directions? Can they see your signage from the road, pull in without thinking twice, and actually get through the door without any friction?\n\nBecause if the answer to any of those is no, some of them will just keep driving.\n\nA beautiful space in the wrong location will struggle every single time. It does not matter how good your product is or how nice the buildout looks. If people can not find you, can not park, or can not connect what they see on the outside to what you sell on the inside, you are working against yourself from day one.\n\nThese are the conversations I want to have before you fall in love with a space and before you sign anything.\n\nIf you are a business owner thinking about your next location, or your first one, drop a comment or send me a message. Let's make sure the space works as hard as you do.", "talking": ["Owners often pick space for aesthetics, lighting and their own convenience", "Customers judge visibility from the road, ease of entry and signage", "If they cannot spot you, some will keep driving", "A beautiful space in the wrong location struggles every time", "Have the location conversation before you fall in love with a space"], "linkedin": "Some business owners choose space for the lighting or the short commute. Your customer sees it differently: Can they spot you from a busy street? Read your sign from the road? Pull in without thinking twice? If not, some of them will just keep driving. Let's talk before you fall in love with a space.", "instagram": "Your customer does not care about your natural light. Can they find you? #CommercialRealEstate #SmallBusinessTips #LocationMatters #NortheastOhio #JustAskCC", "notes": "Final approved LinkedIn post, April 2026.", "id": 122, "category": 11, "categoryName": "Real Estate Articles and Posts", "resources": [], "status": "Drafted", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"title": "Businesses Move Too Fast on Space Decisions", "seoTitle": "Don't Rush Into a Commercial Lease", "meta": "CAM charges, HVAC duties and build out delays surprise tenants who sign too fast. A Kowit agent on understanding total occupancy cost first.", "focus": "commercial lease costs", "keywords": "commercial lease, CAM charges, tenant improvement allowance, HVAC responsibility, occupancy cost, small business lease, Northeast Ohio", "article": "Something I'm starting to notice as I step deeper into commercial real estate.\n\nBusinesses move too fast on space decisions.\n\nA great location gets them excited. The square footage looks right. The rent seems manageable. So they sign.\n\nThen the real costs show up.\n\nCAM charges they did not ask about. HVAC responsibilities buried in the lease language. Tenant improvement allowances that do not stretch nearly as far as expected. A build out timeline that pushes their opening back 60 days. Carrying costs they were not budgeting for while the space sits empty.\n\nBy the time they are open, they are already behind.\n\nThis is not a landlord problem or a tenant problem. It is a preparation problem. Most business owners have never negotiated a commercial lease before. They are making one of the biggest financial commitments of their business life without a full picture of what they are actually agreeing to.\n\nThe space that looks like a deal on day one can become the thing that quietly drains cash flow for years.\n\nBefore you fall in love with a location, understand the full cost of occupancy. Understand what the lease is actually saying. Understand what you are responsible for and what happens if something goes wrong.\n\nThe right space at the wrong terms is still the wrong space.\n\nIf you are a business owner in Northeast Ohio thinking about leasing commercial space, I would be glad to walk you through what to look for before you sign anything. No pressure, just clarity.", "talking": ["Businesses sign too fast once a location excites them", "Hidden costs: CAM charges, HVAC duties, TI allowances, build out delays, carrying costs", "It is a preparation problem, not a landlord or tenant problem", "Understand the full cost of occupancy before you sign", "The right space at the wrong terms is still the wrong space"], "linkedin": "The right space at the wrong terms is still the wrong space. CAM charges, HVAC responsibilities, TI allowances that do not stretch far enough and build out delays catch business owners every day. Before you sign, understand the full cost of occupancy. If you are leasing in Northeast Ohio, I am glad to walk you through it. No pressure, just clarity.", "instagram": "The right space at the wrong terms is still the wrong space. Know your full cost before you sign. #CommercialLease #SmallBusiness #CommercialRealEstate #NortheastOhio #JustAskCC", "notes": "LinkedIn post, April 2026.", "id": 123, "category": 11, "categoryName": "Real Estate Articles and Posts", "resources": [], "status": "Drafted", "publishDate": "", "custom": true, "areas": ["Greater Cleveland Region"], "uh": false}, {"title": "Facebook Group Introduction Post", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "For small business groups:\n\nHey everyone! I'm CiCi, a licensed Commercial Real Estate Agent in Northeast Ohio. I specialize in helping small businesses find the right commercial space, whether you're looking to lease your first location or ready to expand into something bigger. I'd love to help!\n\nFor real estate agent groups:\n\nHey everyone! I'm CiCi Caver, a licensed agent with Kowit and Company Real Estate Group in Northeast Ohio. I focus on the commercial side, retail, office, industrial, and land across the greater Cleveland area. Always happy to connect with other agents, share insight, and collaborate where it makes sense. Looking forward to getting to know everyone!", "talking": ["Keep the introduction soft and unpromotional", "Business owner version: first location or expanding into something bigger", "Agent version: commercial focus across retail, office, industrial and land"], "linkedin": "", "instagram": "", "notes": "Approved April 2026. The business owner version is the final one you edited.", "id": 129, "category <script>
(function(){
var SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
var S = JSON.parse(document.getElementById("state").textContent);
var READONLY = document.documentElement.hasAttribute("data-readonly");
var ui = {uh:false, cat:"all", status:"all", area:"all", q:"", sel:null, view:"topics", mode:"view"};
function regions(){return (S.coverage&&S.coverage.regions)||[]}
var artifact = null, canSave = false, timer = null;
var $ = function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function catName(id){for(var i=0;i<S.categories.length;i++){if(String(S.categories[i].id)===String(id))return S.categories[i].name}return "Uncategorized"}
function topic(id){for(var i=0;i<S.topics.length;i++){if(S.topics[i].id===id)return S.topics[i]}return null}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1600)}
function copy(text,label){
  if(!navigator.clipboard){toast("Copy is not available in this view");return}
  navigator.clipboard.writeText(text).then(function(){toast((label||"Text")+" copied")},function(){toast("Copy was blocked. Select the text and copy it instead")});
}
function setSave(cls,txt){var s=$("save");s.className="save "+cls;$("saveText").textContent=txt}

/* ---------- saving: regenerate this page with the new state and publish it ---------- */
function buildDoc(){
  var json = JSON.stringify(S).replace(/</g,"\\u003c");
  var open = '<script type="application/json" id="state">';
  var a = SOURCE.indexOf(open), b = SOURCE.indexOf("</"+"script>", a);
  return SOURCE.slice(0,a+open.length) + json + SOURCE.slice(b);
}
function changed(){
  if(!canSave){setSave("off","Not saved in this view");return}
  setSave("busy","Saving");
  clearTimeout(timer);
  timer=setTimeout(function(){
    artifact.publish(buildDoc()).then(function(){setSave("","Saved")}).catch(function(e){
      var c=e&&(e.code||e.name||e.message)||"";
      if(/conflict/i.test(c)){setSave("busy","Someone else saved; reloading")}
      else if(/not_granted|not_writer/i.test(c)){canSave=false;setSave("off","View only")}
      else setSave("off","Could not save. Try again");
    });
  },1200);
}

/* ---------- filtering ---------- */
function haystack(t){return [t.title,t.seoTitle,t.meta,t.focus,t.keywords,t.article,(t.resources||[]).join(" "),(t.talking||[]).join(" "),t.linkedin,t.instagram,t.notes,catName(t.category)].join(" ").toLowerCase()}
function filtered(){
  var q=ui.q.trim().toLowerCase();
  return S.topics.filter(function(t){
    if(ui.cat!=="all"&&String(t.category)!==String(ui.cat))return false;
    if(ui.status!=="all"&&t.status!==ui.status)return false;
    if(ui.area!=="all"&&(t.areas||[]).indexOf(ui.area)<0)return false;
    if(ui.uh&&!t.uh)return false;
    if(q){var h=haystack(t);var parts=q.split(/\s+/);for(var i=0;i<parts.length;i++){if(h.indexOf(parts[i])<0)return false}}
    return true;
  }).sort(function(a,b){return a.id-b.id});
}

/* ---------- rail ---------- */
function renderRail(){
  var counts={};S.statuses.forEach(function(s){counts[s]=0});
  S.topics.forEach(function(t){counts[t.status]=(counts[t.status]||0)+1});
  var h='<div class="stats"><div class="stat"><b>'+S.topics.length+'</b><small>Topics</small></div>';
  ["Drafted","Ready","Scheduled","Published"].forEach(function(s){h+='<div class="stat"><b class="s-'+s+'" style="color:var(--st-'+s.toLowerCase()+')">'+(counts[s]||0)+'</b><small>'+s+'</small></div>'});
  h+='</div><h3>Status</h3><div class="filt">';
  h+='<button data-status="all" aria-pressed="'+(ui.status==="all")+'"><span>All statuses</span><span class="n">'+S.topics.length+'</span></button>';
  S.statuses.forEach(function(s){h+='<button data-status="'+esc(s)+'" aria-pressed="'+(ui.status===s)+'"><span>'+esc(s)+'</span><span class="n">'+(counts[s]||0)+'</span></button>'});
  h+='</div><h3>Area</h3><div class="filt">';
  h+='<button data-area="all" aria-pressed="'+(ui.area==="all")+'"><span>All areas</span><span class="n">'+S.topics.length+'</span></button>';
  regions().forEach(function(r){
    var n=S.topics.filter(function(t){return (t.areas||[]).indexOf(r.name)>=0}).length;
    h+='<button data-area="'+esc(r.name)+'" aria-pressed="'+(ui.area===r.name)+'"><span>'+esc(r.name)+'</span><span class="n">'+n+'</span></button>';
  });
  h+='</div><h3>Category</h3><div class="filt">';
  h+='<button data-cat="all" aria-pressed="'+(ui.cat==="all")+'"><span>All categories</span><span class="n">'+S.topics.length+'</span></button>';
  S.categories.forEach(function(c){
    var n=S.topics.filter(function(t){return String(t.category)===String(c.id)}).length;
    h+='<button data-cat="'+esc(c.id)+'" aria-pressed="'+(String(ui.cat)===String(c.id))+'"><span>'+esc(c.name)+'</span><span class="n">'+n+'</span></button>';
  });
  h+='</div>';
  $("rail").innerHTML=h;
}

/* ---------- list ---------- */
function renderList(){
  var L=filtered();
  $("results").textContent=L.length+" of "+S.topics.length+" topics";
  if(!L.length){$("items").innerHTML='<div class="empty">No topics match. Clear the search or pick another filter.</div>';return}
  $("items").innerHTML=L.map(function(t){
    return '<button class="item" data-id="'+t.id+'" aria-current="'+(ui.sel===t.id)+'"><span class="num">'+t.id+'</span><span><span class="t">'+esc(t.title)+'</span><span class="meta"><span class="pill s-'+esc(t.status)+'">'+esc(t.status)+'</span><span>'+esc(catName(t.category))+'</span>'+(t.publishDate?'<span>'+esc(t.publishDate)+'</span>':'')+'</span></span></button>';
  }).join("");
}

/* ---------- detail ---------- */
function para(text){return String(text||"").split(/\n\s*\n/).map(function(p){return "<p>"+esc(p.trim())+"</p>"}).join("")}
function counter(len,max){return '<span class="count'+(len>max?' over':'')+'">'+len+' / '+max+'</span>'}
function asMarkdown(t){
  return "# "+t.title+"\n\nSEO title: "+t.seoTitle+"\nMeta description: "+t.meta+"\nFocus keyword: "+t.focus+"\nKeywords: "+t.keywords+"\n\n"+t.article+"\n\nLocal resources\n"+(t.resources||[]).map(function(r){return "* "+r}).join("\n")+"\n\nTalking points\n"+(t.talking||[]).map(function(r){return "* "+r}).join("\n")+"\n\nLinkedIn: "+t.linkedin+"\n\nInstagram and Facebook: "+t.instagram;
}
function renderDetail(){
  var t=topic(ui.sel), d=$("detail");
  if(ui.mode==="add"){d.innerHTML=formHtml(null);bindForm(null);return}
  if(!t){d.innerHTML='<div class="empty">Pick a topic from the list to read it, copy its pieces, or update its status.</div>';return}
  if(ui.mode==="edit"){d.innerHTML=formHtml(t);bindForm(t);return}
  var h='<div class="dhead"><span class="eyebrow">Topic '+t.id+' · '+esc(catName(t.category))+'</span><h2>'+esc(t.title)+'</h2>';
  h+='<div class="chips">'+(t.uh?'<span class="chip uh">University Heights</span>':'')+((t.areas&&t.areas.length)?t.areas.map(function(a){return '<span class="chip">'+esc(a)+'</span>'}).join(""):'<span class="chip muted">No area set</span>')+'</div>';
  if(READONLY){
    h+='<div class="controls"><span class="pill s-'+esc(t.status)+'">'+esc(t.status)+'</span>'+(t.publishDate?'<span class="count">Publish date '+esc(t.publishDate)+'</span>':'')+'<button class="btn small" id="copyAll">Copy everything</button>';
  } else {
  h+='<div class="controls"><label for="st">Status <select id="st">'+S.statuses.map(function(s){return '<option'+(s===t.status?' selected':'')+'>'+esc(s)+'</option>'}).join("")+'</select></label>';
  h+='<label for="pd">Publish date <input id="pd" type="date" value="'+esc(t.publishDate)+'"></label>';
  h+='<button class="btn small" id="copyAll">Copy everything</button><button class="btn small" id="editBtn">Edit</button>';
  if(t.custom)h+='<button class="btn small danger" id="delBtn">Delete</button>';
  }
  h+='</div></div>';
  h+='<div class="block"><h4>SEO</h4><dl class="kv">';
  h+='<dt>SEO title</dt><dd>'+esc(t.seoTitle)+' '+counter((t.seoTitle||"").length,60)+'</dd><dd><button class="btn small" data-copy="seoTitle">Copy</button></dd>';
  h+='<dt>Meta description</dt><dd>'+esc(t.meta)+' '+counter((t.meta||"").length,160)+'</dd><dd><button class="btn small" data-copy="meta">Copy</button></dd>';
  h+='<dt>Focus keyword</dt><dd>'+esc(t.focus)+'</dd><dd><button class="btn small" data-copy="focus">Copy</button></dd>';
  h+='<dt>Keywords</dt><dd>'+esc(t.keywords)+'</dd><dd><button class="btn small" data-copy="keywords">Copy</button></dd>';
  h+='</dl></div>';
  h+='<div class="block"><h4>Captions</h4>';
  h+='<div class="caption"><b>LinkedIn <button class="btn small" data-copy="linkedin">Copy</button></b>'+esc(t.linkedin)+'</div>';
  h+='<div class="caption"><b>Instagram and Facebook <button class="btn small" data-copy="instagram">Copy</button></b>'+esc(t.instagram)+'</div></div>';
  h+='<div class="block"><h4>Article <button class="btn small" data-copy="article">Copy article</button></h4><div class="article">'+(t.article?para(t.article):'<p class="count">No article yet.</p>')+'</div></div>';
  h+='<div class="block"><h4>Local resources <button class="btn small" data-copylist="resources">Copy</button></h4>'+listHtml(t.resources)+'</div>';
  h+='<div class="block"><h4>Talking points <button class="btn small" data-copylist="talking">Copy</button></h4>'+listHtml(t.talking)+'</div>';
  if(READONLY){ if(t.notes)h+='<div class="block"><h4>Notes</h4><p style="margin:0">'+esc(t.notes)+'</p></div>'; }
  else h+='<div class="block"><h4>Notes</h4><textarea id="notes" placeholder="Ideas, stories to add, where you posted it">'+esc(t.notes)+'</textarea></div>';
  d.innerHTML=h;
  d.scrollTop=0;
  $("copyAll").onclick=function(){copy(asMarkdown(t),"Topic")};
  d.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){copy(t[b.dataset.copy]||"",b.closest(".block").querySelector("h4").firstChild.textContent.trim())}});
  d.querySelectorAll("[data-copylist]").forEach(function(b){b.onclick=function(){copy((t[b.dataset.copylist]||[]).map(function(x){return "* "+x}).join("\n"),"List")}});
  if(READONLY)return;
  $("st").onchange=function(){t.status=this.value;changed();renderRail();renderList()};
  $("pd").onchange=function(){t.publishDate=this.value;changed();renderList()};
  $("notes").onchange=function(){t.notes=this.value;changed()};
  $("editBtn").onclick=function(){ui.mode="edit";renderDetail()};
  if($("delBtn"))$("delBtn").onclick=function(){confirmDelete(t)};
}
function listHtml(a){return (a&&a.length)?'<ul class="clean">'+a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ul>':'<p class="count">None yet.</p>'}
function confirmDelete(t){
  var c=document.querySelector("#detail .controls");
  c.insertAdjacentHTML("beforeend",'<span id="cfm">Delete this topic? <button class="btn small danger" id="yes">Yes, delete</button> <button class="btn small" id="no">Keep it</button></span>');
  $("no").onclick=function(){$("cfm").remove()};
  $("yes").onclick=function(){S.topics=S.topics.filter(function(x){return x!==t});ui.sel=null;changed();renderAll();toast("Topic deleted")};
}

/* ---------- add / edit form ---------- */
function formHtml(t){
  var v=t||{title:"",category:S.categories[0].id,status:"Idea",seoTitle:"",meta:"",focus:"",keywords:"",article:"",resources:[],talking:[],linkedin:"",instagram:"",notes:"",publishDate:""};
  var h='<div class="dhead"><span class="eyebrow">'+(t?'Editing topic '+t.id:'New topic')+'</span><h2>'+(t?esc(t.title):'Add a topic')+'</h2></div><form id="f" class="block">';
  if(!t)h+='<div class="banner">Only the title is required. Start with an idea and fill in the rest later.</div>';
  h+='<div class="field"><label for="f-title">Title</label><input id="f-title" required value="'+esc(v.title)+'"></div>';
  h+='<div class="grid2"><div class="field"><label for="f-cat">Category</label><select id="f-cat">'+S.categories.map(function(c){return '<option value="'+esc(c.id)+'"'+(String(c.id)===String(v.category)?' selected':'')+'>'+esc(c.name)+'</option>'}).join("")+'<option value="__new">New category</option></select></div>';
  h+='<div class="field"><label for="f-status">Status</label><select id="f-status">'+S.statuses.map(function(s){return '<option'+(s===v.status?' selected':'')+'>'+esc(s)+'</option>'}).join("")+'</select></div></div>';
  h+='<fieldset class="field areas"><legend>Area</legend>'+regions().map(function(r,i){return '<label for="f-area-'+i+'"><input type="checkbox" id="f-area-'+i+'" value="'+esc(r.name)+'"'+((v.areas||[]).indexOf(r.name)>=0?' checked':'')+'> '+esc(r.name)+'</label>'}).join("")+'</fieldset>';
  h+='<label class="uhcheck" for="f-uh"><input type="checkbox" id="f-uh"'+(v.uh?' checked':'')+'> Show this in the University Heights tab</label>';
  h+='<div class="field" id="newCatWrap" hidden><label for="f-newcat">New category name</label><input id="f-newcat"></div>';
  h+='<div class="field"><label for="f-seo">SEO title</label><input id="f-seo" value="'+esc(v.seoTitle)+'"><span class="hint">Aim for 60 characters or fewer</span></div>';
  h+='<div class="field"><label for="f-meta">Meta description</label><textarea id="f-meta" style="min-height:60px">'+esc(v.meta)+'</textarea><span class="hint">Aim for 160 characters or fewer</span></div>';
  h+='<div class="grid2"><div class="field"><label for="f-focus">Focus keyword</label><input id="f-focus" value="'+esc(v.focus)+'"></div>';
  h+='<div class="field"><label for="f-kw">Keywords</label><input id="f-kw" value="'+esc(v.keywords)+'"><span class="hint">Separate with commas</span></div></div>';
  h+='<div class="field"><label for="f-art">Article</label><textarea id="f-art" style="min-height:240px">'+esc(v.article)+'</textarea><span class="hint">Leave a blank line between paragraphs</span></div>';
  h+='<div class="field"><label for="f-res">Local resources</label><textarea id="f-res">'+esc((v.resources||[]).join("\n"))+'</textarea><span class="hint">One per line</span></div>';
  h+='<div class="field"><label for="f-tp">Talking points</label><textarea id="f-tp">'+esc((v.talking||[]).join("\n"))+'</textarea><span class="hint">One per line</span></div>';
  h+='<div class="field"><label for="f-li">LinkedIn caption</label><textarea id="f-li">'+esc(v.linkedin)+'</textarea></div>';
  h+='<div class="field"><label for="f-ig">Instagram and Facebook caption</label><textarea id="f-ig">'+esc(v.instagram)+'</textarea></div>';
  h+='<div class="controls"><button class="btn primary" type="submit">'+(t?'Save changes':'Add topic')+'</button><button class="btn" type="button" id="cancel">Cancel</button></div></form>';
  return h;
}
function lines(s){return s.split("\n").map(function(x){return x.replace(/^[*•]\s*/,"").trim()}).filter(Boolean)}
function bindForm(t){
  $("f-cat").onchange=function(){$("newCatWrap").hidden=this.value!=="__new"};
  $("cancel").onclick=function(){ui.mode="view";renderDetail()};
  $("f").onsubmit=function(e){
    e.preventDefault();
    var title=$("f-title").value.trim(); if(!title){$("f-title").focus();return}
    var cat=$("f-cat").value;
    if(cat==="__new"){
      var nm=$("f-newcat").value.trim(); if(!nm){$("f-newcat").focus();return}
      var nid=S.categories.reduce(function(m,c){return Math.max(m,+c.id||0)},0)+1;
      S.categories.push({id:nid,name:nm}); cat=nid;
    }
    var o=t||{id:S.topics.reduce(function(m,x){return Math.max(m,x.id)},0)+1,custom:true,notes:"",publishDate:""};
    o.title=title; o.category=isNaN(+cat)?cat:+cat; o.categoryName=catName(o.category); o.status=$("f-status").value;
    o.seoTitle=$("f-seo").value.trim(); o.meta=$("f-meta").value.trim(); o.focus=$("f-focus").value.trim(); o.keywords=$("f-kw").value.trim();
    o.article=$("f-art").value.trim(); o.resources=lines($("f-res").value); o.talking=lines($("f-tp").value);
    o.linkedin=$("f-li").value.trim(); o.instagram=$("f-ig").value.trim();
    o.uh=$("f-uh").checked;
    o.areas=[].slice.call(document.querySelectorAll(".areas input:checked")).map(function(x){return x.value});
    if(!t)S.topics.push(o);
    ui.sel=o.id; ui.mode="view"; changed(); renderAll(); toast(t?"Changes saved":"Topic added");
  };
}

/* ---------- resources ---------- */
function renderResources(){
  var groups=[];S.resources.forEach(function(r){if(groups.indexOf(r.group)<0)groups.push(r.group)});
  var h='<div class="dhead"><span class="eyebrow">Directory</span><h2>Local resources</h2><p class="count" style="font-size:.9rem;max-width:68ch">Programs referenced across your articles. Confirm hours and eligibility before publishing, since programs change. The count shows how many topics mention each one.</p><div class="controls">'+(READONLY?'':'<button class="btn small" id="addRes">Add resource</button>')+'</div></div><div id="resForm"></div>';
  groups.forEach(function(g){
    h+='<div class="res-group"><h3>'+esc(g)+'</h3>';
    S.resources.forEach(function(r,i){ if(r.group!==g)return;
      var key=r.name.split(",")[0].replace(/\s*\(.*\)/,"").toLowerCase();
      var used=S.topics.filter(function(t){return haystack(t).indexOf(key)>=0}).length;
      h+='<div class="res-card"><div><div class="name">'+esc(r.name)+'</div><div>'+esc(r.detail)+'</div>'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.url.replace(/^https?:\/\//,""))+'</a>':'')+'</div><div style="text-align:right"><div class="used">'+used+' topics</div><button class="btn small" data-find="'+esc(key)+'">Show topics</button> <button class="btn small" data-rescopy="'+i+'">Copy</button></div></div>';
    });
    h+='</div>';
  });
  if(S.sources&&S.sources.length){h+='<div class="res-group"><h3>Sources</h3><ul class="clean">'+S.sources.map(function(s){return '<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a></li>'}).join("")+'</ul></div>'}
  var p=$("resPage"); p.innerHTML=h;
  p.querySelectorAll("[data-find]").forEach(function(b){b.onclick=function(){ui.q=b.dataset.find;$("q").value=ui.q;ui.cat="all";ui.status="all";setView("topics")}});
  p.querySelectorAll("[data-rescopy]").forEach(function(b){b.onclick=function(){var r=S.resources[+b.dataset.rescopy];copy(r.name+": "+r.detail+(r.url?" "+r.url:""),"Resource")}});
  if($("addRes"))$("addRes").onclick=function(){
    var groups2=groups.map(function(g){return '<option>'+esc(g)+'</option>'}).join("");
    $("resForm").innerHTML='<form class="block" id="rf"><div class="grid2"><div class="field"><label for="r-name">Name</label><input id="r-name" required></div><div class="field"><label for="r-group">Group</label><select id="r-group">'+groups2+'</select></div></div><div class="field"><label for="r-detail">What it offers</label><input id="r-detail"></div><div class="field"><label for="r-url">Website</label><input id="r-url" type="url" placeholder="https://"></div><div class="controls"><button class="btn primary" type="submit">Add resource</button><button class="btn" type="button" id="r-cancel">Cancel</button></div></form>';
    $("r-cancel").onclick=function(){$("resForm").innerHTML=""};
    $("rf").onsubmit=function(e){e.preventDefault();var n=$("r-name").value.trim();if(!n)return;S.resources.push({group:$("r-group").value,name:n,detail:$("r-detail").value.trim(),url:$("r-url").value.trim()});changed();renderResources();toast("Resource added")};
  };
}

/* ---------- coverage ---------- */
function renderCoverage(){
  var C=S.coverage||{}, h='<div class="dhead"><span class="eyebrow">Community and Civic Life</span><h2>'+esc(C.headline||"Coverage")+'</h2></div>';
  h+='<p class="lead">'+esc(C.direction||"")+'</p>';
  if(C.focusNote)h+='<div class="banner">'+esc(C.focusNote)+'</div>';
  h+='<div class="res-group"><h3>What we cover</h3><div class="chips">'+(C.beats||[]).map(function(b){return '<span class="chip">'+esc(b)+'</span>'}).join("")+'</div></div>';
  h+='<div class="res-group"><h3>Where we cover</h3><div class="cov-grid">';
  regions().forEach(function(r){
    var n=S.topics.filter(function(t){return (t.areas||[]).indexOf(r.name)>=0}).length;
    h+='<div class="cov-card"><h4>'+esc(r.name)+'</h4><p>'+esc(r.focus)+'</p><p class="places">'+esc((r.places||[]).join(", "))+'</p><button class="btn small" data-area-go="'+esc(r.name)+'">See '+n+' topics</button></div>';
  });
  h+='</div></div>';
  h+='<div class="res-group"><h3>Story test</h3><ul class="clean">'+(C.tests||[]).map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ul></div>';
  var p=$("covPage"); p.innerHTML=h;
  p.querySelectorAll("[data-area-go]").forEach(function(b){b.onclick=function(){ui.area=b.dataset.areaGo;ui.cat="all";ui.status="all";ui.q="";$("q").value="";setView("topics")}});
}

/* ---------- views & events ---------- */
function setView(v){
  ui.uh=(v==="uh"); if(v==="uh")v="topics";
  ui.view=v;
  $("tab-topics").setAttribute("aria-selected",v==="topics"&&!ui.uh);
  $("tab-uh").setAttribute("aria-selected",ui.uh);
  $("tab-resources").setAttribute("aria-selected",v==="resources");
  $("tab-coverage").setAttribute("aria-selected",v==="coverage");
  $("uhbar").hidden=!ui.uh;
  if(ui.uh){var n=S.topics.filter(function(t){return t.uh}).length;$("uhbar").innerHTML='<b>University Heights</b>'+n+' articles, ideas and pieces about University Heights, from corridor revitalization to city services and the CIC. University Heights content reflects my personal involvement in the community, not the official City of University Heights website.'+(READONLY?'':' Check "Show this in the University Heights tab" when you add or edit a topic to include it here.')}
  $("list").hidden=v!=="topics"; $("detail").hidden=v!=="topics"; $("resPage").hidden=v!=="resources"; $("covPage").hidden=v!=="coverage";
  if(v==="resources"){renderResources();if(location.hash!=="#resources")history.replaceState(null,"","#resources")}
  else if(v==="coverage"){renderCoverage();if(location.hash!=="#coverage")history.replaceState(null,"","#coverage")}
  else renderAll();
}
function renderAll(){renderRail();renderList();renderDetail();
  var want=ui.uh?"#university-heights":(ui.sel?"#topic-"+ui.sel:"");
  if(ui.view==="topics"&&location.hash!==want){try{history.replaceState(null,"",want||location.pathname)}catch(e){}}
}
function fromHash(){
  var h=location.hash;
  if(h==="#resources"){setView("resources");return}
  if(h==="#coverage"){setView("coverage");return}
  if(h==="#university-heights"){setView("uh");return}
  var m=h.match(/^#topic-(\d+)$/); if(m&&topic(+m[1]))ui.sel=+m[1];
  setView("topics");
}
$("rail").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.status)ui.status=b.dataset.status; if(b.dataset.cat)ui.cat=b.dataset.cat; if(b.dataset.area)ui.area=b.dataset.area;
  if(ui.view!=="topics")setView("topics"); else {renderRail();renderList()}});
$("items").addEventListener("click",function(e){var b=e.target.closest(".item");if(!b)return;ui.sel=+b.dataset.id;ui.mode="view";renderAll()});
$("q").addEventListener("input",function(){ui.q=this.value;renderList()});
$("tab-topics").onclick=function(){setView("topics")};
$("tab-resources").onclick=function(){setView("resources")};
$("tab-coverage").onclick=function(){setView("coverage")};
$("tab-uh").onclick=function(){ui.cat="all";ui.status="all";ui.area="all";var L=S.topics.filter(function(t){return t.uh});if(L.length&&!(topic(ui.sel)||{}).uh)ui.sel=L[0].id;setView("uh")};
$("addBtn").onclick=function(){ui.mode="add";setView("topics");$("detail").scrollTop=0;var f=$("f-title");if(f)f.focus()};
window.addEventListener("hashchange",fromHash);

if(READONLY){$("addBtn").hidden=true;}
if(!ui.sel)ui.sel=1;
fromHash();
setSave("off","Connecting");
if(READONLY){setSave("off","Read only copy");}
else if(window.claude&&claude.use){
  claude.use("artifact").then(function(a){
    if(a){artifact=a;canSave=true;setSave("","All changes saved")}
    else setSave("off","View only here. Open the page on claude.ai to save");
  }).catch(function(){setSave("off","View only")});
} else setSave("off","View only here. Open the page on claude.ai to save");
})();
</script>
</body>
</html>
