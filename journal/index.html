e not enough; jobs change", "Outside networks provide perspective, opportunities, mentorship and resilience", "Women are often excluded from informal workplace networks", "Local options: ECDI WBC, CREW Cleveland, CBM, COSE, Cleveland Leadership Center", "Start building before you need it"], "linkedin": "Many of my best opportunities came from people I met in one part of my career who remembered me in another. Women especially need networks beyond the workplace: ECDI's Women's Business Center, CREW Cleveland, Cleveland Business Mentors and more. Your job is one chapter. Your network is your story.", "instagram": "Build your network before you need it. Women lifting women, beyond the office walls. #WomenNetworking #WomenSupportingWomen #CareerGrowth #ClevelandWomen #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cuyahoga County", "Greater Cleveland Region"], "uh": false}, {"id": 88, "category": 9, "categoryName": "Women, Work and Modern Life", "title": "The Challenges of Balancing Motherhood and Ambition", "seoTitle": "Balancing Motherhood and Ambition", "meta": "A mom of four and entrepreneur shares honest lessons on balancing motherhood and ambition, plus local resources that help.", "focus": "motherhood and ambition", "keywords": "working mothers, motherhood and career, mom entrepreneurs, work life balance, ambitious moms, parenting and business, mom guilt", "article": "I am a mom of four. I am also a business owner, commercial real estate agent, student and community leader. People often ask how I balance it all. The honest answer is that I do not always balance it perfectly. Some days the scales tip toward work. Some days they tip toward my kids. Most days, I am just trying to do my best in both.\n\nBalancing motherhood and ambition is one of the most common challenges women face, and one of the least openly discussed.\n\nHere are the challenges I know well.\n\nTime. There are only so many hours in a day. Every hour spent on work is an hour not spent with family, and the reverse is also true.\n\nGuilt. Many mothers feel guilty when working and guilty when not working. It can feel like there is no way to win.\n\nJudgment. Ambitious mothers sometimes face criticism for prioritizing career, while stay at home mothers face different judgment. Neither deserves it.\n\nWorkplace barriers. Inflexible schedules, limited childcare and bias against mothers make career advancement harder.\n\nExhaustion. Caring for children while building a career takes enormous physical and emotional energy.\n\nIdentity. Some women feel they lose themselves in motherhood. Others feel their ambition makes them less of a mother.\n\nHere is what has helped me.\n\nLet go of perfect balance. I aim for balance over time, not every day.\n\nInvolve my children. I talk with my kids about my work so they understand what I do and why. When they see me building businesses and serving the community, they learn about work, purpose and possibility.\n\nUse flexibility. Entrepreneurship gave me more control over my schedule. Not every career allows that, but many women find flexibility in business ownership.\n\nAsk for help. Family, friends, childcare providers and virtual assistants all make my life possible.\n\nProtect family time. Some moments are non negotiable, and I guard them.\n\nTake care of myself. I cannot pour from an empty cup.\n\nRelease guilt. My children benefit from having a mother who pursues her goals.\n\nFor mothers building businesses, local resources can help make ambition more manageable. The ECDI Women's Business Center of Northern Ohio offers training and support designed for women entrepreneurs. Cleveland Business Mentors provides free mentoring that can help mothers build efficient, sustainable businesses. Heights Libraries offers free programs for children, which can give kids enriching activities while parents work nearby, along with meeting rooms for parents who need a professional space.\n\nMotherhood and ambition do not have to compete. They can actually strengthen each other. Motherhood has made me more patient, organized and compassionate. Ambition has given my children a model of what is possible. Both are part of who I am.", "resources": ["ECDI Women's Business Center of Northern Ohio: support for women entrepreneurs", "Cleveland Business Mentors: free mentoring for sustainable businesses", "Heights Libraries: children's programs and meeting rooms"], "talking": ["Balance happens over time, not every day", "Challenges: time, guilt, judgment, workplace barriers, exhaustion", "Involve children so they learn about work and purpose", "Entrepreneurship can offer flexibility", "Motherhood and ambition can strengthen each other"], "linkedin": "As a mom of four and an entrepreneur, I do not balance it perfectly. I aim for balance over time. Motherhood made me more patient and organized. Ambition gives my children a model of what is possible. They can strengthen each other.", "instagram": "Some days work wins. Some days the kids win. Balance happens over time. #WorkingMoms #MomBoss #MomOfFour #MotherhoodAndAmbition #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 89, "category": 9, "categoryName": "Women, Work and Modern Life", "title": "Why Women's Leadership Styles Deserve More Recognition", "seoTitle": "Why Women's Leadership Styles Deserve Recognition", "meta": "Collaboration, empathy and listening are strengths. CiCi Caver explains why leadership styles common among women deserve more recognition.", "focus": "women's leadership styles", "keywords": "women leadership, collaborative leadership, empathetic leadership, leadership styles, gender and leadership, women in leadership, inclusive leadership", "article": "For a long time, leadership was defined by a narrow set of traits: command, control, decisiveness, dominance. Those traits have value. But many effective leaders, including many women, lead differently. They lead through collaboration, listening, empathy and relationship building. Those strengths have not always received the recognition they deserve.\n\nI want to be careful not to stereotype. Not every woman leads the same way, and plenty of men lead collaboratively. But research and experience suggest that women are often socialized toward certain leadership behaviors that are increasingly valuable in today's workplaces and communities.\n\nCollaboration. Many women leaders build consensus and draw on the ideas of the whole team.\n\nListening. Taking time to hear different perspectives leads to better decisions.\n\nEmpathy. Understanding how people feel improves communication, morale and retention.\n\nRelationship building. Strong relationships create trust and loyalty.\n\nMultitasking and adaptability. Managing many responsibilities at once builds flexibility.\n\nDevelopment of others. Many women leaders invest in mentoring and growing their teams.\n\nWhy have these styles been undervalued?\n\nBecause they can be less visible. Building consensus looks less dramatic than making a bold solo decision.\n\nBecause of double standards. Women who lead collaboratively may be seen as indecisive, while women who lead assertively may be seen as harsh.\n\nBecause leadership models were built around men. Many organizations still reward traits associated with traditional male leadership.\n\nIn my own leadership, I draw on collaboration and relationships. In commercial real estate, deals depend on trust among owners, tenants and brokers. In mentoring, I focus on listening and asking questions. As Chair of the University Heights City Beautiful Corporation, I believe our best work will come from bringing residents, businesses and city leaders together.\n\nThe world is changing. Organizations face complex problems that require teamwork, diverse input and emotional intelligence. Communities need leaders who can bring people together across differences. These are exactly the strengths many women bring.\n\nHow can organizations recognize these strengths?\n\nDefine leadership broadly in evaluations and promotions.\n\nReward results achieved through collaboration, not just individual heroics.\n\nAddress double standards openly.\n\nPut more women in visible leadership roles.\n\nInvest in leadership development for women, through programs like those at the Cleveland Leadership Center and professional groups like CREW Cleveland and the ECDI Women's Business Center of Northern Ohio.\n\nGood leadership comes in many forms. When we expand our definition, we discover more leaders, make better decisions and build stronger organizations.", "resources": ["Cleveland Leadership Center: leadership development", "CREW Cleveland: women in commercial real estate", "ECDI Women's Business Center of Northern Ohio: support for women business leaders"], "talking": ["Leadership has been defined narrowly around command and control", "Collaboration, listening, empathy and relationship building are strengths", "These styles are often less visible and face double standards", "Complex problems require exactly these strengths", "Organizations should define and reward leadership more broadly"], "linkedin": "Collaboration, listening and relationship building are leadership strengths, not soft extras. In commercial real estate, mentoring and community leadership, these skills drive my best results. When we define leadership more broadly, we discover more leaders.", "instagram": "Listening is leadership. Collaboration is leadership. Empathy is leadership. #WomenInLeadership #CollaborativeLeadership #Leadership #WomenWhoLead #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 90, "category": 9, "categoryName": "Women, Work and Modern Life", "title": "The Importance of Creating Opportunities for the Next Generation of Women", "seoTitle": "Creating Opportunities for the Next Generation of Women", "meta": "Every woman who opens a door makes the path easier for the next. CiCi Caver shares how to create opportunities for girls and young women.", "focus": "next generation of women", "keywords": "empowering girls, mentoring young women, women leadership pipeline, girls programs, youth mentorship, women entrepreneurs, community support", "article": "Many of the opportunities I have today exist because women before me pushed doors open. They started businesses when it was harder for women to get loans. They entered industries where they were unwelcome. They led organizations, raised families and spoke up when it was risky. I carry a responsibility to keep those doors open and to open new ones for the women and girls who come after me.\n\nThis matters to me as a mother, as a businesswoman and as a community leader. I have explored starting a girls' support group at my child's school because I believe young girls need spaces where they can build confidence, connection and vision for their futures.\n\nWhy is creating opportunities for the next generation so important?\n\nRepresentation shapes ambition. Girls who see women leaders, entrepreneurs and professionals imagine those futures for themselves.\n\nBarriers still exist. Young women still face pay gaps, bias, harassment and fewer opportunities in some fields.\n\nConfidence gaps start early. Research suggests girls' confidence often drops during adolescence. Support during those years can make a big difference.\n\nNetworks matter. Young women without access to professional networks miss opportunities others take for granted.\n\nCommunities benefit. When more women succeed, families, businesses and neighborhoods grow stronger.\n\nHere are ways to create opportunities for the next generation.\n\nMentor. Share your experience with a girl or young woman. Even occasional conversations can change someone's path.\n\nOpen your network. Introduce young women to people who can help them.\n\nHire and promote women. If you have influence over hiring, make sure young women get a fair shot.\n\nSupport girls' programs. Volunteer with or donate to programs that build girls' skills and confidence.\n\nSpeak in schools. Share your career story with students.\n\nModel what is possible. Live your ambitions openly so young women can see what is possible.\n\nAdvocate for fair policies. Support childcare, pay equity and family friendly workplaces.\n\nIn Northeast Ohio, there are many ways to get involved. Heights Libraries offers teen spaces and programs where young people learn and explore. Cleveland Business Mentors welcomes experienced professionals as mentors, and young women starting businesses can find support there and at the ECDI Women's Business Center of Northern Ohio. Cuyahoga Community College offers programs that help young women start careers and businesses. School districts, faith communities and youth organizations always need women willing to share their time and experience.\n\nThe next generation of women will build on whatever foundation we leave. Let us make it strong, open and full of possibility. Every door we open today becomes a path someone else can walk tomorrow.", "resources": ["Heights Libraries: teen spaces and youth programs", "Cleveland Business Mentors: volunteer mentoring opportunities", "ECDI Women's Business Center of Northern Ohio: support for young women entrepreneurs", "Cuyahoga Community College: career and entrepreneurship programs"], "talking": ["Today's opportunities exist because women before us opened doors", "Representation shapes ambition; confidence gaps start early", "I have explored starting a girls' support group at my child's school", "Mentor, open your network, support girls' programs, speak in schools", "Every door we open becomes a path for someone else"], "linkedin": "Many of my opportunities exist because women before me pushed doors open. Now it is my turn to hold them open. Mentor a young woman. Open your network. Speak at a school. Support girls' programs. Every door we open becomes someone else's path.", "instagram": "Lift as you climb. The next generation is watching. #EmpowerGirls #WomenSupportingWomen #Mentorship #NextGeneration #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cuyahoga County", "Greater Cleveland Region"], "uh": false}, {"id": 91, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "Why Commercial Vacancies Affect More Than Property Owners", "seoTitle": "Why Commercial Vacancies Affect the Whole Community", "meta": "Empty storefronts hurt neighbors, nearby businesses and city budgets. A commercial real estate agent explains the ripple effects of vacancy.", "focus": "commercial vacancy impact", "keywords": "commercial vacancy, empty storefronts, commercial real estate, corridor revitalization, property values, local economy, Cuyahoga County", "article": "When a storefront sits empty, most people think it is the property owner's problem. They are losing rent, after all. But in my work as a commercial real estate agent at Kowit, marketing more than 30 retail, office, industrial and land listings across Northeast Ohio, I have seen how vacancy affects far more than the owner.\n\nHere is how commercial vacancy ripples through a community.\n\nNearby businesses lose foot traffic. Shoppers visit corridors with several active businesses. When storefronts go dark, fewer people come, and neighboring businesses suffer.\n\nPerceptions of safety drop. Empty buildings can attract vandalism, litter and loitering. Even when crime does not rise, people may feel less safe.\n\nProperty values can decline. Vacancy can lower the value of nearby commercial and residential properties.\n\nCity revenue falls. Fewer businesses mean less income tax, property tax and other revenue to fund services.\n\nJobs disappear. Every closed business represents lost jobs, often for local residents.\n\nResidents lose services. A vacant pharmacy, grocery store or restaurant means residents travel farther for what they need.\n\nThe neighborhood's image suffers. Vacancy sends a message that an area is declining, which can discourage new investment.\n\nThe good news is that vacancy can also be reversed, and when it is, the benefits ripple out just as widely.\n\nSo what helps reduce commercial vacancy?\n\nActive marketing. Many vacant properties are not marketed well. Strong photos, clear information and targeted outreach help. That is a big part of my work.\n\nRealistic pricing. Sometimes vacancy lasts because asking rents do not match the market.\n\nFlexible terms. Shorter leases, rent abatement or tenant improvement allowances can attract new businesses.\n\nTemporary uses. Pop ups, art installations and community events can bring life to empty spaces while owners seek long term tenants.\n\nPublic support. Storefront improvement programs, grants and incentives help owners and tenants make spaces ready. The Cuyahoga County Department of Development offers lending and development programs, and many cities have their own economic development tools.\n\nPartnerships. Cities, community improvement corporations, CDCs and property owners can work together on corridor strategies.\n\nSupport for new entrepreneurs. Programs like Cleveland Business Mentors, the ECDI Women's Business Center of Northern Ohio and the Ohio SBDC at Cleveland State University help prepare the next generation of tenants.\n\nAs Chair of the University Heights City Beautiful Corporation, I see reducing vacancy as one of the most important ways we can strengthen our community. Every filled storefront is a win for residents, businesses and the city.\n\nIf you own a vacant property, a business looking for space or a resident who cares about your corridor, you have a role in solving vacancy. When we work together, empty storefronts become opportunities.", "resources": ["Cuyahoga County Department of Development: lending and development programs", "Cleveland Business Mentors, ECDI Women's Business Center of Northern Ohio and Ohio SBDC at Cleveland State University: preparing future tenants", "University Heights City Beautiful Corporation and local CDCs: corridor partnerships"], "talking": ["Vacancy affects neighbors, nearby businesses and city budgets, not just owners", "Effects: lost foot traffic, lower perceived safety, declining values, lost jobs", "Solutions: active marketing, realistic pricing, flexible terms, temporary uses", "Public programs and partnerships help", "Every filled storefront is a community win"], "linkedin": "As a commercial real estate agent marketing 30 plus listings, I see how one empty storefront affects an entire corridor: foot traffic, safety, property values and city revenue. The good news is that filling a space ripples out just as widely. Every filled storefront is a community win.", "instagram": "An empty storefront is everyone's problem, and everyone's opportunity. #CommercialRealEstate #ShopLocal #CorridorRevitalization #NortheastOhio #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cuyahoga County", "Greater Cleveland Region"], "uh": false}, {"id": 92, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "How Real Estate Development Shapes Community Identity", "seoTitle": "How Real Estate Development Shapes Community Identity", "meta": "Buildings tell a community's story. CiCi Caver explains how development decisions shape identity and how to build with character.", "focus": "development and community identity", "keywords": "real estate development, community identity, neighborhood character, historic preservation, placemaking, urban design, University Heights", "article": "Every building tells a story about a community. The architecture, the businesses, the public spaces and even the parking lots send messages about who a place is for and what it values. Real estate development does not just change land. It shapes identity.\n\nI think about this from several angles. As a commercial real estate agent, I help owners and tenants make decisions about space. Through C Charles and Associates, my contracting and property services company, I have worked on the physical side of buildings. As Chair of the University Heights City Beautiful Corporation, I help guide development in my own community. And starting in January 2027, I will be studying real estate development to deepen that knowledge.\n\nHere is how development shapes identity.\n\nArchitecture and scale. Historic brick storefronts feel different from big box stores surrounded by parking. Tall buildings, small buildings, modern designs and traditional styles all send messages.\n\nBusiness mix. The types of businesses in a district shape who visits and how a community is perceived. A corridor of local restaurants and shops feels different from one filled with chains.\n\nPublic spaces. Parks, plazas, sidewalks and gathering places show whether a community values connection.\n\nHousing types. The mix of housing determines who can afford to live in a community.\n\nPreservation. What a community chooses to save, and what it allows to be torn down, reflects what it values about its history.\n\nAccess. Whether development is designed for walking, transit or cars shapes daily life and who can participate.\n\nDevelopment decisions can strengthen identity or erase it. Thoughtful development builds on what makes a place special. Careless development can make a community look like anywhere else, or push out the people and businesses that gave it character.\n\nSo how can communities shape development that reflects their identity?\n\nDefine what makes the community special. Residents, businesses and leaders should agree on the qualities worth protecting.\n\nCreate clear guidelines. Zoning, design standards and master plans help guide new development.\n\nEngage residents early. People who live in a community should help shape its future.\n\nPreserve what matters. Historic buildings and longtime businesses often hold a community's identity. In University Heights, the city partners with the Cleveland Restoration Society's Heritage Home Program to help residents care for older homes.\n\nSupport local ownership. Local entrepreneurs often create businesses that reflect community character.\n\nThink long term. Buildings last for decades. Development decisions shape the community for generations.\n\nI believe the best development honors the past, serves the present and prepares for the future. When development reflects the people who live there, it creates places residents are proud to call home.", "resources": ["Heritage Home Program: helps University Heights residents care for older homes", "University Heights City Beautiful Corporation: guiding local development", "Heights Libraries local history resources: learn the story behind your community's buildings"], "talking": ["Every building tells a story about a community", "Architecture, business mix, public spaces, housing and preservation shape identity", "Development can strengthen identity or erase it", "Define what is special, set guidelines, engage residents, preserve what matters", "Best development honors the past and prepares for the future"], "linkedin": "Buildings tell a community's story. As a commercial real estate agent, former contractor and CIC Chair, I believe the best development honors the past, serves the present and prepares for the future. Development should reflect the people who live there.", "instagram": "What story do your community's buildings tell? #RealEstateDevelopment #CommunityIdentity #Placemaking #UniversityHeights #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs"], "uh": false}, {"id": 93, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "What Small Business Owners Should Know Before Leasing Space", "seoTitle": "What to Know Before Leasing Commercial Space", "meta": "A commercial lease is one of the biggest decisions a small business makes. A Kowit commercial agent shares what to know before you sign.", "focus": "leasing commercial space", "keywords": "commercial lease, small business lease, NNN lease, tenant representation, commercial real estate tips, lease negotiation, viability before visibility", "article": "Signing a commercial lease is one of the biggest decisions a small business owner will make. A good lease can support years of growth. A bad one can sink a business. As a commercial real estate agent at Kowit and a former business owner who once leased my own boutique space, I want every entrepreneur to go in informed.\n\nHere is what you should know before leasing space.\n\nKnow your numbers first. How much can you truly afford each month? A common guideline is to keep total occupancy costs at a manageable share of revenue, though the right number depends on your industry. Do not let a beautiful space push you beyond what your business can support. This is the heart of viability before visibility.\n\nUnderstand the total cost. Base rent is only part of the picture. Many commercial leases are NNN, or triple net, meaning tenants also pay a share of property taxes, insurance and common area maintenance. Ask for estimates of all charges.\n\nKnow the lease type. Gross, modified gross and NNN leases divide costs differently. Make sure you understand who pays for what.\n\nCheck zoning and permits. Make sure your business is allowed in the space, and understand what permits you will need.\n\nConsider build out costs. Will the space need renovations? Who pays? Landlords sometimes offer tenant improvement allowances. Negotiate them.\n\nThink about the term. Longer leases can offer lower rent and stability, but also more risk. Ask about renewal options.\n\nUnderstand personal guarantees. Many landlords ask small business owners to personally guarantee the lease. Know what you are signing.\n\nEvaluate location carefully. Visibility, parking, foot traffic, neighboring businesses and access for your customers all matter.\n\nPlan for growth or change. What happens if you need to expand, downsize or relocate? Look for flexibility.\n\nRead everything. Have an attorney review the lease before you sign.\n\nGet representation. Many owners do not realize that tenant representation is often paid by the landlord. A tenant representative can help you find spaces, compare options and negotiate better terms.\n\nThe biggest mistake I see is signing too quickly. Business owners fall in love with a space and sign before understanding the costs or terms. Take your time.\n\nIf you are preparing to lease, get help with the business side too. Cleveland Business Mentors offers free mentoring to help you build realistic projections. The Ohio SBDC at Cleveland State University offers free advising on business plans and finances. The ECDI Women's Business Center of Northern Ohio offers training and access to capital. And the Cuyahoga County Department of Development offers business growth lending.\n\nThe right space at the right price can help your business thrive. Take the time to get it right.", "resources": ["Cleveland Business Mentors: help building realistic projections", "Ohio SBDC at Cleveland State University: free advising on plans and finances", "ECDI Women's Business Center of Northern Ohio: training and access to capital", "Cuyahoga County Department of Development: business growth lending"], "talking": ["A lease can support growth or sink a business", "Know your numbers and total occupancy cost, including NNN charges", "Check zoning, build out costs, term and personal guarantees", "Tenant representation is often paid by the landlord", "The biggest mistake is signing too quickly"], "linkedin": "As a commercial agent and a former boutique owner who once signed my own lease, I see one mistake again and again: falling in love with a space before knowing the true cost. Know your numbers, understand NNN charges and get representation. Viability before visibility.", "instagram": "Before you sign that lease: know your numbers, read everything and get representation. #CommercialLease #SmallBusinessTips #CommercialRealEstate #ViabilityBeforeVisibility #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cuyahoga County"], "uh": false}, {"id": 94, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "The Relationship Between Housing Affordability and Economic Mobility", "seoTitle": "Housing Affordability and Economic Mobility", "meta": "Where families can afford to live shapes their opportunities. CiCi Caver explains the link between housing affordability and economic mobility.", "focus": "housing affordability and economic mobility", "keywords": "housing affordability, economic mobility, affordable housing, homeownership, rent burden, housing stability, Cuyahoga County housing", "article": "Where you live shapes almost everything: the schools your children attend, the jobs you can reach, the safety of your street, the services nearby and the people you know. That is why housing affordability is not just a housing issue. It is an economic mobility issue.\n\nEconomic mobility is the ability to improve your financial situation over time. Housing affects it in several important ways.\n\nCost burden. When families spend a large share of income on rent or mortgage, they have less left for savings, education, healthcare and emergencies. That makes it harder to get ahead.\n\nStability. Frequent moves due to rising rent or eviction disrupt children's education, workers' jobs and community ties.\n\nAccess to opportunity. Affordable housing near good jobs, schools and transit opens doors. When affordable housing is concentrated far from opportunity, families face longer commutes and fewer options.\n\nWealth building. Homeownership has been one of the main ways American families build wealth. When homeownership is out of reach, so is that wealth building path.\n\nHealth. Safe, stable housing supports physical and mental health, which affects the ability to work and learn.\n\nIn my work in commercial real estate and community development, I see how housing and business are connected. Neighborhoods with stable, affordable housing support local businesses with steady customers. Communities where workers can afford to live make it easier for businesses to hire.\n\nAs a University Heights resident and Chair of the University Heights City Beautiful Corporation, I care about maintaining housing options for families at different income levels. Our community has beautiful older homes, but older homes can be expensive to maintain. Repair programs matter.\n\nWhat can communities do to support affordability and mobility?\n\nPreserve existing affordable housing. Repairing and maintaining older homes is often more affordable than building new ones.\n\nSupport home repair programs. The Home Repair Resource Center in Cleveland Heights offers repair classes, a tool loan program and a senior repair program, and University Heights partners with the Cleveland Restoration Society's Heritage Home Program for low interest home improvement loans.\n\nEncourage a mix of housing types. Townhomes, apartments, single family homes and accessory units serve different needs.\n\nSupport first time homebuyers. Down payment assistance and homebuyer education help families build wealth.\n\nPlan development with existing residents in mind. New investment should not push out the families who already live there.\n\nConnect housing to jobs and transit. Location matters as much as price.\n\nHousing affordability is one of the most powerful levers we have for expanding opportunity. When families have stable, affordable homes, they can focus on building better futures.", "resources": ["Home Repair Resource Center: repair classes, tool loans and senior repair program", "Heritage Home Program: low interest home improvement loans for University Heights residents", "University Heights Housing Department: loan and grant programs for residents", "Heights Emergency Food Center: help that eases household budgets for four Heights area cities"], "talking": ["Where you live shapes schools, jobs, safety and networks", "Housing affects cost burden, stability, access, wealth and health", "Stable housing supports local businesses and hiring", "Preserve existing homes and support repair programs", "Plan development with existing residents in mind"], "linkedin": "Housing affordability is not just a housing issue. It is an economic mobility issue. Stable, affordable homes help families save, children learn and local businesses thrive. In the Heights, programs like the Home Repair Resource Center and the Heritage Home Program help families stay and invest.", "instagram": "Where you live shapes where you can go. Housing is opportunity. #HousingAffordability #EconomicMobility #AffordableHousing #UniversityHeights #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs"], "uh": true}, {"id": 95, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "Why Some Neighborhoods Attract Investment While Others Do Not", "seoTitle": "Why Some Neighborhoods Attract Investment and Others Do Not", "meta": "Investment follows perception, data and momentum. A commercial real estate agent explains why some neighborhoods get investment and others are overlooked.", "focus": "neighborhood investment", "keywords": "neighborhood investment, disinvestment, commercial real estate investment, community development, redlining history, market perception, Cleveland neighborhoods", "article": "In commercial real estate, I see firsthand how investment decisions are made. Some neighborhoods attract developers, new businesses and public dollars. Others with similar potential are overlooked for years. Understanding why helps communities change the pattern.\n\nHere are the main factors that drive investment.\n\nMarket data. Investors look at population, household income, traffic counts, spending patterns and growth trends. Neighborhoods with strong numbers on paper attract attention.\n\nPerception. Reputation matters, sometimes more than reality. Neighborhoods seen as unsafe or declining may be overlooked, even when conditions are improving.\n\nMomentum. Investment attracts investment. When one project succeeds, others follow. Neighborhoods without a first mover can stay stuck.\n\nInfrastructure. Roads, utilities, transit, parking and public spaces make development easier.\n\nPublic support. Tax incentives, grants and city partnerships reduce risk for investors.\n\nAnchor institutions. Hospitals, universities and major employers create demand for housing, retail and services.\n\nLand availability. Sites that are easy to assemble and develop attract more interest.\n\nHistory. Past policies, including redlining and disinvestment, shaped which neighborhoods received loans and investment for generations. Those patterns still affect property values and perceptions today.\n\nThe result is that some neighborhoods with loyal customers, strong community ties and real potential get passed over. This is something I care deeply about. Through my work at Kowit, with Cleveland Business Mentors and with the University Heights City Beautiful Corporation, I see communities with real purchasing power that are underestimated because their data is not presented well or their story is not told.\n\nSo how can overlooked neighborhoods attract investment?\n\nTell a better story with data. Show purchasing power, daytime population, customer loyalty and unmet demand. Sometimes the numbers are stronger than investors assume.\n\nCreate early wins. Small projects, pop ups and storefront improvements can build momentum.\n\nOrganize. Community improvement corporations, CDCs and merchant associations can speak with a unified voice and partner with investors.\n\nUse public tools. The Cuyahoga County Department of Development offers lending and development programs, and the Cuyahoga Land Bank works to return vacant properties to productive use.\n\nSupport local entrepreneurs. Local business owners often invest where outside investors will not. Programs like Cleveland Business Mentors, the ECDI Women's Business Center of Northern Ohio and the Ohio SBDC at Cleveland State University help them succeed.\n\nProtect existing residents. Investment should benefit the people who stayed through hard times.\n\nInvestment is not random. It follows data, perception and momentum. When communities understand those forces, they can change their story and attract the investment they deserve.", "resources": ["Cuyahoga County Department of Development: lending and development programs", "Cuyahoga Land Bank: returning vacant properties to productive use", "Cleveland Business Mentors, ECDI Women's Business Center of Northern Ohio and Ohio SBDC at Cleveland State University", "University Heights City Beautiful Corporation and local CDCs"], "talking": ["Investment follows data, perception and momentum", "History, including redlining, still shapes investment patterns", "Many overlooked neighborhoods have real purchasing power", "Tell a better story with data and create early wins", "Investment should benefit residents who stayed"], "linkedin": "In commercial real estate, I see neighborhoods with loyal customers and real purchasing power get overlooked because their data is not presented well. Investment follows data, perception and momentum. Communities can change their story, and attract the investment they deserve.", "instagram": "Overlooked does not mean lacking. Tell your neighborhood's story with data. #NeighborhoodInvestment #CommercialRealEstate #CommunityDevelopment #ClevelandNeighborhoods #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cuyahoga County"], "uh": false}, {"id": 96, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "Understanding the Difference Between Revitalization and Displacement", "seoTitle": "Revitalization vs Displacement: Knowing the Difference", "meta": "Revitalization should lift residents, not push them out. CiCi Caver explains the difference between revitalization and displacement and how to protect communities.", "focus": "revitalization vs displacement", "keywords": "revitalization, displacement, gentrification, equitable development, neighborhood change, affordable housing, small business protection", "article": "Revitalization is one of the most hopeful words in community development. It means bringing new life to places that have struggled: filling empty storefronts, repairing homes, improving streets and creating opportunity. But revitalization has a shadow side. If it is not done carefully, it can lead to displacement, pushing out the very residents and businesses who stayed through hard times.\n\nI think about this tension constantly. As a commercial real estate agent at Kowit, I help bring investment into properties and corridors. As Chair of the University Heights City Beautiful Corporation, I help guide development in my community. As a mentor with Cleveland Business Mentors, I support local entrepreneurs who need affordable space. And as a resident, I want my neighbors to benefit from change, not be priced out by it.\n\nHere is the difference.\n\nRevitalization improves a community for the people who live and work there. Residents gain better services, safer streets, more jobs and stronger local businesses. Longtime residents can stay and share in the benefits.\n\nDisplacement happens when improvements raise costs so much that existing residents and businesses can no longer afford to stay. Rents rise, property taxes increase, longtime businesses lose their leases and the community's character changes. The benefits go mostly to newcomers and outside investors.\n\nThe same project can lead to either outcome depending on how it is planned.\n\nWarning signs of displacement include rapidly rising rents and home prices, longtime businesses closing or relocating, residents moving out in large numbers and new amenities that serve visitors more than existing residents.\n\nHow can communities pursue revitalization without displacement?\n\nInvolve residents from the start. People who live in a community should help shape its future.\n\nPreserve affordable housing. Protect existing affordable units and require or encourage affordability in new development.\n\nHelp homeowners stay. Home repair programs like those offered by the Home Repair Resource Center in Cleveland Heights, along with University Heights' partnership with the Cleveland Restoration Society's Heritage Home Program, help residents maintain and keep their homes. Seniors in University Heights can also find support through the city's Services for Older Adults office.\n\nProtect small businesses. Offer lease support, technical help and space for local entrepreneurs in new developments.\n\nPromote local ownership. Help residents become homeowners, business owners and investors in their own community.\n\nHire locally. Encourage new projects and businesses to hire from the neighborhood.\n\nMeasure who benefits. Track whether existing residents are better off, not just whether property values rise.\n\nRevitalization and displacement are not inevitable partners. With intention, communities can grow while keeping their people. The goal is not to stop change. It is to make sure change lifts the people who are already there.", "resources": ["Home Repair Resource Center: helps homeowners maintain and keep their homes", "Heritage Home Program: low interest home improvement loans for University Heights residents", "City of University Heights Services for Older Adults", "Cleveland Business Mentors and ECDI Women's Business Center of Northern Ohio: support for local business owners"], "talking": ["Revitalization lifts residents; displacement pushes them out", "The same project can lead to either outcome", "Warning signs: rising rents, closing longtime businesses, amenities for outsiders", "Involve residents, preserve affordability, help homeowners stay, protect small businesses", "Measure who benefits"], "linkedin": "I help bring investment into corridors, and I care deeply about who benefits. Revitalization should lift the people who stayed through hard times. Involve residents early, protect small businesses and help homeowners stay. Change should work for the people already there.", "instagram": "Revitalize with residents, not around them. #EquitableDevelopment #Revitalization #CommunityFirst #UniversityHeights #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs"], "uh": true}, {"id": 97, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "How Zoning Decisions Influence Everyday Life", "seoTitle": "How Zoning Decisions Shape Everyday Life", "meta": "Zoning decides what can be built where. CiCi Caver explains how zoning shapes housing, businesses, walkability and daily life.", "focus": "zoning decisions", "keywords": "zoning, land use, zoning and housing, commercial zoning, planning commission, local government, walkability", "article": "Most people never think about zoning until it affects them directly. A business owner finds a perfect space, only to learn their business is not allowed there. A family wants to add an apartment for an aging parent, but the rules do not allow it. Residents wonder why there is no grocery store within walking distance. In each case, zoning is part of the answer.\n\nZoning is the set of local rules that determines how land can be used: where homes, businesses, offices, factories and parks can go, how tall buildings can be, how much parking is required and how close buildings can sit to the street.\n\nIn my work as a commercial real estate agent at Kowit, zoning comes up constantly. Before I market a property, I need to understand what uses are allowed. Before a business signs a lease, they need to confirm that zoning permits their operation. Zoning can make a deal possible or stop it in its tracks.\n\nHere is how zoning influences everyday life.\n\nHousing options. Zoning determines whether a neighborhood can have only single family homes or also townhomes, duplexes and apartments. That affects affordability and who can live in a community.\n\nWalkability. When zoning separates homes from shops and services, people need cars for everything. When it allows a mix of uses, residents can walk to daily needs.\n\nBusiness opportunity. Zoning decides where businesses can open and what types are allowed. Restrictive rules can limit entrepreneurs, especially home based or small businesses.\n\nParking and design. Parking requirements shape how much land goes to cars instead of buildings, green space or sidewalks.\n\nNeighborhood character. Height limits, setbacks and design standards influence how a neighborhood looks and feels.\n\nEquity. Historically, zoning was sometimes used to exclude certain groups and keep neighborhoods segregated. Those patterns still shape many communities today.\n\nAs Chair of the University Heights City Beautiful Corporation, I see how zoning shapes our commercial corridors and future development. Thoughtful zoning can encourage the kind of walkable, vibrant, inclusive community residents want.\n\nHow can residents get involved?\n\nLearn your community's zoning map and code. Most cities publish them online.\n\nAttend planning commission and zoning board meetings. Many important decisions happen there.\n\nAsk questions. If a project is proposed near you, find out what is allowed and what is being requested.\n\nShare your vision. Residents can advocate for zoning that supports housing options, local business and walkability.\n\nTalk to city staff. Building and planning departments can explain rules and processes. In University Heights, start with the city's Building Department.\n\nFor business owners, check zoning before you sign a lease or buy property. A commercial real estate professional and your city's building or planning department can help. Cleveland Business Mentors and the Ohio SBDC at Cleveland State University can also help you plan for location requirements.\n\nZoning may sound technical, but it shapes where we live, how we get around and what opportunities exist in our communities. Understanding it gives residents a stronger voice in their future.", "resources": ["City of University Heights Building Department and city website for zoning information", "Your city's planning commission and zoning board meetings", "Cleveland Business Mentors and Ohio SBDC at Cleveland State University: location planning help for businesses"], "talking": ["Zoning determines how land can be used", "It shapes housing options, walkability, business opportunity and design", "Zoning can make or stop a real estate deal", "Historic zoning was sometimes used to exclude", "Residents can learn the code, attend meetings and share their vision"], "linkedin": "In commercial real estate, zoning can make a deal possible or stop it in its tracks. It also shapes housing, walkability and who can start a business where. Zoning sounds technical, but it shapes daily life. Learn your city's code and show up to planning meetings.", "instagram": "Why is there no grocery store within walking distance? Zoning is part of the answer. #Zoning #LandUse #LocalGovernment #CommercialRealEstate #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs"], "uh": false}, {"id": 98, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "The Role of Small Businesses in Revitalizing Commercial Districts", "seoTitle": "How Small Businesses Revitalize Commercial Districts", "meta": "Small businesses bring life, character and foot traffic back to commercial districts. CiCi Caver explains their role in revitalization.", "focus": "small businesses revitalizing districts", "keywords": "small business revitalization, commercial districts, Main Street, local entrepreneurs, corridor revitalization, storefront activation, community development", "article": "When people talk about revitalizing a commercial district, they often focus on big projects: a new development, a major anchor tenant or a streetscape overhaul. Those matter. But in my experience, small businesses are often the real heroes of revitalization.\n\nI have seen it many times. A coffee shop opens in a quiet corridor. A barbershop fills a long vacant storefront. A boutique, bakery or restaurant brings new energy. Slowly, foot traffic increases, other businesses follow and the district comes back to life.\n\nI know this from both sides. As a former boutique owner, I was once one of those small businesses adding life to a corridor. Now, as a commercial real estate agent and Chair of the University Heights City Beautiful Corporation, I see how small businesses shape the future of districts.\n\nHere is why small businesses are so important to revitalization.\n\nThey take chances. Small business owners are often willing to open in areas larger companies overlook.\n\nThey create character. Local businesses give districts personality that chains cannot replicate.\n\nThey build relationships. Owners know their customers and become part of the community.\n\nThey attract other businesses. One successful business signals that a district is viable.\n\nThey keep money local. Local owners spend and hire locally.\n\nThey activate streets. Open doors, window displays and customers coming and going make districts feel alive and safe.\n\nThey reflect the community. Businesses owned by residents often serve local needs and cultures.\n\nBut small businesses also face challenges in revitalizing districts: limited capital, high build out costs, rising rents as districts improve and a lack of support systems.\n\nSo how can communities support small businesses as revitalization partners?\n\nMake space affordable. Flexible lease terms, rent incentives and smaller spaces help new businesses open.\n\nProvide storefront help. Grants or loans for facades, signage and build outs reduce startup costs.\n\nOffer technical support. Cleveland Business Mentors provides free mentoring and workshops. The Ohio SBDC at Cleveland State University offers free advising. The ECDI Women's Business Center of Northern Ohio offers training and access to capital.\n\nConnect to financing. The Cuyahoga County Department of Development offers business growth lending.\n\nMarket the district. Events, social media and shared promotions bring customers to small businesses.\n\nProtect existing businesses. As districts improve, help longtime businesses stay through lease support and advocacy.\n\nCreate a business association. Organized businesses can advocate together and support each other.\n\nAs Chair of the University Heights City Beautiful Corporation, I believe supporting small businesses is one of the most effective ways to strengthen our corridors. When local entrepreneurs succeed, the whole community benefits.\n\nRevitalization does not always start with a big announcement. Often, it starts with one brave entrepreneur opening one door.", "resources": ["Cleveland Business Mentors: free mentoring and workshops", "Ohio SBDC at Cleveland State University: free advising", "ECDI Women's Business Center of Northern Ohio: training and access to capital", "Cuyahoga County Department of Development: business growth lending"], "talking": ["Small businesses are often the real heroes of revitalization", "They take chances, create character and attract other businesses", "Challenges: capital, build out costs, rising rents", "Support: affordable space, storefront help, technical support, financing", "Revitalization often starts with one entrepreneur opening one door"], "linkedin": "I was once a small business owner bringing life to a corridor. Now, as a commercial real estate agent and CIC Chair, I see small businesses as the real heroes of revitalization. Support them with affordable space, mentoring and financing, and the whole district benefits.", "instagram": "Revitalization often starts with one brave entrepreneur opening one door. #SmallBusiness #MainStreet #Revitalization #ShopLocal #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cuyahoga County"], "uh": false}, {"id": 99, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "Why Accessible Commercial Space Matters for Entrepreneurs", "seoTitle": "Why Accessible Commercial Space Matters for Entrepreneurs", "meta": "Affordable, flexible and physically accessible space opens doors for entrepreneurs. CiCi Caver explains why commercial space access matters.", "focus": "accessible commercial space", "keywords": "commercial space access, affordable commercial space, entrepreneurs, shared space, coworking, small business space, ADA accessibility", "article": "Many great business ideas never become storefronts because their owners cannot access the right space. In commercial real estate, I see this barrier constantly. Space is often too expensive, too large, too rigid or simply unavailable for first time entrepreneurs. When I say accessible commercial space, I mean space that is affordable, flexible, appropriately sized and physically accessible to everyone.\n\nWhy does accessible space matter so much?\n\nSpace is often the biggest fixed cost. Rent, build out and utilities can consume a large share of a small business budget.\n\nTraditional leases can be intimidating. Long terms, personal guarantees and complex charges like NNN costs can scare off new entrepreneurs or trap them in expensive commitments.\n\nMany available spaces are too big. New businesses often need small spaces that are hard to find.\n\nBuild out costs are high. Spaces that need major renovations are out of reach for businesses without significant capital.\n\nPhysical accessibility matters too. Spaces should welcome customers and employees with disabilities, which also broadens the customer base.\n\nUnderserved entrepreneurs face more barriers. Entrepreneurs without strong credit, savings or networks may struggle to qualify for leases at all.\n\nThis matters to me personally. I have long believed in the idea of a community cowork space along the Cleveland Heights and University Heights corridor, a place where entrepreneurs can start small, share resources and grow. Shared spaces, incubators and flexible arrangements can be bridges between a home based business and a full storefront.\n\nHere are ways to make commercial space more accessible.\n\nShared and coworking spaces. These allow entrepreneurs to start with lower costs and flexible terms.\n\nIncubators and kitchens. Shared facilities for food businesses and makers reduce startup costs.\n\nSmaller units. Property owners can subdivide larger spaces into smaller, more affordable suites.\n\nFlexible leases. Shorter terms, graduated rent and early exit options reduce risk for new businesses.\n\nPop ups and temporary leases. These let entrepreneurs test a location before committing.\n\nTenant improvement support. Landlord allowances, grants and loans help cover build out costs.\n\nTenant representation. Many entrepreneurs do not realize that tenant representation is often paid by the landlord. A knowledgeable agent can help find spaces that fit and negotiate better terms.\n\nPublic and nonprofit support. The Cuyahoga County Department of Development offers lending programs. The ECDI Women's Business Center of Northern Ohio offers training and access to capital, with a focus on entrepreneurs who struggle to get traditional financing. Cleveland Business Mentors and the Ohio SBDC at Cleveland State University help entrepreneurs prepare financially so they are lease ready.\n\nAs Chair of the University Heights City Beautiful Corporation, I see accessible commercial space as essential to building a corridor where local entrepreneurs can thrive.\n\nWhen space is accessible, more people can turn ideas into businesses. And when more people can build businesses, communities become stronger, more diverse and more resilient.", "resources": ["Cuyahoga County Department of Development: lending programs", "ECDI Women's Business Center of Northern Ohio: training and access to capital", "Cleveland Business Mentors and Ohio SBDC at Cleveland State University: help becoming lease ready", "Heights Libraries meeting rooms: free professional space for early stage businesses"], "talking": ["Accessible space means affordable, flexible, right sized and physically accessible", "Space is often the biggest fixed cost for small businesses", "Shared spaces and incubators bridge home businesses and storefronts", "I have long envisioned a community cowork space on the Heights corridor", "Tenant representation is often paid by the landlord"], "linkedin": "Many great business ideas never become storefronts because owners cannot access the right space. Shared spaces, smaller suites, flexible leases and tenant representation can change that. Accessible space turns ideas into businesses and strengthens communities.", "instagram": "Great ideas need a place to grow. Let us make commercial space accessible. #SmallBusinessSpace #Coworking #Entrepreneurs #CommercialRealEstate #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs", "Greater Cuyahoga County"], "uh": true}, {"id": 100, "category": 10, "categoryName": "Real Estate, Housing and Neighborhood Change", "title": "What Responsible Neighborhood Development Should Look Like", "seoTitle": "What Responsible Neighborhood Development Looks Like", "meta": "Responsible development benefits residents, businesses and future generations. CiCi Caver shares her vision for neighborhood development done right.", "focus": "responsible neighborhood development", "keywords": "responsible development, equitable development, community development, neighborhood planning, University Heights City Beautiful Corporation, local ownership, sustainable communities", "article": "After 99 articles on culture, community, business, leadership, life and real estate, it feels right to end with a vision: what responsible neighborhood development should look like.\n\nI bring many perspectives to this question. I have been a small business owner, a marketer, a contractor, a commercial real estate agent, a mentor and now Chair of the University Heights City Beautiful Corporation. I am a resident and a mom of four who wants my children to grow up in a community that works for everyone. And I am about to begin studying real estate development to keep learning.\n\nHere is what I believe responsible neighborhood development includes.\n\nIt starts with listening. Residents, business owners and community groups should shape plans from the beginning, not just react to them.\n\nIt benefits existing residents. Success should be measured by whether the people already living and working in a community are better off.\n\nIt prioritizes viability before visibility. Projects should be built on real demand, realistic finances and the purchasing power of the community, not just appearances.\n\nIt supports local businesses. Development should create space and opportunity for neighborhood entrepreneurs, not just national chains.\n\nIt protects affordability. A mix of housing and commercial space at different price points keeps communities accessible.\n\nIt respects identity. Development should honor history, culture and character while welcoming growth.\n\nIt builds connection. Walkable streets, public spaces and third places help neighbors come together.\n\nIt serves every generation. Families with young children, seniors aging in place and young adults starting out should all find a place.\n\nIt is transparent. Decisions, funding and goals should be clear to the public.\n\nIt thinks long term. Buildings and policies last for decades. Responsible development plans for future generations.\n\nIt uses partnerships. No single organization can do this alone. Cities, community improvement corporations, nonprofits, businesses, residents and investors all have roles.\n\nIn Northeast Ohio, many partners already make this kind of work possible. The Cuyahoga County Department of Development and the Cuyahoga Land Bank support redevelopment. The Home Repair Resource Center and University Heights' Heritage Home Program partnership help residents care for their homes. Cleveland Business Mentors, the ECDI Women's Business Center of Northern Ohio and the Ohio SBDC at Cleveland State University help entrepreneurs grow. Heights Libraries serves as a community anchor for learning and gathering. And University Heights' Services for Older Adults office helps seniors stay connected and supported.\n\nAs Chair of the University Heights City Beautiful Corporation, this is the vision I want to help advance. Development that is thoughtful, inclusive and rooted in the real needs of the people who live here.\n\nResponsible development is not about stopping change or rushing it. It is about guiding change so that it builds stronger, more connected and more opportunity rich communities for everyone.\n\nThank you for reading, thinking and engaging with these ideas. Our communities get better when we talk honestly, listen closely and work together. Just ask.", "resources": ["Cuyahoga County Department of Development and Cuyahoga Land Bank: redevelopment support", "Home Repair Resource Center and Heritage Home Program: housing preservation", "Cleveland Business Mentors, ECDI Women's Business Center of Northern Ohio and Ohio SBDC at Cleveland State University: entrepreneur support", "Heights Libraries and City of University Heights Services for Older Adults: community anchors"], "talking": ["Responsible development starts with listening", "It benefits existing residents and prioritizes viability before visibility", "It supports local businesses, protects affordability and respects identity", "It serves every generation and thinks long term", "Partnerships make it possible"], "linkedin": "Small business owner, marketer, contractor, commercial real estate agent, mentor, CIC Chair, resident and mom. From every angle, my vision is the same: development that listens first, benefits existing residents and puts viability before visibility. Our communities get better when we work together. Just ask.", "instagram": "Listen first. Lift residents. Build for the long term. That is responsible development. #ResponsibleDevelopment #CommunityDevelopment #UniversityHeights #ViabilityBeforeVisibility #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs", "Greater Cuyahoga County", "Greater Cleveland Region"], "uh": true}, {"id": 101, "category": 12, "categoryName": "Viability Before Visibility", "title": "Familiarity Gets Mistaken for Market Viability", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "One thing I have been thinking about lately is the difference between a business everybody knows and a business the market can actually support.\n\nAs a licensed commercial real estate agent on the east side, I see businesses with good reviews and loyal followers that still struggle. Being known is not the same as being supported. Here is one reason. In 2024, the lowest income fifth of households spent about $35,000 a year. The highest fifth spent about $150,000. That is a huge difference in the money moving through a household, and businesses feel it. So before I judge a business by how visible it is, I ask whether enough people nearby can afford to buy from it often enough.\n\nAre we measuring how many people know the business, or how many people can consistently buy from it?", "resources": [], "talking": ["A business can have great reviews, loyal followers and steady foot traffic and still have a demand problem.", "Knowing a business and buying from it often are two different things.", "Households with more money moving through them can support more businesses.", "Before judging a business by how visible it is, ask whether enough nearby people can afford to buy often enough."], "linkedin": "As a licensed commercial real estate agent on the east side, I see businesses with good reviews and loyal followers that still struggle. Being known is not the same as being supported. Here is one reason. In 2024, the lowest income fifth of households spent about $35,000 a year. The highest fifth spent about $150,000. That is a huge difference in the money moving through a household, and businesses feel it. So before I judge a business by how visible it is, I ask whether enough people nearby can afford to buy from it often enough.\n\nAre we measuring how many people know the business, or how many people can consistently buy from it?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "Are we measuring how many people know the business, or how many people can consistently buy from it? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 1. Best format: 60 second video and 6 slide carousel. Data: S1.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 102, "category": 12, "categoryName": "Viability Before Visibility", "title": "A Busy Street Is Not Necessarily a Good Retail Market", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "In real estate, we love to talk about traffic counts. But I have learned that a busy street and a good retail market are not the same thing.\n\nA busy street can feel like a guarantee. Thousands of cars a day, great signage, a corner location. But I have learned to ask three more questions. Who is in those cars? Do they live or work near here, or are they just passing through? And would they spend money at this kind of business? In the Federal Reserve's 2024 survey, 57% of small employer firms said reaching customers and growing sales was an operational challenge, the most common one. That tells me being seen is not the same as being bought from. [Add a real example from your listings, with no names.]\n\nIs this street busy with people who buy, or just people who pass?", "resources": [], "talking": ["Traffic counts measure cars passing. They do not measure people willing and able to stop and buy.", "Visibility helps a business get noticed. It does not create buying power.", "Many drivers are passing through to somewhere else.", "Ask who passes, who stops, and who actually spends."], "linkedin": "A busy street can feel like a guarantee. Thousands of cars a day, great signage, a corner location. But I have learned to ask three more questions. Who is in those cars? Do they live or work near here, or are they just passing through? And would they spend money at this kind of business? In the Federal Reserve's 2024 survey, 57% of small employer firms said reaching customers and growing sales was an operational challenge, the most common one. That tells me being seen is not the same as being bought from. [Add a real example from your listings, with no names.]\n\nIs this street busy with people who buy, or just people who pass?\n\nBefore you sign the lease, let's look at the market.", "instagram": "Is this street busy with people who buy, or just people who pass? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 2. Best format: short article and 5 slide carousel. Data: S2 (the 57% figure).. Call to action: Before you sign the lease, let's look at the market. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 103, "category": 12, "categoryName": "Viability Before Visibility", "title": "Same County, Very Different Customer", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "I went looking at the numbers because I wanted to know whether what I see on the east side shows up in the data.\n\nHere is what the Census Bureau estimates for median household income on the east side. East Cleveland, about $23,000. Cleveland Heights, about $72,000. Shaker Heights, about $98,000. University Heights, about $98,000. Beachwood, about $103,000. Between East Cleveland and Beachwood, that is a gap of nearly $80,000 a year. These are all in Cuyahoga County. A boutique, a restaurant or a salon would face a very different customer in each one. That does not make any of these places good or bad. It means the business and the market have to fit.\n\nDoes the customer this business needs actually live and spend here?", "resources": [], "talking": ["Median household income is a quick way to see how much room a community has to spend.", "East side communities that sit within a short drive of each other can look very different.", "The same business can face a very different customer in each one.", "This is not a judgment on any community. It is a reason to match the business to the market."], "linkedin": "Here is what the Census Bureau estimates for median household income on the east side. East Cleveland, about $23,000. Cleveland Heights, about $72,000. Shaker Heights, about $98,000. University Heights, about $98,000. Beachwood, about $103,000. Between East Cleveland and Beachwood, that is a gap of nearly $80,000 a year. These are all in Cuyahoga County. A boutique, a restaurant or a salon would face a very different customer in each one. That does not make any of these places good or bad. It means the business and the market have to fit.\n\nDoes the customer this business needs actually live and spend here?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "Does the customer this business needs actually live and spend here? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 3. Best format: carousel with one big number per slide. Data: S6. Say these are estimates from 2019 to 2023 and mention the margin of error in the caption.. Call to action: What are you seeing in your corner of the east side? Tell me in the comments. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": ["Eastern Suburbs", "East Cleveland", "Greater Cuyahoga County"], "uh": false}, {"id": 104, "category": 12, "categoryName": "Viability Before Visibility", "title": "The $500,000 Business Question Nobody Asked Before the Lease Was Signed", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "Before anyone signs a lease, I want them to do five minutes of math.\n\nThis is an example, not real data. Say a business needs $500,000 a year in sales to cover everything, including the owner's pay. If the average sale is $25, that is 20,000 sales a year, about 55 every day of the year. If the average sale is $10, it is 50,000 sales, about 137 a day. Now ask a simple question. Are there enough people nearby, with enough money to spend, who would buy this often? I think a lot of leases get signed before anyone asks that.\n\nHow many customers does this location need, and can this market actually deliver them?", "resources": [], "talking": ["Start with what the business must earn each year to cover rent, payroll, inventory and the owner's pay.", "Divide that by the average sale to get the number of sales needed.", "Divide again by the days open to get sales per day.", "Ask whether the neighborhood can realistically produce that many buyers."], "linkedin": "This is an example, not real data. Say a business needs $500,000 a year in sales to cover everything, including the owner's pay. If the average sale is $25, that is 20,000 sales a year, about 55 every day of the year. If the average sale is $10, it is 50,000 sales, about 137 a day. Now ask a simple question. Are there enough people nearby, with enough money to spend, who would buy this often? I think a lot of leases get signed before anyone asks that.\n\nHow many customers does this location need, and can this market actually deliver them?\n\nConsidering a new location, a move or an expansion on the east side or anywhere in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help businesses look at the market, the location and the space before they sign a lease. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130.", "instagram": "How many customers does this location need, and can this market actually deliver them? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 4. Best format: video with simple on screen math. Data: none needed. State clearly that the numbers are an illustration. Optionally swap in a real example from your own work, with no names.. Call to action: Considering a new location, a move or an expansion on the east side or anywhere in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help businesses look at the market, the location and the space before they sign a lease. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 105, "category": 12, "categoryName": "Viability Before Visibility", "title": "Before You Lease That Storefront, Look at Who Lives Within 3 Miles", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "In commercial real estate we say location, location, location. For small businesses, I think we need to go one step further: location relative to whom?\n\nTwo storefronts can look alike on paper. Same size, similar rent, same type of business. But one sits in a market with plenty of customers who can afford what it sells, and the other does not. Before you sign, look three miles out. How many households? What do they earn? What do they already spend money on? Who is already serving them? Then ask the hardest question: will enough of them buy from me, again and again? In the survey the Federal Reserve ran in 2024, reaching customers and growing sales was the top operational challenge for small employer firms. The place you choose has a lot to do with it.\n\nLocation relative to whom?", "resources": [], "talking": ["Two businesses with the same product, the same owner and similar rent can operate in completely different economies.", "Look at who lives and works within three miles, what they earn and what they already spend on.", "Look at who else already sells what you sell.", "A cheaper rent is not a better deal if the people nearby cannot buy from you often enough."], "linkedin": "Two storefronts can look alike on paper. Same size, similar rent, same type of business. But one sits in a market with plenty of customers who can afford what it sells, and the other does not. Before you sign, look three miles out. How many households? What do they earn? What do they already spend money on? Who is already serving them? Then ask the hardest question: will enough of them buy from me, again and again? In the survey the Federal Reserve ran in 2024, reaching customers and growing sales was the top operational challenge for small employer firms. The place you choose has a lot to do with it.\n\nLocation relative to whom?\n\nConsidering a new location, a move or an expansion on the east side or anywhere in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help businesses look at the market, the location and the space before they sign a lease. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130.", "instagram": "Location relative to whom? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 5. Best format: article and carousel. Data: S2. Optional: run a trade area report for a specific east side listing and add one local number.. Call to action: Considering a new location, a move or an expansion on the east side or anywhere in Cuyahoga County? I am a licensed commercial real estate agent with Kowit and Company Real Estate Group, and I help businesses look at the market, the location and the space before they sign a lease. Reach me at ccaver@kowitrealestate.com or 216.514.1400 x130. Written October 2026; statistics verified Oct 7, 2026.", "publishDate": "", "custom": true, "areas": [], "uh": false}, {"id": 106, "category": 12, "categoryName": "Viability Before Visibility", "title": "We Talk About Startup Capital. We Don't Talk Enough About Household Capital.", "seoTitle": "", "meta": "", "focus": "", "keywords": "", "article": "Through my work with Cleveland Business Mentors, I hear a lot about startup money. I hear less about the money the owner needs just to live while the business gets going.\n\nWhen people talk about starting a business, the conversation is usually about startup capital. How much do you need for the lease, the equipment and the inventory? I think we should also ask about household capital. How long can the owner go without a paycheck? Who covers the rent, the groceries, the childcare and the car? In the Federal Reserve's 2024 survey, 56% of small employer firms said paying operating expenses was a challenge, and 51% said uneven cash flow was one. When cash is uneven, the owner's own finances are often what absorbs it. Two owners can have the same idea and very different room to learn.\n\nBefore we ask whether the business is ready, should we ask whether the owner can afford the wait?", "resources": [], "talking": ["Startup capital pays for the business. Household capital pays for the owner's life while the business grows.", "A new business rarely pays the owner right away.", "How long an owner can wait, test, hire and recover depends on their own finances.", "Two owners with the same idea can face very different odds."], "linkedin": "When people talk about starting a business, the conversation is usually about startup capital. How much do you need for the lease, the equipment and the inventory? I think we should also ask about household capital. How long can the owner go without a paycheck? Who covers the rent, the groceries, the childcare and the car? In the Federal Reserve's 2024 survey, 56% of small employer firms said paying operating expenses was a challenge, and 51% said uneven cash flow was one. When cash is uneven, the owner's own finances are often what absorbs it. Two owners can have the same idea and very different room to learn.\n\nBefore we ask whether the business is ready, should we ask whether the owner can afford the wait?\n\nWhat are you seeing in your corner of the east side? Tell me in the comments.", "instagram": "Before we ask whether the business is ready, should we ask whether the owner can afford the wait? #ViabilityBeforeVisibility #SmallBusiness #ClevelandEastSide #JustAskCC", "status": "Drafted", "notes": "Viability Before Visibility piece 6. Best format: article and video. Data: S2. Note: the Fed's \"uneven cash flow\" includes collecting on receivables, so do not describe it as owner income.. Call to action: What are you seeing
