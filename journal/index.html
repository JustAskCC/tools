<!DOCTYPE html>
<html lang="en" data-readonly>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Ask CC Journal Library</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a fixed library rail on the left (filters), a scannable topic list in the middle, the open topic on the right like a working desk. */
  --paper:#f7f5f2; --surface:#ffffff; --ink:#1f1b19; --muted:#6b625c; --line:#e4ddd6; --soft:#f0ebe5;
  --accent:#8a4b2f; --accent-ink:#ffffff; --accent-soft:#f3e5dc;
  --st-idea:#7a6f9b; --st-drafted:#5a7184; --st-ready:#3f7d5c; --st-scheduled:#a26a12; --st-published:#1f6f8b;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171412; --surface:#211c19; --ink:#f1ece7; --muted:#b0a59c; --line:#3a322d; --soft:#2a2420;
    --accent:#e0a07f; --accent-ink:#1b1310; --accent-soft:#3a2a22;
    --st-idea:#b3a8d6; --st-drafted:#9db4c7; --st-ready:#86c4a1; --st-scheduled:#e2b25c; --st-published:#7cc4dd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#171412; --surface:#211c19; --ink:#f1ece7; --muted:#b0a59c; --line:#3a322d; --soft:#2a2420;
  --accent:#e0a07f; --accent-ink:#1b1310; --accent-soft:#3a2a22;
  --st-idea:#b3a8d6; --st-drafted:#9db4c7; --st-ready:#86c4a1; --st-scheduled:#e2b25c; --st-published:#7cc4dd;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(300px,420px) 1fr;height:100%}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance}
.brand span{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.top .spacer{flex:1}
.save{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--st-ready)}
.save.busy .dot{background:var(--st-scheduled)}
.save.off .dot{background:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:.8rem}
.btn.danger{color:#b3261e}
.main{display:contents}
aside.rail{border-right:1px solid var(--line);padding:16px;overflow:auto;background:var(--paper)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:.78rem}
.rail h3{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.filt{display:flex;flex-direction:column;gap:2px}
.filt button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;font-size:.92rem}
.filt button:hover{background:var(--soft)}
.filt button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.filt .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
section.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.search{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.search input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.results{padding:6px 12px;color:var(--muted);font-size:.82rem;border-bottom:1px solid var(--line)}
.items{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:3px solid transparent;border-top:0;border-right:0}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.item .num{font-family:var(--display);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.item .t{font-weight:600;line-height:1.3}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;font-size:.78rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Idea{color:var(--st-idea)} .s-Drafted{color:var(--st-drafted)} .s-Ready{color:var(--st-ready)} .s-Scheduled{color:var(--st-scheduled)} .s-Published{color:var(--st-published)}
section.detail{overflow:auto;padding:24px 28px 60px;min-width:0}
.dhead{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.eyebrow{color:var(--accent);font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
.dhead h2{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1.15;margin:0;text-wrap:balance;max-width:28ch}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls label{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.controls select,.controls input{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.block h4{margin:0 0 10px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:130px 1fr auto;gap:8px 12px;align-items:start}
.kv dt{color:var(--muted);font-size:.85rem;padding-top:2px}
.kv dd{margin:0}
.count{font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.count.over{color:#b3261e;font-weight:700}
.article{max-width:68ch}
.article p{margin:0 0 .9em}
ul.clean{margin:0;padding-left:1.1em}
ul.clean li{margin:.25em 0}
.caption{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.caption b{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;margin-bottom:4px}
.empty{color:var(--muted);padding:40px 12px;text-align:center}
textarea,.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
textarea{min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:600}
.field .hint{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.res-page{grid-column:2/-1;overflow:auto;padding:24px 28px 60px}
.res-group{margin-bottom:22px}
.res-group h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 8px}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.res-card .name{font-weight:700}
.res-card .used{font-size:.8rem;color:var(--muted)}
.res-card a{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.chip.uh{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.uhcheck{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem;margin:0 0 12px}
.uhbar{padding:12px;border-bottom:1px solid var(--line);background:var(--accent-soft);font-size:.88rem}
.uhbar b{font-family:var(--display);font-size:1.05rem;display:block}
.chip.muted{color:var(--muted);font-weight:400}
fieldset.areas{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 16px}
fieldset.areas legend{font-size:.85rem;font-weight:600;padding:0 4px}
fieldset.areas label{font-size:.9rem;display:flex;gap:6px;align-items:center}
.cov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.cov-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--accent)}
.cov-card h4{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0 0 4px}
.cov-card p{margin:0 0 8px;font-size:.92rem}
.cov-card .places{font-size:.85rem;color:var(--muted)}
.lead{font-size:1.05rem;max-width:68ch;margin:0 0 18px}
.banner{background:var(--accent-soft);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-size:.88rem;margin-bottom:12px}
@media (max-width:1000px){
  .app{grid-template-columns:1fr;height:auto}
  aside.rail{border-right:0;border-bottom:1px solid var(--line)}
  .stats{grid-template-columns:repeat(5,1fr)}
  section.list{max-height:60vh;border-right:0}
  .res-page{grid-column:1}
  .kv{grid-template-columns:1fr}
}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}section.detail{padding:18px 16px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>Just Ask CC Journal Library</h1><span>Business. Real Estate. Community. Life. Across Greater Cleveland.</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-topics" role="tab" aria-selected="true">Topics</button>
      <button class="tab" id="tab-uh" role="tab" aria-selected="false">University Heights</button>
      <button class="tab" id="tab-resources" role="tab" aria-selected="false">Local resources</button>
      <button class="tab" id="tab-coverage" role="tab" aria-selected="false">Coverage</button>
    </div>
    <div class="spacer"></div>
    <div class="save off" id="save"><span class="dot"></span><span id="saveText">Loading</span></div>
    <button class="btn primary" id="addBtn">Add topic</button>
  </header>
  <aside class="rail" id="rail"></aside>
  <section class="list" id="list">
    <div class="search"><input id="q" type="search" placeholder="Search titles, keywords, articles, resources" aria-label="Search topics"></div>
    <div class="uhbar" id="uhbar" hidden></div>
    <div class="results" id="results"></div>
    <div class="items" id="items"></div>
  </section>
  <section class="detail" id="detail"></section>
  <section class="res-page" id="resPage" hidden></section>
  <section class="res-page" id="covPage" hidden></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="state">{"topics": [{"id": 1, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "Why Cultural Competency Matters More Than Ever", "seoTitle": "Why Cultural Competency Matters More Than Ever", "meta": "Cultural competency is a practical skill for business, community and leadership. CiCi Caver shares why it matters now and how to build it.", "focus": "cultural competency", "keywords": "cultural competency in business, cultural awareness, inclusive leadership, community relationships, Northeast Ohio business, working across differences", "article": "When I opened my first business in 2007, nobody handed me a workshop on cultural competency. I learned it at the counter. I sold wigs and hair pieces, and my customers were women facing hair loss from medical treatment, women who wore protective styles, older women, younger women, women from every part of Cleveland and beyond. Each one walked in with a different story, a different budget and a different idea of what beautiful meant. If I had treated them all the same way, I would have lost most of them.\n\nThat is what cultural competency really is. It is not a slogan or a training you complete once a year. It is the ability to understand, respect and work well with people whose lives look different from yours. And today it matters more than ever.\n\nOur communities are changing fast. The east side of Cleveland and the suburbs of Cuyahoga County are home to longtime residents, new immigrants, young families, retirees, entrepreneurs and people starting over. In my commercial real estate work at Kowit, I meet business owners from many backgrounds who all want the same thing: a fair shot at a space where their business can grow. The way I communicate with a first generation restaurant owner is not the same way I communicate with a property owner who has held a building for forty years. Both deserve to be understood.\n\nCultural competency matters because misunderstanding is expensive. In business, it shows up as lost customers, failed partnerships and marketing that misses the mark. In community work, it shows up as programs nobody uses and meetings where the same few voices speak. In leadership, it shows up as decisions made for people instead of with them.\n\nThe good news is that cultural competency is a skill, and skills can be built. Here is what has helped me:\n\nFirst, get curious instead of comfortable. Ask questions. Listen to the answers without rushing to fix or judge.\n\nSecond, notice your own assumptions. We all carry them. The goal is not to pretend you have none. The goal is to catch them before they make your decisions for you.\n\nThird, spend time in places where you are not the expert. Volunteer, visit a different neighborhood business district, attend an event where you do not know anyone. Exposure teaches what books cannot.\n\nFourth, adjust how you communicate. Some people want details up front. Some want relationship first. Some need things in writing. Meeting people where they are is not weakness. It is respect.\n\nAs a mentor with Cleveland Business Mentors and as Chair of the University Heights City Beautiful Corporation, I see every day that the people who build trust across differences are the ones who get things done. They bring more people to the table, and their ideas are stronger for it.\n\nCultural competency is no longer optional. It is a core skill for anyone who wants to lead, sell, serve or build in a diverse community. The world is not getting less diverse. The question is whether we will get better at understanding each other.", "resources": ["Global Cleveland: connects and welcomes international newcomers to the region", "Heights Libraries: free community programs that bring different neighbors together", "Cleveland Business Mentors: workshops and mentoring for entrepreneurs from every background"], "talking": ["Cultural competency is a practical skill, not a one time training", "I learned it serving a wide range of women in my wig and hair replacement business", "Misunderstanding costs money in business and trust in communities", "Four habits: get curious, catch assumptions, seek exposure, adjust communication", "Leaders who build trust across differences get more done"], "linkedin": "I learned cultural competency at the counter of my first business, serving women with very different stories, budgets and ideas of beauty. Today I use the same skill in commercial real estate and community development. Misunderstanding is expensive. Curiosity is a competitive advantage. How are you building this skill on your team?", "instagram": "Treating everyone the same is not the same as treating everyone well. Cultural competency is a skill you can build, one conversation at a time. #CulturalCompetency #InclusiveLeadership #ClevelandBusiness #JustAskCC #CommunityMatters", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["City of Cleveland", "Greater Cuyahoga County"], "uh": false}, {"id": 2, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "The Difference Between Cultural Awareness and Cultural Intelligence", "seoTitle": "Cultural Awareness vs Cultural Intelligence", "meta": "Knowing about differences is not the same as working well across them. Learn the difference between cultural awareness and cultural intelligence.", "focus": "cultural intelligence", "keywords": "cultural awareness, cultural intelligence, CQ, workplace diversity, inclusive communication, emotional intelligence, leadership skills", "article": "A lot of people are culturally aware. Fewer are culturally intelligent. The difference matters, especially if you lead people, serve customers or work in a community that looks different from the one you grew up in.\n\nCultural awareness means you know that differences exist. You know that people celebrate different holidays, communicate in different styles and come from different economic and family backgrounds. Awareness is the starting line. It is important, but it is passive. You can be aware and still behave exactly the same way you always have.\n\nCultural intelligence is what you do with that awareness. It is the ability to adjust your behavior, your communication and your decisions so you can work effectively with people who are different from you. Researchers sometimes call it CQ, the cultural version of IQ or emotional intelligence. I think of it simply as awareness put into action.\n\nHere is an example from my own work. In commercial real estate, I market more than 30 active listings across Northeast Ohio. Being aware means I know that the buyers and tenants for a retail strip in one suburb may be very different from the buyers for an industrial building near the highway. Being intelligent about it means I change the photos, the language, the channels and even the time of day I post so the right people actually see it and feel spoken to.\n\nThe same thing happens in mentoring. Through Cleveland Business Mentors, I meet entrepreneurs who are just starting out and owners who have been in business for decades. Some come from families where business was dinner table conversation. Others are the first in their families to own anything. Awareness tells me those backgrounds are different. Intelligence tells me how to adjust: when to explain a term like NNN lease without making someone feel small, when to slow down, when to push.\n\nSo how do you move from awareness to intelligence?\n\nStart with motivation. You have to actually want to understand people who are different from you. Without real interest, everything else becomes a performance.\n\nBuild knowledge. Learn about the histories, values and experiences of the people you serve. Read, ask and listen.\n\nPractice strategy. Before a meeting or presentation, think about who will be in the room and what they may need to feel included and understood.\n\nAdjust in the moment. Pay attention to how people respond. If something is not landing, change your approach instead of repeating yourself louder.\n\nCultural intelligence is not about getting everything right. I still make mistakes. The difference is that culturally intelligent people notice, learn and adjust instead of getting defensive.\n\nIn a region like ours, with so many communities sitting side by side, cultural intelligence is a real advantage. It helps businesses grow, helps organizations serve better and helps neighbors work together. Awareness opens the door. Intelligence is how you walk through it.", "resources": ["Global Cleveland: resources for working with and welcoming international talent", "ECDI Women's Business Center of Northern Ohio: serves women, immigrants and refugees building businesses", "Cleveland Business Mentors: mentoring and workshops for business owners"], "talking": ["Awareness is knowing differences exist; intelligence is acting on that knowledge", "Cultural intelligence is sometimes called CQ", "Example: tailoring listing marketing to different buyer audiences", "Four parts: motivation, knowledge, strategy, adjustment", "Mistakes happen; the skill is noticing and adjusting without defensiveness"], "linkedin": "Cultural awareness is knowing people are different. Cultural intelligence is knowing what to do about it. In real estate marketing and in business mentoring, I have learned that adjusting your approach is what builds trust and results. Awareness opens the door. Intelligence walks through it.", "instagram": "Knowing about differences is step one. Working well across them is the real skill. Are you aware, or are you intelligent about it? #CulturalIntelligence #Leadership #SmallBusinessTips #JustAskCC #NortheastOhio", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cleveland Region"], "uh": false}, {"id": 3, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "Why We Need to Talk About Economic Class, Not Just Race", "seoTitle": "Why We Need to Talk About Economic Class", "meta": "Conversations about equity often skip economic class. CiCi Caver explains why class shapes access, opportunity and small business viability.", "focus": "economic class", "keywords": "economic class, social class and opportunity, economic mobility, purchasing power, disadvantaged businesses, equity conversations, Cleveland economy", "article": "Whenever we talk about equity in America, the conversation usually starts and ends with race. Race matters. I am a Black woman, and I know that history and experience are real. But over the years I have come to believe that if we only talk about race, we miss a big part of the picture. We also have to talk about economic class.\n\nClass shapes almost everything. It shapes what neighborhood you grow up in, what school you attend, who your parents know, whether you can afford an unpaid internship and whether you can take a risk on a business idea without losing your home. Two people of the same race can live completely different lives depending on their economic starting point. And people of different races who grew up with the same financial struggles often have more in common than we admit.\n\nI see this clearly in my work. Through Cleveland Business Mentors, I meet entrepreneurs from every background. The ones who struggle most are often the ones without a financial cushion. They do not have family money to cover a slow month. They may not have credit strong enough to sign a commercial lease. They do not always have someone in their circle who has done this before. Those barriers cross racial lines.\n\nIn commercial real estate, I talk a lot about what I call viability before visibility. Before a business worries about a big sign or a busy storefront, it needs to be viable. It needs customers with real purchasing power, a realistic budget and a space it can afford. Economic class affects every one of those things, both for the owner and for the community the business serves.\n\nWhy does this matter? Because when we leave class out, our solutions do not fit the problem. A program can be designed for a racial group and still miss the people with the greatest need inside that group. A neighborhood can attract investment that looks diverse on paper while longtime residents with lower incomes get priced out.\n\nTalking about class also helps people find common ground. Many families across Cuyahoga County, across every race, know what it feels like to stretch a paycheck, to be one emergency away from trouble or to feel locked out of opportunity. When we name that shared experience, we can build coalitions instead of competitions.\n\nThis is not about choosing class over race. It is about seeing both. Race and class overlap, and the overlap is where some of the deepest disadvantages live. A good strategy looks at the whole person and the whole community.\n\nAs Chair of the University Heights City Beautiful Corporation, I think about this when we discuss development. Who benefits? Who can afford what we are building? Are we creating opportunity for people who are already here?\n\nIf we want real progress, we need honest conversations about money, access and opportunity. Economic class belongs at the center of that conversation.", "resources": ["ECDI Women's Business Center of Northern Ohio: training and loans for entrepreneurs who struggle to get traditional financing", "Cuyahoga County Department of Development: business growth lending", "Ohio SBDC at Cleveland State University: free, confidential one on one advising", "Cleveland Business Mentors: free mentoring for Cuyahoga County entrepreneurs"], "talking": ["Race matters, and so does economic class; we need to see both", "Class shapes neighborhood, schools, networks and the ability to take risks", "The biggest entrepreneur barriers I see are financial cushions, credit and networks", "Viability before visibility: purchasing power and affordability come first", "Naming shared economic struggles builds coalitions across groups"], "linkedin": "As a Black woman, I know race matters. As a mentor and real estate agent, I also see how much economic class shapes who gets a fair shot. If we leave class out of equity conversations, our solutions miss the people with the greatest need. Let us talk about both.", "instagram": "Opportunity is shaped by more than one thing. Money, access and networks matter too. Time for honest conversations about economic class. #EconomicMobility #Equity #SmallBusiness #ClevelandOhio #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cuyahoga County"], "uh": false}, {"id": 4, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "How Our Upbringing Shapes the Way We See the World", "seoTitle": "How Our Upbringing Shapes How We See the World", "meta": "The way we were raised shapes how we view money, work, risk and people. CiCi Caver reflects on upbringing, perspective and personal growth.", "focus": "upbringing and perspective", "keywords": "upbringing, worldview, childhood influence, money mindset, personal growth, perspective, self awareness", "article": "Every one of us walks around with a set of invisible instructions. We got them from our parents, grandparents, neighbors, churches, schools and the streets we grew up on. Those instructions tell us how to think about money, work, risk, authority and people who are different from us. Most of the time we do not even notice they are there.\n\nI started thinking about this seriously as a mom of four. Watching my children grow up, I see how quickly they pick up what I say and, even more, what I do. If I talk about money with fear, they learn fear. If I talk about business as possible, they learn possibility. Our upbringing is not just a memory. It becomes the lens we use for the rest of our lives.\n\nThink about money. Some people grew up hearing that you should never take on debt. Others grew up watching family members use credit to build something. Some learned that talking about money was rude. Those early lessons follow us into adulthood. In my work with entrepreneurs, I can often tell which lessons someone carries by how they react to a lease, a loan or a marketing budget.\n\nThink about risk. When I started my first business in 2007, I was taking a leap that not everyone around me understood. Some people see entrepreneurship as exciting. Others see it as reckless because, where they come from, a steady paycheck was the only safe path. Neither view is wrong. They are both shaped by experience.\n\nThink about people. Our upbringing teaches us who to trust, who to fear and who belongs. If you grew up in one neighborhood and rarely left it, your idea of normal may be very narrow. That is not a character flaw. It is a starting point, and starting points can expand.\n\nI am studying psychology now at Capella University, and one thing that stands out is how much early experiences shape the way we process the world. The good news is that awareness gives us choices. Once you notice the instructions you were given, you can decide which ones to keep and which ones to rewrite.\n\nHere are a few questions I ask myself and the people I mentor:\n\nWhat did I learn about money growing up, and is it still true for me?\n\nWhat did I learn about people who are different from me, and has my experience confirmed or challenged it?\n\nWhat did I learn about success, and whose definition was it?\n\nWhat lessons am I passing on, on purpose or by accident?\n\nUnderstanding our upbringing also makes us more patient with others. When someone reacts in a way that does not make sense to us, there is usually a story behind it. Asking about that story builds understanding instead of conflict.\n\nWe cannot change where we came from. But we can understand it, honor what was good, and grow past what no longer serves us. That is how we widen our view of the world.", "resources": ["Heights Libraries: children's, teen and adult programs that widen what families see as possible", "Cleveland Business Mentors: mentors who help entrepreneurs rethink inherited ideas about money and risk"], "talking": ["Upbringing gives us invisible instructions about money, work, risk and people", "As a mom of four, I see how quickly children absorb what we model", "Entrepreneurs often react to leases and loans based on childhood money lessons", "Awareness lets us choose which lessons to keep and which to rewrite", "Understanding others' upbringing builds patience and reduces conflict"], "linkedin": "We all carry invisible instructions from how we were raised: about money, risk and people. In mentoring entrepreneurs, I see these lessons show up in every decision about leases, loans and budgets. The question is which lessons still serve you.", "instagram": "Where you come from shapes how you see. Where you go next is up to you. What lesson from your upbringing are you rewriting? #PersonalGrowth #Mindset #MomOfFour #JustAskCC #SelfAwareness", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 5, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "Why People From the Same Community Can Have Completely Different Experiences", "seoTitle": "Same Community, Different Experiences", "meta": "Living in the same place does not mean living the same life. CiCi Caver explores why neighbors experience one community so differently.", "focus": "community experiences", "keywords": "community experience, neighborhood differences, inclusive communities, University Heights, Cleveland east side, resident engagement, local perspective", "article": "Two people can live on the same street, shop at the same grocery store and send their kids to the same school, and still have completely different experiences of their community. I have seen this my whole life, and I see it now in my role in University Heights.\n\nWhen people talk about a community, they often describe it as one thing. It is a great place to raise kids. It is quiet. It is changing. It is struggling. But a community is really a collection of many experiences layered on top of each other. What feels welcoming to one resident can feel distant or closed to another.\n\nSo why does this happen?\n\nIncome is a big part of it. A family with two strong incomes experiences a city very differently from a family living paycheck to paycheck. One sees new restaurants as exciting. The other sees them as a sign that the neighborhood may soon be too expensive.\n\nTime is another part. A longtime resident remembers what used to be there and who used to run it. A newer resident only knows what is there now. Both are valid, but they bring different expectations to every conversation about change.\n\nAge matters too. Seniors may care most about safety, sidewalks and transportation. Young parents may care about parks and schools. Teenagers may care about whether there is anywhere for them to go at all.\n\nAnd connection matters. Some residents are plugged into every meeting, newsletter and group chat. Others work long hours, care for family members or simply never got invited in. They live in the community, but they are not connected to the decisions being made about it.\n\nAs Chair of the University Heights City Beautiful Corporation, I take this seriously. When we talk about commercial corridors, development or new programs, I try to ask: whose experience are we hearing? Whose are we missing? The loudest voices are not always the most representative ones.\n\nThe same lesson applies to business. In my commercial real estate work, I have learned that a location can be perfect for one type of business and wrong for another, even on the same block. The community around it is not one market. It is many markets with different needs and spending habits.\n\nIf we want stronger communities, we have to stop assuming everyone is having the same experience. That means listening in more places, not just at city hall. It means going to the barbershop, the library, the school pickup line and the small businesses on the corridor. It means asking people what they need instead of guessing.\n\nWhen we honor the different experiences inside one community, we make better decisions. We design spaces and programs that work for more people. And more people feel like the community truly belongs to them.", "resources": ["City of University Heights Services for Older Adults: takes suggestions for new programs from residents", "Heights Emergency Food Center: serves Cleveland Heights, University Heights, South Euclid and Lyndhurst", "Heights Libraries, University Heights branch: a shared space for every kind of resident"], "talking": ["A community is many layered experiences, not one", "Income, time in the community, age and connection all shape experience", "The loudest voices are not always the most representative", "Even on one block, a community is many different markets", "Listen in more places: barbershops, libraries, school pickup lines, local businesses"], "linkedin": "Same street, same schools, completely different experiences. In my work with the University Heights City Beautiful Corporation, I keep asking whose experience we are hearing and whose we are missing. Better decisions start with wider listening.", "instagram": "Your neighbor may be living a very different version of your community. Have you asked them about it? #CommunityDevelopment #UniversityHeights #ClevelandEastSide #JustAskCC #Neighbors", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs"], "uh": true}, {"id": 6, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "Understanding Privilege Without Making It Personal", "seoTitle": "Understanding Privilege Without Making It Personal", "meta": "Privilege is about advantages, not blame. CiCi Caver shares a calmer way to talk about privilege that opens doors instead of closing them.", "focus": "understanding privilege", "keywords": "privilege, unearned advantage, difficult conversations, equity, empathy, workplace conversations, community dialogue", "article": "Few words shut down a conversation faster than the word privilege. Say it in a room and you can watch people fold their arms. Some hear it as an accusation. Others hear it as a dismissal of everything they worked for. I understand both reactions. But I believe we can talk about privilege in a way that helps people listen instead of defend.\n\nHere is how I define it. Privilege is an advantage you did not have to earn. That is all. It does not mean your life was easy. It does not mean you did not work hard. It simply means some doors were already open when you got to them.\n\nPrivilege comes in many forms. There is economic privilege, like growing up with a financial safety net. There is educational privilege, like having parents who understood college applications. There is network privilege, like knowing someone who can introduce you to a banker or a landlord. There is the privilege of good health, of a stable home, of speaking the language of the room. Most of us have some privileges and lack others.\n\nI have experienced both sides. As a business owner who started from scratch in 2007, I did not have family money or a business network to lean on. I learned on my own how to get customers through the door. At the same time, I know I have advantages today that many people I mentor do not have, like years of experience, a professional license and relationships across Northeast Ohio. Recognizing that does not take anything away from me. It helps me understand where I can open doors for others.\n\nThe mistake we often make is turning privilege into a personal verdict. When the conversation becomes about whether someone is a good or bad person, people stop listening. When the conversation is about how systems and circumstances shape opportunity, people can engage without feeling attacked.\n\nSo here is a simpler approach:\n\nFocus on doors, not blame. Ask which doors were open for you and which were closed for others.\n\nUse examples, not labels. Talking about the cost of an unpaid internship lands better than calling someone privileged.\n\nInvite reflection, not confession. Nobody needs to apologize for their life. They just need to see it clearly.\n\nTurn awareness into action. The best use of privilege is to share it: make an introduction, mentor someone, explain how a process works.\n\nIn my commercial real estate work, I often see how network privilege plays out. One business owner knows to negotiate tenant improvements because a friend told them. Another signs the first lease offered because nobody explained the options. The fix is not guilt. The fix is information and access.\n\nWhen we stop making privilege personal, we can make it useful. It becomes a tool for opening more doors, not a weapon for winning arguments.", "resources": ["Cleveland Business Mentors: share your experience by volunteering as a mentor", "Heights Libraries job search and job training resources: open doors for neighbors at no cost"], "talking": ["Privilege is an unearned advantage, not a judgment of character", "It comes in many forms: economic, educational, network, health, language", "Most people have some privileges and lack others", "Focus on doors, not blame; examples, not labels", "The best use of privilege is sharing access and information"], "linkedin": "Privilege does not mean your life was easy. It means some doors were already open when you got there. When we stop treating privilege as a personal verdict, we can use it for what matters: opening doors for others. Who opened a door for you?", "instagram": "Less blame, more doors. Privilege is something we can share, not something we have to argue about. #Equity #Empathy #Mentorship #JustAskCC #HardConversations", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cleveland Region"], "uh": false}, {"id": 7, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "How Cultural Differences Affect Communication in the Workplace", "seoTitle": "How Cultural Differences Affect Workplace Communication", "meta": "Directness, timing and tone vary across cultures. Learn how cultural differences shape workplace communication and how to bridge the gaps.", "focus": "workplace communication", "keywords": "cultural differences at work, workplace communication, communication styles, team collaboration, remote teams, inclusive workplaces, cross cultural communication", "article": "Most workplace conflict is not about the work. It is about communication. And a lot of communication problems come from cultural differences we never talk about.\n\nI see this in many settings. I work with a virtual assistant based in the Philippines. I work with property owners who have been in business for decades and young entrepreneurs who communicate mostly by text. I sit on boards and committees with people from very different professional cultures. Each relationship has taught me that the way I communicate is not the only right way.\n\nHere are a few areas where cultural differences show up most.\n\nDirectness. Some people say exactly what they mean. Others soften their message to protect the relationship. A direct person may think the indirect person is unclear. The indirect person may think the direct person is rude. Neither is wrong. They are using different rules.\n\nTime. For some people, a 9 a.m. meeting means 8:55. For others, it means sometime soon after nine. Some people answer emails within minutes. Others see email as something to batch at the end of the day. Expectations around time cause a lot of quiet frustration.\n\nHierarchy. In some cultures, you do not question the boss in public. In others, pushing back is how you show you are engaged. If you lead a team, you may think everyone agrees because no one spoke up, when really they did not feel it was their place.\n\nRelationship versus task. Some people want to get straight to business. Others need to build trust first, with small talk, shared meals and personal connection. In my real estate work, I have learned that some deals move only after the relationship is solid.\n\nSo how do we bridge these gaps?\n\nTalk about communication openly. Ask your team how they like to receive feedback, how fast they expect replies and how they prefer to raise concerns.\n\nClarify instead of assume. If a message feels off, ask what was meant before reacting.\n\nCreate more than one way to speak up. Not everyone will talk in a meeting. Offer written feedback, one on one check ins and anonymous options.\n\nModel flexibility. Leaders set the tone. When a leader adjusts their style, everyone else learns that it is okay to do the same.\n\nWorking with my virtual assistant has been a great lesson in this. Clear written instructions, specific examples and regular check ins work far better than assuming we see things the same way.\n\nCultural differences in communication are not problems to solve. They are information. When we understand them, teams work better, customers feel respected and fewer good ideas get lost in translation.", "resources": ["Global Cleveland: support for employers working with international talent", "COSE: small business association with programs and peer connections", "Ohio SBDC at Cleveland State University: advising on management and team building"], "talking": ["Most workplace conflict is really about communication", "Key differences: directness, time, hierarchy, relationship versus task", "Silence in a meeting does not always mean agreement", "Ask your team how they prefer to communicate and give feedback", "Leaders who adjust their style give others permission to do the same"], "linkedin": "Direct or indirect. Task first or relationship first. Fast replies or batched replies. Working with a team across time zones and generations has taught me that my way is not the only right way. The fix is simple: talk about how you communicate before it becomes a conflict.", "instagram": "Not rude, just direct. Not unclear, just polite. Cultural differences change how we hear each other at work. #WorkplaceCulture #Communication #Leadership #RemoteWork #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 8, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "Why Diversity Does Not Automatically Create Inclusion", "seoTitle": "Why Diversity Does Not Automatically Create Inclusion", "meta": "A diverse room is not the same as an inclusive one. CiCi Caver explains the gap between diversity and inclusion and how to close it.", "focus": "diversity and inclusion", "keywords": "diversity and inclusion, inclusive culture, belonging at work, board diversity, community leadership, inclusive decision making", "article": "You can fill a room with people from different backgrounds and still have only a few people making the decisions. That is the difference between diversity and inclusion. Diversity is who is in the room. Inclusion is whose voice actually shapes what happens.\n\nI have been in plenty of rooms where I was one of the few women or one of the few Black professionals. Sometimes I was invited to speak and truly heard. Other times I was there, but the real decisions had already been made in conversations I was not part of. On paper, both rooms looked diverse. Only one of them was inclusive.\n\nWhy does diversity not automatically lead to inclusion?\n\nBecause habits do not change just because faces do. If meetings are still run the same way, if the same people still set the agenda, and if the same informal networks still decide who gets opportunities, new voices stay on the edges.\n\nBecause people are often invited for appearance, not input. When someone is added to a board or panel to check a box, everyone can feel it, including that person.\n\nBecause inclusion takes work. It means sharing power, slowing down to hear different views and sometimes changing your plans based on what you learn.\n\nIn my role as Chair of the University Heights City Beautiful Corporation and in my work with Cleveland Business Mentors, I think about this a lot. It is not enough to say a program is open to everyone. We have to ask whether everyone actually knows about it, can access it and feels welcome when they show up.\n\nHere are some practical ways to move from diversity to inclusion:\n\nShare the agenda. Let different people help decide what gets discussed, not just respond to it.\n\nRotate leadership roles. Let different members lead meetings, projects and presentations.\n\nWatch who talks. If the same three people speak every time, create space for others. Ask directly and wait for the answer.\n\nFollow up on input. If someone shares an idea, show what happened to it. Nothing kills inclusion faster than ideas disappearing.\n\nLook at the informal spaces. Who gets invited to lunch, to the side conversation, to the planning call? That is often where real decisions happen.\n\nBusinesses face the same challenge. A company can hire a diverse team and still lose those employees if they never feel heard or never see a path to grow. A community can attract diverse residents and still have only one group shaping its future.\n\nDiversity is a starting point. Inclusion is the result of daily choices. When people feel like they truly belong and their voice matters, they bring their best ideas, and everyone benefits.", "resources": ["City of University Heights boards and volunteer opportunities: a way to bring new voices into decisions", "Cleveland Business Mentors: cohorts that bring together entrepreneurs from across Cuyahoga County"], "talking": ["Diversity is who is in the room; inclusion is whose voice shapes decisions", "Habits do not change just because faces do", "Inviting people for appearance instead of input is felt by everyone", "Share agendas, rotate leadership, watch who talks, follow up on ideas", "Real decisions often happen in informal spaces; open those too"], "linkedin": "I have been in diverse rooms where I was truly heard, and diverse rooms where the decisions were already made. Diversity is who is present. Inclusion is whose voice changes the outcome. Which kind of room are you building?", "instagram": "Being invited is not the same as being heard. Inclusion is a daily choice. #DiversityAndInclusion #Belonging #WomenInLeadership #JustAskCC #CommunityLeadership", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 9, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "The Unspoken Rules of Professional Environments", "seoTitle": "The Unspoken Rules of Professional Environments", "meta": "Every workplace has hidden rules about dress, speech and networking. CiCi Caver shares the unwritten rules nobody teaches and how to learn them.", "focus": "unspoken rules at work", "keywords": "unwritten rules, professional etiquette, hidden curriculum, first generation professionals, career advice, networking, workplace norms", "article": "Every professional environment has two rulebooks. One is written down: the handbook, the policies, the job description. The other is never written anywhere, but everyone is expected to know it. That second rulebook often decides who gets ahead.\n\nThe unspoken rules include things like how to dress for a particular meeting, how long to wait before following up, when it is okay to disagree, who to copy on an email, how to introduce yourself at a networking event and what to talk about over lunch. People who grew up around professionals often learn these rules without trying. People who did not have to figure them out the hard way.\n\nI had to learn many of these rules on my own. When I started in business, I did not have a mentor explaining how commercial leases worked or how to talk to a banker. When I moved into commercial real estate, I entered an industry with its own language, customs and relationships. Some lessons came from watching. Some came from mistakes.\n\nHere are a few unspoken rules I wish someone had told me earlier:\n\nRelationships move faster than resumes. People do business with people they know and trust. Showing up consistently matters as much as being qualified.\n\nFollow up is expected. A thank you note or a short email after a meeting is not extra. It is part of the job.\n\nPreparation is respect. Knowing someone's business before you meet them shows you value their time.\n\nHow you say it matters. In many professional rooms, ideas framed as questions or options get a better hearing than ideas framed as demands, even when the idea is the same.\n\nThe meeting before the meeting is real. Big decisions are often shaped in small conversations ahead of time.\n\nThe problem with unspoken rules is that they quietly reward people who already have access. If you are a first generation professional, a new business owner or someone moving into a new industry, you may be judged on rules you were never taught.\n\nThat is why I believe in making the hidden rules visible. In my work with Cleveland Business Mentors, a big part of mentoring is simply explaining how things work: what a lender expects to see, how to prepare for a negotiation, what a landlord means by a certain term. That information can change someone's trajectory.\n\nIf you are learning the rules, watch closely, ask questions and find a mentor who will tell you the truth. If you already know the rules, share them. Explain the why behind the way things are done. You may be the person who saves someone years of trial and error.\n\nUnspoken rules do not have to stay unspoken. When we talk about them openly, we make professional spaces fairer for everyone.", "resources": ["Cleveland Business Mentors: mentors who explain how lenders, landlords and partners think", "ECDI Women's Business Center of Northern Ohio: coaching and training for new business owners", "Ohio SBDC at Cleveland State University: free advising for entrepreneurs", "Heights Libraries job search and job training resources"], "talking": ["Every workplace has a written rulebook and an unwritten one", "People raised around professionals learn the hidden rules without trying", "Key rules: relationships, follow up, preparation, framing, the meeting before the meeting", "Hidden rules reward people who already have access", "Mentors can make the hidden rules visible and change trajectories"], "linkedin": "Some of the most important rules in business are never written down. I learned many of them the hard way. Now, as a mentor, I make a point of saying them out loud. If you know the unwritten rules, share them. Someone is counting on it.", "instagram": "Follow up. Prepare. Build relationships before you need them. The rules nobody teaches you, now said out loud. #CareerAdvice #FirstGen #Mentorship #ProfessionalDevelopment #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 10, "category": 1, "categoryName": "Cultural Competency and Social Awareness", "title": "Why Exposure to Different People and Places Matters", "seoTitle": "Why Exposure to Different People and Places Matters", "meta": "Exposure expands what we believe is possible. CiCi Caver explains why meeting new people and visiting new places matters for growth and opportunity.", "focus": "exposure and opportunity", "keywords": "exposure, new experiences, opportunity gap, youth development, broadening perspective, travel and learning, community connection", "article": "You cannot want what you have never seen. That idea has shaped how I think about growth, opportunity and even parenting. Exposure to different people and places expands what we believe is possible for ourselves.\n\nAs a mom of four, I think about exposure all the time. When my children meet a business owner, visit a college campus, try a new food or spend time in a different part of town, their world gets a little bigger. They start to imagine futures they might not have considered. Exposure plants seeds.\n\nThe same is true for adults. Many of the entrepreneurs I meet through Cleveland Business Mentors are talented and driven, but they have never seen a business at the next level up close. They have never walked through a commercial build out, sat in on a negotiation or watched someone pitch a lender. Once they see it, the path becomes real.\n\nExposure matters for several reasons.\n\nIt breaks stereotypes. Spending time with people who are different from you makes it harder to hold on to simple ideas about them.\n\nIt builds confidence. The first time you walk into an unfamiliar room is the hardest. Each new experience makes the next one easier.\n\nIt grows networks. New places bring new people, and new people bring new opportunities.\n\nIt sparks ideas. Some of my best marketing and business ideas came from seeing how things worked in a completely different industry or city.\n\nHere in Northeast Ohio, it is easy to stay in our own lanes. People on the east side may rarely go west. Suburban residents may not know much about city neighborhoods, and the other way around. We have so much here: neighborhood business districts, libraries, cultural institutions, parks and small businesses with incredible stories. But we often stick to what we already know.\n\nIn my commercial real estate work, I travel all over the region. Visiting different corridors has taught me how much variety exists just a short drive away. It has also shown me that good ideas in one community can work in another.\n\nSo how can we create more exposure?\n\nVisit a business district you have never explored.\n\nAttend an event outside your usual circle.\n\nBring a young person along to a meeting, site visit or community event.\n\nSay yes to conversations with people whose lives are different from yours.\n\nIf you lead a program or organization, build exposure into what you do: field trips, job shadowing, guest speakers and partnerships across neighborhoods.\n\nExposure is one of the simplest and most powerful tools we have for expanding opportunity. It costs very little and can change everything. Every new person and place adds to your sense of what is possible.", "resources": ["Heights Libraries: children's and teen spaces, programs and community events", "Senior Partnership Program: gives University Heights seniors access to Cleveland Heights Senior Activity Center programs", "Cleveland Business Mentors: workshops where new entrepreneurs see how established businesses work"], "talking": ["You cannot want what you have never seen", "Exposure breaks stereotypes, builds confidence, grows networks and sparks ideas", "Many entrepreneurs have never seen the next level of business up close", "Northeast Ohio has rich variety, but we often stay in our own lanes", "Bring a young person along; build exposure into programs"], "linkedin": "You cannot want what you have never seen. As a mom of four and a business mentor, I have watched exposure change what people believe is possible. Bring someone with you to your next site visit, meeting or event. It might change their path.", "instagram": "New places. New people. New possibilities. When is the last time you explored a part of town you do not know? #Exposure #Opportunity #NortheastOhio #MomOfFour #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cleveland Region"], "uh": false}, {"id": 11, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "Why Some People Feel Invisible in Their Own Communities", "seoTitle": "Why Some People Feel Invisible in Their Communities", "meta": "Many residents live in a community without feeling seen by it. CiCi Caver explores why people feel invisible locally and what leaders can do.", "focus": "feeling invisible in community", "keywords": "community belonging, invisible residents, civic engagement, inclusive communities, resident voice, local leadership, University Heights", "article": "Some people live in a community for years and never feel like it sees them. They pay taxes, send their kids to school, shop at local businesses and go to work every day. But when decisions get made, their needs are not in the conversation. Their names are not on the committees. Their stories are not in the newsletter.\n\nI think about these residents a lot. In my role as Chair of the University Heights City Beautiful Corporation, I know that the people who show up to public meetings are not always the people most affected by what happens. Feeling invisible is not about being absent. It is about being overlooked.\n\nWho tends to feel invisible? Renters, who may feel that decisions are made mostly for homeowners. Working parents with no time for evening meetings. Seniors who are not online. Young adults who feel there is nothing in town for them. Small business owners who are too busy running their shops to attend planning sessions. People who are new to the area and do not know where to plug in.\n\nWhy does this happen? Often it is not intentional. Leaders communicate through the same channels they always have. Meetings happen at the same times. The same groups get invited. Over time, a small circle starts to feel like the whole community.\n\nThe cost is real. When people feel invisible, they disconnect. They stop voting in local elections. They stop volunteering. They stop believing their voice matters. And the community loses their ideas, energy and talent.\n\nI also see this in business. In my years running a retail boutique, some of my most loyal customers were women who told me they felt invisible everywhere else. Women dealing with hair loss often felt that nobody understood what they were going through. Being seen, really seen, built trust that lasted years.\n\nSo what can community leaders do?\n\nGo to where people already are. Libraries, schools, places of worship, barbershops, laundromats and local businesses.\n\nUse more than one channel. Not everyone reads email or follows the city on social media. Flyers, door hangers and word of mouth still work.\n\nAsk directly. Personal invitations bring people in far better than general announcements.\n\nShow the results. When residents share ideas, let them know what happened next.\n\nCreate small, low pressure ways to participate. Not everyone wants to join a board, but many people would answer a short survey or attend a casual coffee chat.\n\nFeeling seen is a basic human need. When a community makes room for every resident, it becomes stronger, more creative and more resilient. No one should feel like a stranger in the place they call home.", "resources": ["City of University Heights Services for Older Adults: program suggestions welcome, plus a monthly Senior Spotlight that celebrates residents", "Heights Emergency Food Center: help for neighbors in Cleveland Heights, University Heights, South Euclid and Lyndhurst", "Heights Libraries home delivery: library service for residents who cannot get to a branch"], "talking": ["Feeling invisible is about being overlooked, not absent", "Renters, working parents, seniors, young adults and busy business owners are often missed", "Invisibility leads to disconnection and lost talent", "My boutique customers taught me the power of being truly seen", "Meet people where they are, use many channels, invite personally, show results"], "linkedin": "The people most affected by local decisions are not always the people in the room. As Chair of the University Heights City Beautiful Corporation, I am asking who we are missing and how to reach them. Nobody should feel like a stranger in their own community.", "instagram": "You live here. You matter here. Your voice belongs here. #Belonging #CommunityVoices #UniversityHeights #CivicEngagement #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": true}, {"id": 12, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "The Psychology of Belonging", "seoTitle": "The Psychology of Belonging: Why We Need to Fit", "meta": "Belonging shapes how we work, learn and connect. CiCi Caver explores the psychology of belonging in business, community and everyday life.", "focus": "psychology of belonging", "keywords": "sense of belonging, human needs, psychology, workplace belonging, community connection, customer loyalty, social connection", "article": "The need to belong is one of the strongest forces in human life. Psychologists have long placed belonging right after basic needs like food, shelter and safety. When we feel like we belong, we take healthy risks, share ideas and give our best effort. When we feel like outsiders, we pull back, protect ourselves and hold our talents in reserve.\n\nAs I study psychology at Capella University, belonging is one of the ideas that connects everything I do. It shows up in business, in community development, in parenting and in leadership.\n\nIn business, belonging drives loyalty. When I ran my boutique, I learned that customers did not just buy products. They bought the feeling of being understood. A woman who walked in nervous about hair loss and walked out feeling confident did not just come back. She told her friends. Belonging is one of the most powerful marketing tools there is, and it cannot be faked.\n\nIn the workplace, belonging affects performance. Employees who feel included speak up more, stay longer and solve problems faster. Employees who feel like outsiders often do the minimum and leave as soon as they can.\n\nIn communities, belonging affects participation. Residents who feel like the community is theirs volunteer, vote, shop locally and look out for neighbors. Residents who feel like guests keep to themselves.\n\nSo what creates belonging?\n\nBeing known. People need to feel that others know their name and something about them.\n\nBeing valued. People need to feel their contributions matter.\n\nBeing safe. People need to know they can be themselves without being judged or punished.\n\nShared purpose. People feel they belong when they are part of something bigger than themselves.\n\nRituals and traditions. Regular gatherings, celebrations and routines remind people they are part of a group.\n\nBelonging can also be harmful when it is used to exclude. Groups sometimes build belonging by defining who is out. The healthiest communities create belonging that is wide, not narrow, where newcomers can find their place without longtime members feeling pushed aside.\n\nAs a leader, I try to ask simple questions. Does everyone here know each other's names? Has everyone had a chance to contribute? Would a newcomer feel welcome? These questions sound small, but they make a big difference.\n\nBelonging is not soft. It is the foundation for strong businesses, healthy workplaces and thriving communities. When people feel like they belong, they invest. And when they invest, everyone benefits.", "resources": ["Topic Tuesdays: weekly speakers and activities at the University Heights branch of Heights Libraries, presented with the city", "Senior Partnership Program: University Heights seniors can join Cleveland Heights Senior Activity Center programs", "Cleveland Business Mentors cohorts: a place for entrepreneurs to belong"], "talking": ["Belonging is a core human need, right after food, shelter and safety", "In business, belonging drives loyalty and word of mouth", "At work, belonging improves performance and retention", "Five drivers: being known, being valued, being safe, shared purpose, traditions", "Healthy belonging is wide, not narrow"], "linkedin": "Customers do not just buy products. They buy the feeling of being understood. Running my boutique taught me that belonging is one of the most powerful forces in business and community. Now I am studying the psychology behind it. Belonging is not soft. It is the foundation.", "instagram": "People invest where they feel they belong. Who are you making room for? #Belonging #Psychology #Community #Leadership #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 13, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "How Social Class Influences Opportunity", "seoTitle": "How Social Class Influences Opportunity", "meta": "Social class shapes access to education, networks and capital. CiCi Caver explains how class influences opportunity for families and entrepreneurs.", "focus": "social class and opportunity", "keywords": "social class, opportunity gap, economic mobility, access to capital, social networks, small business barriers, Cuyahoga County", "article": "We like to believe that anyone can make it if they work hard enough. Hard work matters. I have built businesses through long days and late nights. But I have also learned that social class plays a huge role in who gets the chance to turn hard work into opportunity.\n\nSocial class is about more than income. It includes wealth, education, connections, habits and even the way we speak. It shapes what we think is possible and what doors we know how to knock on.\n\nHere is how class shows up in real life.\n\nAccess to capital. Starting a business usually takes money. People from higher income families can often borrow from relatives, use savings or get a loan backed by home equity. Many entrepreneurs I mentor through Cleveland Business Mentors do not have those options. Their idea may be great, but they have no cushion to get it started.\n\nAccess to networks. Who you know matters. A person who grew up around lawyers, bankers and business owners has a built in advisory board. Someone without those connections has to build them from scratch.\n\nAccess to information. Knowing how to negotiate a lease, apply for a grant or read a financial statement can change everything. That knowledge is often passed down quietly in some families and missing completely in others.\n\nAccess to risk. Trying something new means you might fail. People with a safety net can afford to try again. People without one may only get one chance.\n\nIn commercial real estate, I see this clearly. A business owner with strong credit, savings and advisors can negotiate better terms, ask for tenant improvements and choose a location strategically. A first time owner without those resources may sign whatever is offered and struggle from day one. That is why I talk about viability before visibility. A beautiful storefront means nothing if the numbers do not work.\n\nClass also affects communities. Neighborhoods with more wealth often have more political influence, better maintained infrastructure and more investment. Neighborhoods with less wealth may have to fight for basic services.\n\nWhat can we do about it?\n\nShare information freely. Explaining how things work is one of the most powerful ways to open doors.\n\nBuild bridges between networks. Introduce people across class lines.\n\nSupport programs that provide access to capital and coaching, especially for first time entrepreneurs.\n\nDesign policies with all residents in mind, not just the most vocal ones.\n\nClass does not decide everything. Plenty of people rise above their starting point. But we should be honest that the climb is steeper for some than for others. When we level the path, more talent gets a chance to shine.", "resources": ["ECDI Women's Business Center of Northern Ohio: access to capital for entrepreneurs outside traditional lending", "Ohio SBDC at Cleveland State University: free one on one advising", "Cuyahoga County Department of Development: business growth lending", "Cleveland Business Mentors: free mentoring and networks"], "talking": ["Social class includes income, wealth, education, connections and habits", "Class shapes access to capital, networks, information and risk", "First time owners without resources often sign unfavorable leases", "Viability before visibility: the numbers must work first", "Share information, bridge networks, support access to capital"], "linkedin": "Hard work matters. So does where you start. Mentoring entrepreneurs, I see how access to capital, networks and information shapes who gets to turn effort into opportunity. One of the most powerful things we can do is simply explain how things work.", "instagram": "Talent is everywhere. Access is not. Let us level the path. #EconomicMobility #SmallBusiness #Opportunity #ClevelandEntrepreneurs #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 14, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "Why People Resist Change Even When Change Benefits Them", "seoTitle": "Why People Resist Change Even When It Helps Them", "meta": "Fear, loss and trust drive resistance to change. CiCi Caver explains why people push back on good ideas and how leaders can help.", "focus": "resistance to change", "keywords": "resistance to change, change management, community change, fear of loss, leadership, trust, neighborhood development", "article": "I have watched good ideas fail not because they were wrong, but because people resisted them. A new program that would help residents. A business improvement that would bring in more customers. A development project that would create jobs. People pushed back anyway. Over time I have learned that resistance to change usually has little to do with logic and a lot to do with emotion.\n\nHere are the most common reasons people resist change, even when it benefits them.\n\nFear of loss. Change always means giving something up, even if it is just the familiar. People focus more on what they might lose than on what they might gain. Psychologists call this loss aversion, and it is powerful.\n\nLack of trust. If people have been promised improvements before and been let down, they will be skeptical. In many neighborhoods, history gives residents good reason to question whether change is really meant for them.\n\nFeeling left out. When people are not involved in shaping a change, they are much more likely to oppose it. Nobody likes having change done to them.\n\nUncertainty. Not knowing what will happen next is uncomfortable. Many people prefer a known problem to an unknown solution.\n\nIdentity. Sometimes change feels like a threat to who we are. A longtime resident may feel that a new business district erases the neighborhood they grew up in.\n\nI see this in community development work. When we talk about revitalizing commercial corridors in University Heights and nearby communities, some residents get excited and others get nervous. Both reactions make sense. The nervous residents are not anti progress. They want to know the change will include them.\n\nI also see it with small business owners. Many entrepreneurs I mentor know they need to update their marketing, raise their prices or change their location. But change is scary when your livelihood is on the line.\n\nSo how can leaders help people through change?\n\nInvolve people early. Ask for input before decisions are made, not after.\n\nBe honest about the tradeoffs. Admit what will be lost, not just what will be gained.\n\nBuild trust through small wins. Show progress in visible, practical ways.\n\nCommunicate often and clearly. Fill the information gap before rumors do.\n\nHonor the past. Acknowledge what people value about how things have been.\n\nResistance is not the enemy. It is information. It tells you what people care about and what they fear. When leaders listen to resistance instead of fighting it, change becomes something people do together rather than something done to them.", "resources": ["University Heights City Beautiful Corporation meetings: where local development ideas are discussed", "Heights Observer: community newspaper covering changes in Cleveland Heights and University Heights", "Cleveland Business Mentors: support for owners facing big business changes"], "talking": ["Resistance to change is usually emotional, not logical", "Main drivers: fear of loss, lack of trust, feeling left out, uncertainty, identity", "Residents nervous about development usually want to be included, not to stop progress", "Involve people early, be honest about tradeoffs, build small wins", "Resistance is information about what people value"], "linkedin": "Good ideas fail all the time because leaders ignore why people resist. In community development and in business mentoring, I have learned that resistance is information. Involve people early, be honest about tradeoffs and honor what people value. Change works best when it is done together.", "instagram": "People do not resist change. They resist losing what they love. Lead with that in mind. #ChangeManagement #Leadership #CommunityDevelopment #JustAskCC #NortheastOhio", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs"], "uh": false}, {"id": 15, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "The Difference Between Being Educated and Being Informed", "seoTitle": "Being Educated vs Being Informed: Why It Matters", "meta": "A degree does not make you informed, and lack of one does not make you uninformed. CiCi Caver explores the difference and why it matters.", "focus": "educated vs informed", "keywords": "education, being informed, lifelong learning, critical thinking, media literacy, civic knowledge, practical knowledge", "article": "Some of the smartest business people I know never finished college. And some of the most highly educated people I have met were surprisingly uninformed about how their own communities work. That is because being educated and being informed are not the same thing.\n\nBeing educated usually means you have completed formal schooling. You have degrees, credentials or certifications. Education teaches you how to think, gives you foundational knowledge and opens professional doors. I value education deeply. I am back in school myself, studying psychology at Capella University, with a real estate development program starting in January 2027.\n\nBeing informed means you know what is happening now and how it affects you. You understand the issues in your city, the changes in your industry and the forces shaping your life. You keep learning after the diploma.\n\nYou can be educated without being informed. A person can hold an advanced degree and still not know who their city council members are, how local budgets work or what zoning changes are coming to their street.\n\nYou can also be informed without being highly educated. Many entrepreneurs I mentor know their customers, their neighborhood and their market better than any textbook could teach. When I started my first business in 2007, I did not have a marketing degree. I learned by doing, by watching and by asking questions. That practical knowledge built a business.\n\nWhy does this difference matter?\n\nBecause decisions depend on current information. A business owner who is educated but not informed may miss a shift in customer behavior. A resident who is educated but not informed may not realize a development decision is coming until it is too late to weigh in.\n\nBecause respect should not depend on degrees. When we assume people without formal education have nothing to contribute, we lose valuable insight. Some of the best ideas in community meetings come from residents who have lived on a street for decades.\n\nBecause information is easier to get than ever, but harder to trust. Social media gives us constant updates, but not all of them are accurate. Being truly informed takes effort: checkin
