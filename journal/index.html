g sources, reading beyond headlines and listening to different viewpoints.\n\nHere is how I try to stay informed: I read local news, attend community meetings, talk with business owners and residents, follow industry reports and ask people with different perspectives what they are seeing.\n\nThe goal is to be both: educated enough to think critically and informed enough to act wisely. Education gives you tools. Information tells you where to use them.", "resources": ["Heights Observer: local news written by and for Heights residents", "Heights Libraries: research help, databases and community programs", "City of University Heights website: meeting agendas, minutes and city news"], "talking": ["Being educated means formal learning; being informed means current, practical knowledge", "You can have one without the other", "Many entrepreneurs are deeply informed without formal degrees", "Respect should not depend on credentials", "Stay informed: local news, community meetings, conversations, checking sources"], "linkedin": "I am back in school, and I value education deeply. But I have also learned that a degree does not make you informed. Some of the sharpest business minds I know learned by doing. The goal is both: educated enough to think critically, informed enough to act wisely.", "instagram": "Degrees open doors. Staying informed keeps you in the room. #LifelongLearning #StayInformed #Education #SmallBusiness #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 16, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "Why We Make Assumptions About People We Do Not Know", "seoTitle": "Why We Make Assumptions About People We Do Not Know", "meta": "Our brains take shortcuts that lead to snap judgments. CiCi Caver explains why we assume things about strangers and how to slow down.", "focus": "assumptions about people", "keywords": "assumptions, snap judgments, unconscious bias, first impressions, stereotypes, empathy, customer service", "article": "Within seconds of meeting someone, our brains have already started forming a story about them. We guess their income from their clothes, their education from the way they talk and their intentions from their facial expression. Most of the time, we do not even notice we are doing it.\n\nThis is not because we are bad people. It is because the brain is built to take shortcuts. We take in too much information to process everything carefully, so we sort people into categories based on past experience, media images and what we were taught growing up. Psychologists call these mental shortcuts heuristics. They help us move quickly, but they also lead us to wrong conclusions.\n\nI learned how costly assumptions can be when I ran my boutique. A woman would walk in wearing sweatpants and a baseball cap, and some people might assume she was not ready to spend. In reality, she might be going through chemotherapy, exhausted and looking for a high quality piece that would help her feel like herself again. If I had judged her by appearance, I would have failed her as a customer and as a person.\n\nThe same thing happens in commercial real estate. Some landlords make quick judgments about prospective tenants based on age, appearance or the type of business. A young entrepreneur with a modest presentation might have a strong business plan and loyal customers. A polished presenter might have shaky finances. Good decisions come from looking at the facts, not the surface.\n\nWhy do we make assumptions?\n\nFamiliarity. We trust what looks like us and question what does not.\n\nMedia. Television, movies and social media repeat certain images until they feel like truth.\n\nLimited exposure. If we have only met a few people from a certain group, those few become our whole picture.\n\nSpeed. When we are busy or stressed, we rely on shortcuts even more.\n\nSo how do we slow down?\n\nNotice the story you are telling yourself. Ask, what do I actually know about this person, and what am I guessing?\n\nGet curious. Ask questions instead of filling in blanks.\n\nLook for evidence that challenges your first impression.\n\nExpand your exposure. The more people you know from different backgrounds, the less power stereotypes have.\n\nGive people the benefit of the doubt you would want for yourself.\n\nAssumptions are human, but they do not have to be final. When we pause long enough to see people as they really are, we make better decisions, build stronger relationships and miss fewer opportunities. Some of the best customers, partners and friends I have ever had were people I could have easily misjudged.", "resources": ["Global Cleveland: builds connection between longtime residents and newcomers", "Cleveland Business Mentors: mentors trained to look past first impressions to the business plan"], "talking": ["The brain uses shortcuts that lead to snap judgments", "Assumptions come from familiarity, media, limited exposure and speed", "Boutique lesson: appearance told me nothing about a customer's needs", "In real estate, facts matter more than first impressions", "Notice the story, get curious, look for challenging evidence"], "linkedin": "In my boutique, the woman in sweatpants was often the customer who needed us most. Snap judgments cost businesses customers and cost communities connection. Before deciding who someone is, ask what you actually know and what you are guessing.", "instagram": "What do you actually know, and what are you guessing? Slow down before you decide who someone is. #Empathy #UnconsciousBias #CustomerService #JustAskCC #FirstImpressions", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 17, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "How Social Media Has Changed Our Perception of Success", "seoTitle": "How Social Media Changed Our Perception of Success", "meta": "Highlight reels make success look fast and easy. CiCi Caver, a marketer and entrepreneur, explains how social media distorts what success looks like.", "focus": "social media and success", "keywords": "social media, perception of success, comparison culture, entrepreneurship reality, highlight reel, mental health, small business owners", "article": "Scroll through social media for five minutes and you will see people launching businesses, buying homes, traveling the world and hitting six figures before thirty. Success looks fast, glamorous and everywhere. As a marketer, I understand why. As an entrepreneur who has built businesses the slow way, I also know how misleading it can be.\n\nSocial media shows the highlight reel. It shows the ribbon cutting, not the years of saving. It shows the sold out product, not the inventory that did not move. It shows the beautiful storefront, not the lease negotiation, the permits or the months of slow sales. When we compare our everyday reality to someone else's best moments, we will always feel behind.\n\nI started my first business in 2007, before Instagram existed. My boutique ran from 2008 to 2012, and then I moved the business online until 2018. I saw the shift happen in real time. At first, social media was a tool to connect with customers. Over time, it became a stage where everyone performed success.\n\nHere is what has changed.\n\nSuccess looks faster. Overnight success stories get attention, even though most businesses take years to become stable.\n\nSuccess looks more visual. Followers, likes and aesthetics have become stand ins for real achievement.\n\nSuccess looks more individual. Social media rarely shows the team, the family support, the mentors or the luck behind someone's win.\n\nSuccess looks more like spending. Expensive cars and vacations are shown as proof, even when they are financed or staged.\n\nThis matters for entrepreneurs. Through Cleveland Business Mentors, I meet business owners who feel like failures because their growth does not look like what they see online. Some spend money on branding and visibility before their business is truly viable. That is why I talk about viability before visibility. A pretty feed does not pay the rent. Steady customers and healthy margins do.\n\nIt also matters for our kids. As a mom of four, I want my children to understand that real success is built over time, often quietly, and usually with help.\n\nSo how do we keep a healthy view of success?\n\nRemember that you are seeing a selection, not the whole story.\n\nDefine success on your own terms: stability, freedom, impact, family time or whatever matters most to you.\n\nFollow people who share the process, not just the results.\n\nMeasure your progress against your own past, not someone else's present.\n\nSocial media can be a great tool for learning and marketing. Just do not let it become the ruler you measure your life against. Real success rarely fits in a square photo.", "resources": ["Cleveland Business Mentors workshops: practical marketing and planning, not highlight reels", "ECDI Women's Business Center of Northern Ohio: training on cash flow, planning and branding", "Ohio SBDC at Cleveland State University: help building realistic business plans"], "talking": ["Social media shows the highlight reel, not the process", "I watched the shift from my boutique days to ecommerce", "Success now looks faster, more visual, more individual and more about spending", "Viability before visibility: a pretty feed does not pay the rent", "Measure progress against your own past, not someone else's present"], "linkedin": "I ran my boutique before Instagram and moved online as social media took over. I have watched success become a performance. As a mentor, I remind entrepreneurs: steady customers and healthy margins matter more than likes. Viability before visibility.", "instagram": "You are seeing the ribbon cutting, not the years of work. Measure your progress against your own past. #RealEntrepreneurship #SocialMediaTruth #ViabilityBeforeVisibility #JustAskCC #SmallBusiness", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 18, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "Why Empathy Is Often Missing From Public Conversations", "seoTitle": "Why Empathy Is Missing From Public Conversations", "meta": "Public debates often reward outrage over understanding. CiCi Caver explores why empathy is missing and how to bring it back to civic life.", "focus": "empathy in public conversations", "keywords": "empathy, civil discourse, public meetings, polarization, community dialogue, civic engagement, listening", "article": "Turn on the news, read the comments under any local post or sit in on a heated public meeting, and you will notice something missing. Empathy. People talk at each other instead of with each other. They argue to win, not to understand.\n\nI do not think most people lack empathy. In private, one on one, most people can be kind and understanding. But in public conversations, something shifts. Why?\n\nThe format rewards conflict. Social media algorithms push content that makes us angry because anger keeps us scrolling. News coverage often highlights the most dramatic voices. Public meetings give people a few minutes at a microphone, which encourages speeches instead of dialogue.\n\nWe forget there is a person on the other side. Online, people become usernames. In large meetings, they become positions. It is easier to dismiss a position than a neighbor.\n\nWe feel threatened. When issues touch our homes, money, children or identity, we get defensive. Defensiveness crowds out curiosity.\n\nWe confuse empathy with agreement. Some people think understanding the other side means giving in. It does not. You can understand why someone feels the way they do and still disagree with their conclusion.\n\nIn my role as Chair of the University Heights City Beautiful Corporation, I know that development and community planning conversations can get emotional. People care deeply about their neighborhoods. A longtime resident worried about traffic and a young family excited about new restaurants may both be right about what matters to them. The goal is not to pick a winner. It is to understand both well enough to find a better solution.\n\nEmpathy also matters in business. When I mentor entrepreneurs, I often remind them that understanding a frustrated customer is more useful than proving them wrong. The same is true in civic life.\n\nSo how can we bring more empathy into public conversations?\n\nCreate smaller spaces for dialogue. Listening sessions, small group discussions and coffee conversations allow real exchange.\n\nAsk why before arguing what. Understanding someone's reasons often reveals common ground.\n\nRestate what you heard. Saying, what I hear you saying is, shows respect and prevents misunderstanding.\n\nAssume good intentions until proven otherwise.\n\nModel it as a leader. When leaders respond with empathy instead of defensiveness, others follow.\n\nEmpathy will not make every disagreement disappear. But it can turn shouting matches into problem solving. Our communities face real challenges, and we need every perspective to solve them. That starts with seeing each other as neighbors, not opponents.", "resources": ["Topic Tuesdays at the University Heights library branch: small group conversation in a friendly setting", "University Heights City Beautiful Corporation meetings: a place to share ideas about development", "Heights Libraries: community conversations and programs"], "talking": ["Most people have empathy privately but lose it in public settings", "Formats reward conflict; people become usernames and positions", "Empathy is not agreement", "Community planning works better when we understand all sides", "Smaller spaces, ask why, restate what you heard, model it"], "linkedin": "Empathy is not agreement. It is understanding why someone feels what they feel. In community development, the best solutions come when we stop trying to win and start trying to understand. Leaders set the tone.", "instagram": "Neighbors, not opponents. Ask why before you argue what. #Empathy #CivilDiscourse #CommunityLeadership #UniversityHeights #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 19, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "The Relationship Between Environment and Personal Ambition", "seoTitle": "How Your Environment Shapes Personal Ambition", "meta": "The people and places around us shape what we dream about. CiCi Caver explores the link between environment and ambition.", "focus": "environment and ambition", "keywords": "ambition, environment, motivation, role models, youth development, entrepreneurship, personal growth", "article": "Ambition does not grow in a vacuum. The people we see every day, the places we spend time and the conversations we hear all shape what we believe we can achieve. Environment does not decide our future, but it has a lot to say about it.\n\nThink about how ambition forms. A child who sees family members running businesses starts to see entrepreneurship as normal. A teenager whose friends are all planning for college starts planning too. A young adult surrounded by people who are stuck may start to believe that being stuck is just how life works.\n\nI think about this as a mom of four. I want my children to grow up seeing people who build things, solve problems and serve their communities. That is part of why I bring my work home in conversation. When my kids hear me talk about marketing a building, mentoring an entrepreneur or planning for our city, they learn that these paths exist.\n\nI also see it with the entrepreneurs I mentor through Cleveland Business Mentors. Many are incredibly ambitious, but their environment does not always support that ambition. Friends and family may not understand why they would leave a steady job. There may be no one nearby who has grown a business past the first few years. That can make ambition feel lonely.\n\nEnvironment shapes ambition in a few key ways.\n\nRole models. We aim for what we can see. Seeing someone like you succeed makes success feel possible.\n\nExpectations. The people around us set a baseline for what is normal.\n\nResources. Access to libraries, programs, mentors and safe places to learn makes ambition practical.\n\nEncouragement. Ambition grows faster when someone believes in you out loud.\n\nPhysical space. Neighborhoods with thriving businesses, clean streets and gathering places send a message about what is valued.\n\nThat last point matters to me in my community work. Commercial corridors are not just places to shop. They are signals. When young people walk past busy local businesses owned by people from their community, they see a future. When they walk past empty storefronts, they see something else.\n\nThe good news is that environments can be changed, both personally and collectively. On a personal level, you can choose who you spend time with, what you read and what rooms you walk into. On a community level, we can invest in mentorship programs, libraries, youth programs and thriving business districts.\n\nIf you feel your ambition shrinking, look around. You may need a new room, a new circle or a new mentor. And if you are already succeeding, remember that you are part of someone else's environment. Your example might be the thing that sparks their ambition.", "resources": ["Heights Libraries teen and children's spaces: places to learn, create and dream", "MORTAR Cleveland: entrepreneurship programs for underrepresented founders, in partnership with the United Black Fund", "Cleveland Business Mentors: role models and mentors for growing entrepreneurs"], "talking": ["Ambition is shaped by the people, places and conversations around us", "As a parent, I talk about my work so my children know these paths exist", "Five factors: role models, expectations, resources, encouragement, physical space", "Commercial corridors send signals about what is possible", "You are part of someone else's environment"], "linkedin": "We aim for what we can see. Busy local businesses, accessible mentors and strong role models feed ambition. Empty storefronts and isolation shrink it. That is part of why commercial corridor revitalization matters so much to me. Remember: you are part of someone else's environment.", "instagram": "If your ambition feels small, change the room. And remember, someone is watching you build. #Ambition #RoleModels #MomOfFour #CommunityDevelopment #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 20, "category": 2, "categoryName": "Society, Class and Human Behavior", "title": "Why Listening Is Becoming a Lost Skill", "seoTitle": "Why Listening Is Becoming a Lost Skill", "meta": "In a noisy world, real listening is rare and valuable. CiCi Caver explains why listening is fading and how to practice it in business and life.", "focus": "listening skills", "keywords": "listening skills, active listening, communication, leadership, customer relationships, mentoring, distraction", "article": "We live in a world full of talking. Podcasts, posts, videos, meetings, group chats and notifications all compete for our attention. Everyone has a platform, and everyone has something to say. But real listening, the kind where you give someone your full attention and actually try to understand them, is becoming rare.\n\nI have noticed this in every part of my life. In meetings, people are often waiting for their turn to talk rather than hearing what is being said. In conversations, phones sit on the table, half in our attention. Online, people reply to headlines without reading the article.\n\nWhy is listening fading?\n\nDistraction. Our devices have trained us to split our attention. It is hard to focus on one person when your phone keeps buzzing.\n\nSpeed. We are in a hurry, so we jump to conclusions or solutions before someone finishes talking.\n\nSelf expression culture. We are encouraged to share our opinions constantly, and listening can feel passive by comparison.\n\nDefensiveness. When conversations feel like debates, we listen for weaknesses to attack instead of ideas to understand.\n\nListening has been one of the most valuable skills in my career. In my boutique, I learned that customers often came in asking for one thing but needed something else entirely. The only way to find out was to listen closely, ask gentle questions and let them tell their story. In marketing consulting, the best strategies came from listening to what business owners and their customers actually said, not what I assumed.\n\nAs a mentor with Cleveland Business Mentors, listening is the job. An entrepreneur might come in asking about marketing, but after listening for a while, it becomes clear the real issue is cash flow or pricing. If I jumped straight to advice, I would solve the wrong problem.\n\nIn community leadership, listening is how trust is built. Residents can tell when leaders are just going through the motions. They can also tell when someone is truly paying attention.\n\nHere is how I practice better listening:\n\nPut the phone away. Fully away, not face down on the table.\n\nLet people finish. Resist the urge to jump in.\n\nAsk follow up questions. Tell me more is one of the most powerful phrases there is.\n\nReflect back what you heard to make sure you understood.\n\nListen for feelings, not just facts.\n\nGet comfortable with silence. Sometimes the most important thing comes after a pause.\n\nListening is a gift and a skill. In a noisy world, the person who truly listens stands out. Customers trust them. Teams follow them. Communities rally around them. If we want better businesses and better communities, we need to talk a little less and listen a lot more.", "resources": ["Cleveland Business Mentors: one on one mentoring where listening comes first", "Topic Tuesdays at the University Heights library branch: weekly speakers and conversation"], "talking": ["Real listening is rare in a world full of talking", "Distraction, speed, self expression culture and defensiveness all hurt listening", "In my boutique, customers often needed something different from what they asked for", "In mentoring, listening reveals the real problem", "Practice: phone away, let people finish, ask tell me more, reflect back"], "linkedin": "As a mentor, I have learned that the question someone asks is rarely the real problem. Listening long enough to find the real issue is the job. In a noisy world, people who truly listen stand out. Tell me more might be the most powerful phrase in business.", "instagram": "Phone away. Let them finish. Ask, tell me more. Listening is a skill worth practicing. #ActiveListening #Leadership #Mentorship #Communication #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 21, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "Who Gets a Voice in Community Development?", "seoTitle": "Who Gets a Voice in Community Development?", "meta": "Community development decisions affect everyone, but not everyone is heard. CiCi Caver asks who gets a voice and how to widen the table.", "focus": "voice in community development", "keywords": "community development, resident voice, equitable development, civic participation, University Heights CIC, inclusive planning, Cuyahoga County", "article": "Every community development decision answers an unspoken question: who gets a voice? When a city plans a new development, rezones a corridor or chooses which projects to fund, some people help shape the outcome and others only find out after the fact.\n\nAs Chair of the University Heights City Beautiful Corporation, I take this question personally. Our community improvement corporation exists to support economic and civic development. That work can improve lives, but only if it reflects what residents and local businesses actually need.\n\nSo who usually gets a voice?\n\nProperty owners and developers, because they have money at stake and know how the process works. Longtime, connected residents, because they know the officials and attend meetings. Organized groups, because they can mobilize quickly. These voices matter. But they are not the whole community.\n\nWho often gets left out?\n\nRenters, who make up a significant share of residents in many communities but may assume they have no standing. Small business owners, who are too busy running their businesses to attend daytime hearings. Young people, who will live with the results longest. Seniors who cannot easily get to meetings. Residents who do not speak English as a first language. People who simply do not know a decision is being made.\n\nWorking in commercial real estate at Kowit gives me a view from another angle. I see how development decisions affect business owners trying to find affordable space. When a corridor changes, the businesses that serve the community can be helped or hurt depending on who was at the table.\n\nWhen voices are missing, development tends to serve the people who were present. That can lead to projects that look good but do not meet daily needs, rising costs that push out longtime residents and businesses, and a deep sense that change is happening to people instead of with them.\n\nHere is how I believe we can widen the table:\n\nShare information early and in plain language. People cannot weigh in on something they do not understand.\n\nMeet people where they are. Host conversations at libraries, schools, community centers and local businesses.\n\nOffer more ways to participate: online surveys, written comments, small group sessions and evening or weekend options.\n\nInvite underrepresented groups directly and personally.\n\nShow how input shaped the outcome.\n\nCommunity development is about more than buildings and budgets. It is about who a community is for. When more people help decide, the results are stronger, more trusted and more lasting. Everyone who lives and works in a place deserves a say in its future.", "resources": ["University Heights City Beautiful Corporation: meetings and minutes posted by the city", "City of University Heights Services for Older Adults: suggestion form for programs and services", "Heights Observer: a place for residents to share community news and opinions"], "talking": ["Every development decision answers the question of who gets a voice", "Property owners, developers and connected residents are usually heard", "Renters, small business owners, youth, seniors and non English speakers are often missed", "Missing voices lead to projects that do not meet daily needs", "Share early in plain language, meet people where they are, show how input mattered"], "linkedin": "As Chair of the University Heights City Beautiful Corporation, I keep asking one question: who is not at the table? Renters, small business owners, young people and seniors deserve a voice in how our community grows. Development works best when it is done with people, not to them.", "instagram": "Who gets to decide what your community becomes? Everyone who lives and works here should. #CommunityDevelopment #UniversityHeights #CivicEngagement #ResidentVoice #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": true}, {"id": 22, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "Why Local Government Decisions Affect Our Daily Lives", "seoTitle": "How Local Government Decisions Affect Daily Life", "meta": "Roads, schools, zoning and taxes are shaped close to home. CiCi Caver explains why local government affects daily life more than we realize.", "focus": "local government decisions", "keywords": "local government, city council, zoning, property taxes, municipal services, civic engagement, local elections", "article": "Most people pay more attention to national politics than to their city council. That makes sense. National news is louder and more dramatic. But when it comes to daily life, local government often has a much bigger impact.\n\nThink about your morning. The water you use, the road you drive on, the trash pickup, the street lights, the bus stop, the police and fire services, the parks your kids play in and the school they attend are all shaped by local decisions. The property taxes you pay and how they are spent are decided close to home.\n\nNow think about your business, if you have one. Zoning decides where you can operate. Permits decide how fast you can open. Signage rules decide how visible you can be. Parking requirements, inspection schedules and local incentives can make the difference between a business that thrives and one that struggles.\n\nIn my commercial real estate work, I see this constantly. A great property can be the wrong fit because of zoning. A business owner can lose months waiting on permits. A corridor can come alive or stall depending on whether the city invests in streetscapes, parking and safety. Local government is not abstract. It shows up in rent, traffic and customer flow.\n\nIn my role as Chair of the University Heights City Beautiful Corporation, I have a closer view of how local decisions are made. I have learned that many decisions happen in committee meetings and planning sessions that few residents attend. By the time an issue reaches a big public hearing, much of the direction may already be set.\n\nWhy does this matter? Because local government is where your voice carries the most weight. A handful of residents speaking up at a council meeting can change an outcome. Local elections are often decided by small margins. One email to a council member can get a pothole fixed or a concern added to an agenda.\n\nSo how can you stay connected?\n\nKnow who represents you. Learn the names of your mayor, council members and school board members.\n\nFollow agendas. Most cities post meeting agendas online ahead of time.\n\nVote in local elections. Turnout is often low, so every vote matters more.\n\nAttend at least one meeting a year. Just showing up teaches you a lot.\n\nJoin a board, commission or committee. Many cities need residents to serve.\n\nLocal government is where policy meets the sidewalk. The decisions made at city hall shape the quality of our daily lives in ways we often take for granted. When we pay attention and participate, we help build communities that work better for everyone.", "resources": ["City of University Heights website: council agendas, events and department contacts", "University Heights Housing Department: partners with the Cleveland Restoration Society Heritage Home Program for low interest home loans", "Home Energy Assistance Program (HEAP): state energy help, listed on the University Heights senior resources page"], "talking": ["Local government shapes water, roads, schools, safety, parks and taxes", "For businesses: zoning, permits, signage, parking and incentives", "Many decisions are shaped in committee meetings few residents attend", "Your voice carries the most weight locally", "Know your representatives, follow agendas, vote locally, show up"], "linkedin": "In commercial real estate, I see every day how zoning, permits and local investment shape whether a business thrives. Local government is where policy meets the sidewalk, and it is where your voice carries the most weight. Do you know who represents you?", "instagram": "Your roads, schools, parks and taxes are decided close to home. Pay attention to city hall. #LocalGovernment #VoteLocal #CivicEngagement #NortheastOhio #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": true}, {"id": 23, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "What Makes a Community Truly Inclusive?", "seoTitle": "What Makes a Community Truly Inclusive?", "meta": "Inclusion is more than a welcome sign. CiCi Caver shares what makes a community truly inclusive for residents, families and small businesses.", "focus": "inclusive community", "keywords": "inclusive community, belonging, accessibility, affordable housing, diverse neighborhoods, community programs, equitable development", "article": "Many communities describe themselves as welcoming. Some put it on signs, websites and banners. But being truly inclusive takes much more than a slogan. It shows up in who can afford to live there, who can get around, who feels safe and who has a say.\n\nI have lived and worked in Northeast Ohio for most of my life, and I have seen communities that talk about inclusion and communities that actually practice it. Here is what I believe separates the two.\n\nAffordability. A community cannot be inclusive if only certain incomes can afford to live or do business there. Housing options at different price points, reasonable commercial rents and accessible services make room for more people.\n\nAccessibility. Can a senior with a walker get to the grocery store? Can a parent with a stroller cross the street safely? Can someone without a car get to work? Physical access is a form of inclusion.\n\nRepresentation. Do the people on boards, committees and leadership roles reflect the community? When residents see people like themselves in leadership, they feel more connected.\n\nCommunication. Is information shared in ways everyone can access, including different languages, formats and channels?\n\nGathering places. Inclusive communities have parks, libraries, coffee shops and community centers where different people naturally cross paths.\n\nLocal business opportunity. Can residents start businesses in their own community? Are commercial spaces available and affordable for first time entrepreneurs?\n\nResponsiveness. When residents raise concerns, do leaders listen and act?\n\nThat business piece matters a lot to me. In my work at Kowit and with Cleveland Business Mentors, I meet entrepreneurs who want to open in the communities where they live. When affordable, suitable space is not available, they either go elsewhere or never start. That is a loss for everyone.\n\nAs Chair of the University Heights City Beautiful Corporation, I think about how our development efforts can make our community more inclusive, not less. Revitalization should open doors for people who are already here, not just attract new people while pushing others out.\n\nInclusion is not something a community achieves once. It is ongoing work, measured by daily experiences. The best test is simple: would every resident, regardless of income, age, ability or background, say they feel at home here?\n\nIf the answer is not yet, there is work to do. And that work is worth it. Inclusive communities are stronger, more creative and more resilient. They give everyone a reason to invest in the place they live.", "resources": ["Senior Partnership Program: University Heights seniors can use Cleveland Heights Senior Activity Center programs", "Heritage Home Program: low interest loans and technical help for older homes in University Heights", "Heights Emergency Food Center: food help for four Heights area cities", "ECDI Women's Business Center of Northern Ohio: opportunity for entrepreneurs of every background"], "talking": ["Inclusion takes more than a slogan", "Key ingredients: affordability, accessibility, representation, communication, gathering places", "Local business opportunity is a form of inclusion", "Revitalization should open doors for people already here", "The test: would every resident say they feel at home here?"], "linkedin": "A welcome sign does not make a community inclusive. Affordability, accessibility, representation and real opportunity for local entrepreneurs do. In my work with the University Heights City Beautiful Corporation, I measure success by one test: does every resident feel at home here?", "instagram": "Inclusion is not a slogan. It is a daily experience. Does everyone feel at home in your community? #InclusiveCommunity #Belonging #UniversityHeights #CommunityDevelopment #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cleveland Region"], "uh": true}, {"id": 24, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "Why Residents Should Understand How Their City Operates", "seoTitle": "Why Residents Should Understand How Their City Works", "meta": "Knowing how your city works helps you get things done. CiCi Caver explains why residents should understand budgets, departments and decisions.", "focus": "how cities work", "keywords": "how city government works, civic literacy, municipal budget, city departments, resident engagement, community improvement corporation, local decision making", "article": "Most of us know more about how our phones work than how our cities work. We know who to call when the internet goes down, but not always who to call when a sidewalk is broken, a vacant building becomes a problem or a business needs help navigating permits.\n\nI believe civic literacy, understanding how your local government operates, is one of the most practical skills a resident can have. It turns frustration into action.\n\nWhen I stepped into my role as Chair of the University Heights City Beautiful Corporation, I spent time learning how the pieces fit together: who sits on the board, how decisions get made, how the corporation relates to the city and what tools are available for development. Even as someone deeply involved in real estate and business, I found there was a lot to learn.\n\nHere are some basics every resident should understand.\n\nThe structure. Who is the mayor? What does council do? Which departments handle what? Knowing this saves time and gets results.\n\nThe budget. City budgets show priorities. Where the money goes tells you what leaders value. Most cities publish budgets online.\n\nThe calendar. Council meetings, committee meetings, planning commission hearings and budget sessions follow a schedule. Knowing it helps you show up at the right moment.\n\nThe tools. Cities use zoning, grants, tax incentives, land banks and community improvement corporations to shape development. Understanding these tools helps you understand why things happen the way they do.\n\nThe people. Staff members often know more about daily operations than elected officials. Building respectful relationships with them can make a big difference.\n\nWhy does this matter?\n\nBecause informed residents get better results. If you know which department handles code enforcement, your complaint goes to the right place.\n\nBecause understanding builds trust. When residents know how decisions are made, they are less likely to assume the worst.\n\nBecause it opens doors to participation. Once you understand how your city works, you can see where your skills fit: a board, a commission or a volunteer project.\n\nFor small business owners, this knowledge is especially valuable. Understanding permits, zoning and local incentives can save time and money. Through my work with Cleveland Business Mentors, I often help entrepreneurs figure out which city office to contact and what to ask.\n\nYou do not have to become an expert. Start small. Read your city's website. Attend one meeting. Call one department with a question. Every bit of knowledge makes you a more effective resident and a stronger voice for your community.", "resources": ["City of University Heights website: departments, agendas and posted CIC minutes", "University Heights Services for Older Adults, 2300 Warrensville Center Road, open weekdays", "University Heights Housing Department: home loan and grant programs for residents"], "talking": ["Civic literacy turns frustration into action", "Learn the structure, budget, calendar, tools and people", "Budgets show priorities", "Informed residents get better results and build trust", "For business owners, knowing permits and incentives saves time and money"], "linkedin": "Even with years in real estate and business, stepping into my role with the University Heights City Beautiful Corporation taught me how much there is to know about how a city works. Civic literacy turns frustration into results. Start with one meeting or one phone call.", "instagram": "You know how your phone works. Do you know how your city works? Start with one meeting. #CivicLiteracy #LocalGovernment #UniversityHeights #KnowYourCity #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": true}, {"id": 25, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "The Importance of Supporting Neighborhood Businesses", "seoTitle": "Why Supporting Neighborhood Businesses Matters", "meta": "Neighborhood businesses build jobs, character and local wealth. CiCi Caver explains why supporting local shops matters for every community.", "focus": "supporting neighborhood businesses", "keywords": "shop local, neighborhood businesses, local economy, small business support, commercial corridors, community wealth, Cleveland small business", "article": "I have been on both sides of the counter. As the owner of a retail boutique from 2008 to 2012, I know what it feels like when a regular customer walks in, and I know what a slow week does to a small business budget. Now, as a commercial real estate agent and community leader, I see the bigger picture of what neighborhood businesses mean to a community.\n\nNeighborhood businesses are more than places to shop. They are the heart of a community's identity.\n\nThey keep money local. When you spend at a locally owned business, more of that money stays in the community through local wages, local suppliers and local taxes.\n\nThey create jobs. Small businesses are often the first employers for young people and a stable source of work for neighbors.\n\nThey give a community character. Chain stores look the same everywhere. Local businesses reflect the people and culture of a place.\n\nThey build relationships. The barber who knows your kids, the restaurant owner who remembers your order and the shop owner who sponsors the little league team all help knit a community together.\n\nThey support property values. Healthy commercial corridors make neighborhoods more attractive to residents and investors.\n\nIn commercial real estate, I see the other side too. When a neighborhood business closes, it leaves more than an empty storefront. It can lower foot traffic for nearby businesses, make an area feel less safe and send a signal that the corridor is declining. Vacancy has a ripple effect.\n\nSupporting neighborhood businesses does not require big gestures. Here are simple ways to help:\n\nShop local first before ordering online.\n\nLeave positive reviews. A five star review costs nothing and helps a business get found.\n\nShare their posts on social media.\n\nRefer friends and family.\n\nAttend local events and pop ups.\n\nBe patient. Small businesses do not always have the staff or systems of big chains.\n\nCommunity leaders have a role too. Cities and organizations can support local businesses through fair permitting, small business grants, marketing help, affordable space and investments in streetscapes and parking. As Chair of the University Heights City Beautiful Corporation, I see strengthening our commercial corridors as one of the most important things we can do.\n\nEvery dollar you spend is a vote for the kind of community you want. When we choose neighborhood businesses, we choose a community with character, connection and opportunity.", "resources": ["Cleveland Business Mentors: free mentoring and workshops for local business owners", "Cuyahoga County Department of Development: business growth lending", "ECDI Women's Business Center of Northern Ohio: coaching and small business loans", "COSE: small business association and peer network"], "talking": ["I have been on both sides of the counter as a boutique owner and now a CRE agent", "Local businesses keep money local, create jobs and give communities character", "Vacancy has a ripple effect on nearby businesses and perceptions of safety", "Simple support: shop local, leave reviews, share posts, refer friends", "Every dollar is a vote for the community you want"], "linkedin": "As a former boutique owner, I know what one loyal customer means to a small business. As a commercial real estate agent, I know what one empty storefront means to a corridor. Supporting neighborhood businesses is one of the simplest ways to strengthen a community.", "instagram": "Every dollar is a vote for the community you want. Where are you spending yours this week? #ShopLocal #SmallBusiness #ClevelandSmallBusiness #SupportLocal #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 26, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "How Communities Can Better Support Aging Residents", "seoTitle": "How Communities Can Better Support Aging Residents", "meta": "Older residents are the backbone of many neighborhoods. CiCi Caver shares practical ways communities can help seniors age in place with dignity.", "focus": "supporting aging residents", "keywords": "aging in place, senior residents, age friendly communities, senior services, accessibility, intergenerational community, Cuyahoga County seniors", "article": "In many of our neighborhoods, older residents are the backbone. They are the ones who have kept homes up for decades, watched the block, served on church committees and remembered every business that ever opened on the corridor. Yet when communities plan for the future, seniors are often treated as an afterthought.\n\nThe number of older adults in Cuyahoga County is growing, and many want to stay in the homes and neighborhoods they love. Aging in place is not just a personal goal. It is good for communities. Longtime residents bring stability, history and a sense of continuity that newer residents benefit from.\n\nSo what do aging residents need?\n\nSafe, walkable streets. Even sidewalks, longer crosswalk signals, good lighting and benches make it possible to get around without a car.\n\nTransportation options. When driving becomes difficult, reliable transit, ride programs and nearby services become essential.\n\nHome repair help. Many seniors own their homes but struggle with the cost of roofs, furnaces and accessibility updates. Repair programs can be the difference between staying and leaving.\n\nNearby services. Grocery stores, pharmacies, doctors and banks within a short distance make independence possible.\n\nSocial connection. Isolation is one of the biggest risks for older adults. Libraries, senior centers, places of worship and community events keep people connected.\n\nInformation in accessible formats. Not every senior is online. Printed newsletters, phone trees and in person outreach still matter.\n\nIn my role as Chair of the University Heights City Beautiful Corporation, I think about how development can serve residents of every age. When we look at commercial corridors, we should ask whether they work for someone using a cane, someone who no longer drives or someone who wants a place to sit and visit.\n\nI also think about the business opportunity. Older residents are loyal customers. Businesses that offer accessible entrances, seating, clear signage and friendly service often earn their trust for years. In my boutique days, many of my clients were older women navigating hair loss, and I learned how much respect, patience and dignity mattered to them.\n\nCommunities can also build bridges between generations. Young people can help seniors with technology. Seniors can mentor young people. Intergenerational programs strengthen everyone involved.\n\nSupporting aging residents is not charity. It is respect for the people who built our communities, and it is planning for our own futures. Every one of us hopes to age somewhere we feel safe, connected and valued.", "resources": ["City of University Heights Services for Older Adults: 2300 Warrensville Center Road, weekdays 8:30 a.m. to 4:30 p.m.", "Senior Partnership Program: access to Cleveland Heights Senior Activity Center programs for UH seniors", "Topic Tuesdays: weekly programs at the University Heights library branch", "Home Repair Resource Center: senior repair program and home repair classes", "Cuyahoga County Senior Services and the state Home Energy Assistance Program"], "talking": ["Older residents bring stability, history and continuity", "Needs: walkable streets, transportation, home repair help, nearby services, connection", "Not every senior is online; print and in person outreach still matter", "Accessible businesses earn loyal older customers", "Intergenerational programs benefit everyone"], "linkedin": "Older residents are the backbone of many of our neighborhoods. When we plan commercial corridors and community programs, we should ask whether they work for someone who no longer drives or uses a cane. Supporting seniors is planning for all of our futures.", "instagram": "The people who built our neighborhoods deserve to grow older in them. #AgingInPlace #SeniorCommunity #AgeFriendly #CommunityDevelopment #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cuyahoga County"], "uh": true}, {"id": 27, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "Why Community Engagement Should Be More Than Public Meetings", "seoTitle": "Community Engagement Beyond Public Meetings", "meta": "Public meetings reach only a few residents. CiCi Caver shares creative ways to engage communities where people already live, work and gather.", "focus": "community engagement", "keywords": "community engagement strategies, public meetings, resident outreach, civic participation, inclusive engagement, listening sessions, local government", "article": "When cities and organizations want community input, the default is usually a public meeting. Set a date, book a room, post a notice and wait for people to show up. Then leaders wonder why the same small group attends every time.\n\nPublic meetings have their place. They create transparency and give residents a formal way to speak. But if they are the only form of engagement, they leave most of the community out.\n\nThink about who can attend a weeknight meeting at city hall. People with flexible schedules, reliable transportation, childcare and the confidence to speak in front of a crowd. That leaves out many working parents, shift workers, seniors, young people, renters and residents who feel intimidated by formal settings.\n\nI have attended many public meetings, and now as Chair of the University Heights City Beautiful Corporation, I help plan engagement. I have learned that if we want to hear from the whole community, we have to go beyond the podium.\n\nHere are approaches that work better.\n\nGo to where people already are. Set up a table at the library, a school event, a farmers market or a popular local business.\n\nUse short surveys. Many people will spend five minutes answering questions online or on paper who would never attend a two hour meeting.\n\nHost small conversations. Coffee chats, living room meetings and listening sessions feel less intimidating and allow real dialogue.\n\nPartner with trusted messengers. Faith leaders, coaches, business owners and neighborhood groups can reach people that official channels cannot.\n\nWalk the corridor. Walking tours with residents and business owners reveal things no meeting can.\n\nUse visual tools. Maps, photos and simple drawings help people react to ideas more easily than technical documents.\n\nMake it fun. Block parties, pop up events and community art projects can double as engagement.\n\nClose the loop. Share what you heard and what you are doing about it.\n\nMy marketing background shapes how I think about this. In marketing, you never expect customers to come to you on your terms. You meet them where they are, in language that speaks to them, through channels they already use. Community engagement should work the same way.\n\nThe goal of engagement is not to check a box. It is to understand what people need and to build trust. When residents see that leaders are making a real effort to hear from them, they are more likely to participate, support projects and stay invested in the community long term.", "resources": ["Topic Tuesdays at the University Heights library branch: an example of meeting residents where they already gather", "Heights Libraries branches: welcoming spaces for listening sessions", "Heights Observer: community news that reaches residents beyond city channels"], "talking": ["Public meetings reach only those with time, transportation and confidence", "Go where people are: libraries, schools, markets, local businesses", "Use surveys, small conversations, trusted messengers and walking tours", "Engagement should work like good marketing: meet people where they are", "Always close the loop by sharing what you heard and what changed"], "linkedin": "My marketing background taught me never to expect customers to come to me on my terms. Community engagement should work the same way. Libraries, coffee chats, walking tours and short surveys reach people that a weeknight meeting never will.", "instagram": "If the same ten people show up to every meeting, it is time to try something new. Meet people where they are. #CommunityEngagement #CivicParticipation #UniversityHeights #LocalLeadership #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": true}, {"id": 28, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "The Importance of Third Places: Where Communities Come Together", "seoTitle": "Third Places: Where Communities Come Together", "meta": "Coffee shops, libraries and barbershops build community. CiCi Caver explains why third places matter and how to protect and create them.", "focus": "third places", "keywords": "third places, community gathering spaces, social connection, libraries, coffee shops, barbershops, neighborhood identity", "article": "Sociologists use the term third places to describe the spaces outside home and work where people gather, relax and connect. Think coffee shops, barbershops, beauty salons, libraries, parks, diners, bookstores and community centers. These places may seem ordinary, but they are some of the most important parts of a healthy community.\n\nI know the power of a third place firsthand. My boutique was not just a store. For many women, it was a safe place to talk about hair loss, confidence and life. Customers stayed to chat, met each other and came back even when they did not need to buy anything. Beauty businesses, barbershops and salons have always played this role, especially in Black communities, where they have served as gathering spots, information hubs and sources of support.\n\nWhy do third places matter?\n\nThey reduce isolation. In a time when many people feel lonely, third places give us a reason to leave the house and be around others.\n\nThey build informal networks. Job leads, business ideas, community news and recommendations often travel through third places.\n\nThey cross boundaries. A good third place brings together people of different ages, incomes and backgrounds.\n\nThey build civic life. Conversations about the community often start in third places before they ever reach city hall.\n\nThey support local business. Most third places are small businesses or public institutions that anchor a corridor.\n\nIn commercial real estate, I pay attention to how third places affect a block. A busy coffee shop or a well loved diner draws foot traffic that helps nearby businesses. A vacant storefront where a gathering place used to be leaves a gap that goes beyond economics.\n\nAs Chair of the University Heights City Beautiful Corporation, I believe our commercial corridors should be places where people want to linger, not just pass through. That means thinking about seating, sidewalks, outdoor space, lighting and the mix of businesses.\n\nThird places are also under pressure. Rising rents, online shopping and changing habits make it harder for small gathering spots to survive. Libraries face budget pressure. Public spaces are sometimes designed to discourage people from staying.\n\nSo how can communities protect and create third places?\n\nSupport the ones you have. Spend money at local gathering spots and use your library.\n\nDesign for lingering. Benches, outdoor seating and public plazas invite people to stay.\n\nHelp small businesses afford space. Affordable commercial rent keeps gathering places alive.\n\nProgram public spaces. Events, markets and activities bring life to parks and plazas.\n\nThird places are where a neighborhood becomes a community. When we invest in them, we invest in connection itself.", "resources": ["Heights Libraries: four branches that serve as free third places for all ages", "Cleveland Heights Senior Activity Center: open to University Heights seniors through the Senior Partnership Program", "Cleveland Business Mentors: help for the small businesses that become neighborhood gathering spots"], "talking": ["Third places are spaces beyond home and work where people connect", "My boutique was a safe gathering place, like many salons and barbershops", "Third places reduce isolation, build networks and spark civic life", "They anchor corridors and draw foot traffic", "Protect them through support, design for lingering and affordable space"], "linkedin": "My boutique was more than a store. It was a place where women gathered, talked and supported each other. Third places like salons, barbershops, coffee shops and libraries are where neighborhoods become communities. Our commercial corridors should invite people to linger.", "instagram": "Where is your third place? The coffee shop, the barbershop, the library? These spaces hold communities together. #ThirdPlaces #CommunitySpaces #ShopLocal #Belonging #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 29, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "What Happens When Residents Stop Participating?", "seoTitle": "What Happens When Residents Stop Participating?", "meta": "Low civic participation weakens communities over time. CiCi Caver explains what is lost when residents disengage and how to bring them back.", "focus": "civic participation", "keywords": "civic participation, resident engagement, voter turnout, volunteerism, community trust, local democracy, civic disengagement", "article": "Communities rarely fall apart overnight. More often, they slowly weaken as residents stop participating. Fewer people vote in local elections. Fewer people volunteer. Fewer people attend meetings, join boards or help organize events. At first it seems like nothing has changed. Over time, everything does.\n\nI have seen what happens when participation drops, and I have seen what is possible when it rises. Here is what tends to happen when residents step back.\n\nDecisions get made by fewer people. When only a small group participates, their priorities shape the whole community. That may not reflect what most residents want.\n\nTrust erodes. When people are not involved, they are more likely to assume the worst about decisions they did not see being made.\n\nVolunteer organizations struggle. Many community groups, boards and nonprofits depend on volunteers. When participation drops, the same few people burn out.\n\nLocal businesses suffer. Engaged residents tend to shop locally, attend events and promote their community. Disengaged residents spend their time and money elsewhere.\n\nOpportunities are missed. Grants, programs and investments often require community input and support. Low participation can mean losing out.\n\nWhy do people stop participating? Usually not because they do not care. Common reasons include feeling unheard, lack of time, not understanding how things work, past disappointments and simply not being invited.\n\nIn my work with the University Heights City Beautiful Corporation and with Cleveland Business Mentors, I have learned that people come back when they see that their participation matters. One resident who sees their idea become reality will tell ten others.\n\nHere is how communities can rebuild participation:\n\nMake it easy. Short surveys, flexible meeting times and online options lower the barrier.\n\nMake it meaningful. Ask for input on real decisions, not ones that are already final.\n\nMake it personal. Invite people by name. Ask them to bring a neighbor.\n\nMake it visible. Celebrate volunteers and share the results of community input.\n\nMake it social. People are more likely to participate when it is enjoyable and connected to relationships.\n\nParticipation is like a muscle. When a community stops using it, it weakens. When a community exercises it regularly, it grows stronger. Each resident who shows up, speaks up or pitches in makes it easier for the next person to do the same.\n\nYour community needs your voice. Not someday. Now.", "resources": ["City of University Heights volunteer application: share your skills with the city", "Cleveland Business Mentors: volunteer as a mentor", "FRIENDS of the Heights Libraries: volunteer and support your library"], "talking": ["Communities weaken slowly when residents stop participating", "Results: fewer decision makers, lower trust, volunteer burnout, missed opportunities", "People disengage because they feel unheard, busy, confused or uninvited", "Make participation easy, meaningful, personal, visible and social", "Participation is a muscle that grows with use"], "linkedin": "Communities rarely fall apart overnight. They weaken slowly as people stop showing up. In my community work, I have seen how quickly participation grows when people see their input matter. Make it easy, meaningful and personal. Your community needs your voice.", "instagram": "Your community needs your voice. Not someday. Now. #CivicEngagement #ShowUp #VoteLocal #Volunteer #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": true}, {"id": 30, "category": 3, "categoryName": "Community Development and Civic Engagement", "title": "Why Economic Development Should Benefit Existing Residents", "seoTitle": "Economic Development Should Benefit Existing Residents", "meta": "Growth should lift the people already here. CiCi Caver explains how economic development can benefit existing residents and local businesses.", "focus": "equitable economic development", "keywords": "equitable economic development, existing residents, displacement, local hiring, small business support, community benefits, commercial revitalization", "article": "Economic development is often measured by new buildings, new businesses and new residents. Those things matter. But I believe the most important measure is simpler: are the people who already live here better off?\n\nToo often, development brings investment into a neighborhood while the people who stayed through hard times get left out or pushed out. Rents rise. Longtime businesses cannot afford new leases. The character of the community changes, and the benefits flow mostly to newcomers and outside investors.\n\nI see this question from several angles. As a commercial real estate agent at Kowit, I understand the value of investment and the role developers play. As a mentor with Cleveland Business Mentors, I see local entrepreneurs who want a fair chance to grow. As Chair of the University Heights City Beautiful Corporation, I am responsible for helping guide development in a way that serves our community. And as a resident and mom of four, I want my children to grow up in a place that lifts its own.\n\nSo what does development that benefits existing residents look like?\n\nLocal business opportunity. Make room for neighborhood entrepreneurs in new commercial spaces through affordable rents, flexible lease terms or small business incentives.\n\nLocal hiring. Encourage new businesses and projects to hire from the community.\n\nHousing options. Protect and build housing at different price points so longtime residents are not priced out.\n\nResident input. Involve residents early in shaping projects, not just reacting to them.\n\nWealth building. Help residents build ownership through homeownership programs, business ownership and investment opportunities.\n\nServices people need. Prioritize grocery stores, healthcare, childcare and everyday businesses, not just amenities that attract visitors.\n\nThis connects to what I call viability before visibility. A flashy development may get attention, but real success is whether it creates lasting value for the people around it. Do local businesses survive and grow? Do residents have better jobs and services? Do families feel more secure in their homes?\n\nDevelopment that benefits existing residents is also smarter business. Communities with stable, invested residents are safer, more loyal to local businesses and more supportive of future projects. Displacement may bring short term gains, but it often creates resentment and instability.\n\nGrowth and inclusion are not opposites. With thoughtful planning, we can attract investment and protect the people who make our communities what they are. The goal is not to stop change. It is to make sure change works for the people who are already here.", "resources": ["Cuyahoga County Department of Development: business lending and development programs", "ECDI Women's Business Center of Northern Ohio: capital and coaching for local entrepreneurs", "Heritage Home Program and Home Repair Resource Center: help longtime homeowners keep and improve their homes", "Cleveland Business Mentors: support for existing local businesses"], "talking": ["The best measure of development: are existing residents better off?", "Risks: rising rents, displaced businesses, benefits flowing to outsiders", "Strategies: local business space, local hiring, housing options, resident input, wealth building", "Viability before visibility applies to development too", "Growth and inclusion are not opposites"], "linkedin": "I see development from four angles: commercial real estate agent, business mentor, CIC Chair and resident. The question that matters most is the same from every angle: are the people who already live here better off? Growth and inclusion are not opposites.", "instagram": "Development should lift the people who stayed. Growth works best when it includes everyone already here. #EquitableDevelopment #CommunityFirst #EconomicDevelopment #UniversityHeights #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": [], "uh": false}, {"id": 31, "category": 4, "categoryName": "Cleveland and Northeast Ohio", "title": "What Makes Cleveland's East Side Unique?", "seoTitle": "What Makes Cleveland's East Side Unique?", "meta": "History, culture, institutions and neighborhood businesses make Cleveland's east side special. CiCi Caver shares what she loves and sees ahead.", "focus": "Cleveland east side", "keywords": "Cleveland east side, east side neighborhoods, University Circle, Cleveland Heights, Shaker Heights, University Heights, Northeast Ohio communities", "article": "Ask anyone from Cleveland and they will tell you the east side and west side have their own personalities. I have spent my life and career on the east side, and I believe it is one of the most interesting, layered and underappreciated parts of Northeast Ohio.\n\nWhat makes it unique?\n\nIts mix of communities. Within a short drive you can move from city neighborhoods with deep roots to inner ring suburbs like Cleveland Heights, University Heights and Shaker Heights, and out to growing suburbs further east. Each has its own history, housing style and business districts.\n\nIts institutions. The east side is home to world class hospitals, universities, museums and cultural centers. University Circle alone draws people from around the world. These anchors bring jobs, visitors and ideas.\n\nIts culture. The east side has a rich history of Black culture, immigrant communities, faith traditions, music and arts. Many families have been here for generations, and their stories shape the identity of neighborhoods.\n\nIts entrepreneurs. From barbershops and restaurants to retail shops and professional services, the east side is full of business owners who build quietly and serve loyally. I started my first business here in 2007, and I have seen how much creativity lives on these corridors.\n\nIts resilience. Parts of the east side have faced disinvestment, vacancy and economic hardship. But residents and business owners have stayed, organized and rebuilt. That resilience is a strength, not just a story.\n\nIn my commercial real estate work at Kowit, I spend a lot of time on east side corridors and in the suburbs of Cuyahoga County. I see opportunity everywhere: older commercial buildings ready for new life, neighborhoods with loyal customer bases and entrepreneurs looking for the right space to grow. I also see challenges: aging infrastructure, uneven investment and perceptions that do not match reality.\n\nAs a University Heights resident and Chair of the University Heights City Beautiful Corporation, I feel a personal stake in the east side's future. The corridor that connects Cleveland Heights and University Heights, for example, has incredible potential as a place where residents, students and families can live, shop and gather.\n\nThe east side's future depends on investment that respects its past. We need development that supports longtime residents, creates room for local entrepreneurs and celebrates the culture that makes these communities special.\n\nIf you have not explored the east side lately, I invite you to come see it for yourself. Visit a local restaurant, walk a business district, stop into a library or museum. You may be surprised by how much is here.", "resources": ["Heights Libraries local history resources: learn the stories of Cleveland Heights and University Heights", "Home Repair Resource Center: keeping the east side's older homes strong", "Heights Emergency Food Center: neighbors helping neighbors"], "talking": ["The east side blends city neighborhoods, inner ring suburbs and growing outer suburbs", "Major institutions bring jobs, visitors and ideas", "Rich history of Black culture, immigrant communities, faith and arts", "Resilient entrepreneurs and residents are a strength", "Future investment should respect the past and include longtime residents"], "linkedin": "I have built my life and career on Cleveland's east side. In commercial real estate, I see opportunity on every corridor: loyal customers, buildings ready for new life and entrepreneurs ready to grow. The east side's future depends on investment that respects its past.", "instagram": "East side proud. History, culture, resilience and so much opportunity. When did you last explore it? #ClevelandEastSide #ThisIsCLE #UniversityHeights #NortheastOhio #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Eastern Suburbs", "City of Cleveland", "Greater Cuyahoga County", "Greater Cleveland Region"], "uh": true}, {"id": 32, "category": 4, "categoryName": "Cleveland and Northeast Ohio", "title": "Exploring the Small Business Communities of Northeast Ohio", "seoTitle": "Exploring Northeast Ohio's Small Business Communities", "meta": "From city corridors to suburban downtowns, Northeast Ohio is full of small business communities. CiCi Caver shares what makes them thrive.", "focus": "Northeast Ohio small business", "keywords": "Northeast Ohio small business, Cleveland entrepreneurs, local business districts, small business community, Cuyahoga County business, shop local Ohio", "article": "Northeast Ohio does not have just one small business community. It has dozens. Each city, suburb and neighborhood has its own mix of shops, restaurants, service providers and makers, and each has its own personality.\n\nIn my work as a commercial real estate agent at Kowit, I market more than 30 active listings across the region, including retail, office, industrial and land. That work takes me into many different business communities, and I love seeing what makes each one tick.\n\nHere is what I have noticed.\n\nCity neighborhood corridors often have long histories and loyal customers. Family owned businesses may have served the same streets for decades. These corridors are deeply tied to the identity of the neighborhoods around them.\n\nInner ring suburbs often have walkable business districts with a mix of independent shops, restaurants and professional offices. They benefit from dense populations and residents who value local character.\n\nOuter suburbs often have shopping centers and strip plazas where small businesses sit alongside chains. Visibility and parking are strong, but building a community feel takes extra effort.\n\nIndustrial and service areas are home to contractors, manufacturers and trades businesses that may not have storefronts but are essential to the regional economy. I know this world personally through C Charles and Associates, the woman owned general contracting and property services company I founded in 2017.\n\nWhat makes a small business community thrive?\n\nA strong customer base nearby with real purchasing power.\n\nAffordable, suitable space for businesses at different stages.\n\nSupport networks like chambers of commerce, merchant associations and mentoring programs such as Cleveland Business Mentors.\n\nPublic investment in streetscapes, parking, lighting and safety.\n\nA mix of businesses that gives people a reason to visit and stay.\n\nCollaboration among business owners who promote each other instead of competing for scraps.\n\nOne thing that stands out across Northeast Ohio is the grit of our entrepreneurs. Many started with very little and built something lasting. Many are first generation business owners. Many are women and people of color building in communities that have not always made it easy.\n\nThe challenge is that not every business community gets the same attention or investment. Some corridors have active organizations and resources. Others are on their own. Part of my mission is to help connect entrepreneurs to resources and spaces where they can grow.\n\nIf you want to support Northeast Ohio, explore a business district you have never visited. Each one holds stories, flavors and talent worth discovering.", "resources": ["Cleveland Business Mentors: mentoring and cohorts across Cuyahoga County", "ECDI Women's Business Center of Northern Ohio: training and small business loans", "Ohio SBDC at Cleveland State University: free advising", "COSE and MORTAR Cleveland: peer networks and entrepreneurship programs"], "talking": ["Northeast Ohio has dozens of distinct small business communities", "City corridors, inner ring suburbs, outer suburbs and industrial areas each work differently", "Thriving districts need customers, affordable space, support networks and investment", "Our entrepreneurs have real grit, often starting with very little", "Not every corridor gets the same attention; connection to resources matters"], "linkedin": "Marketing more than 30 commercial listings takes me into business communities across Northeast Ohio. Each one has its own personality, and all of them share the grit of entrepreneurs who started with very little. Thriving districts need customers, affordable space and real support.", "instagram": "Northeast Ohio is full of small business gems. Pick a district you have never visited and go explore. #NortheastOhio #ShopLocalOhio #ClevelandSmallBusiness #Entrepreneurs #JustAskCC", "status": "Drafted", "notes": "", "publishDate": "", "custom": false, "areas": ["Greater Cleveland Region"], "uh": false}, {"id": 33, "category": 4, "categoryName": "Cleveland and Northeast Ohio", "title": "Why Cleveland's Neighborhood Business Districts Matter", "seoTitle": "Why Cleveland's Neighborhood Business Districts Matter", "meta": "Neighborhood business districts anchor Cleveland's communities. CiCi Caver explains their economic and social value and how to strengthen them.", "focus": "neighborhood business districts", "keywords": "neighborhood business districts, Cleveland corridors, commercial districts, local economy, walkable neighborhoods, community identity, small business support", "article": "Before shopping malls and online stores, neighborhood business districts were where people shopped, worked and gathered. In Cleveland, many of these districts grew up along streetcar lines, with storefronts lining the main streets of each neighborhood. Many of those buildings still stand today, and they still matter.\n\nNeighborhood business districts are more than places to buy things. They are the front porch of a community.\n\nThey create jobs close to home. Residents can work within walking distance, and young people can find first jobs nearby.\n\nThey keep money circulating locally. Locally owned businesses tend to buy from local suppliers and hire local workers.\n\nThey shape identity. A neighborhood's business district often defines how people see it, both residents and visitors.\n\nThey provide daily needs. Grocery stores, pharmacies, barbershops, laundromats and restaurants serve people who may not have easy access to car based shopping.\n\nThey create safety. Busy sidewalks, lit storefronts and business owners who know the neighborhood make streets feel safer.\n\nThey give entrepreneurs a starting point. Smaller, older storefronts often offer more affordable space for new businesses than newer developments.\n\nIn commercial real estate, I see both the promise and the struggles of these districts. Many have beautiful older buildings with character that newer construction cannot match. But they also face challenges: deferred maintenance, high vacancy in some areas, limited parking and competition from online retail and big box stores.\n\nWhen a neighborhood business district declines, the effects spread. Vacant storefronts attract fewer customers to nearby businesses. Property values can drop. Residents lose convenient services. The neighborhood loses part of its heart.\n\nWhen a district thrives, the opposite happens. Foot traffic grows, new businesses open, property owners invest and residents feel pride.\n\nSo what helps neighborhood business districts succeed?\n\nActive merchant associations or community development organizations that market and advocate for the district.\n\nStorefront improvement programs that help owners update facades and signage.\n\nEvents that bring people to the district, like markets, festivals and art walks.\n\nThe right business mix, with anchors that draw regular traffic.\n\nPartnerships between property owners, the city and local organizations.\n\nAffordable space for new entrepreneurs.\n\nAs Chair of the University Heights City Beautiful Corporation, I see our own commercial corridors as essential to our community's future. Cleveland and its surrounding suburbs have an incredible foundation of historic business districts. Investing in them is investing in neighborhoods themselves.", "resources": ["Cuyahoga County Department of Development: business growth lending and development programs", "Your city's economic development office: ask about storefront and busine
